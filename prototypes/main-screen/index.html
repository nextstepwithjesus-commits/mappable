</table><div class="sections"><section class="csec" aria-labelledby="s3"><h2 id="s3"><span class="snum">3</span> Кто это</h2><ul class="facts"><li class="fact "><span class="ft"><q class="cit">«Руфь Моавитянка»</q>, сноха Ноемини</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:22" aria-expanded="false">Руф 1:22</button></span></li></ul></section><section class="csec" aria-labelledby="s4"><h2 id="s4"><span class="snum">4</span> Родители</h2><ul class="facts"><li class="fact "><span class="ft">Отца и мать текст не называет; Вооз говорит: <q class="cit">«ты оставила твоего отца и твою мать и твою родину»</q></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 2:11" aria-expanded="false">Руф 2:11</button></span></li></ul></section><section class="csec" aria-labelledby="s5"><h2 id="s5"><span class="snum">5</span> Род и колено</h2><ul class="facts"><li class="fact "><span class="ft">Моавитянка</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:4" aria-expanded="false">Руф 1:4</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 1:22" aria-expanded="false">Руф 1:22</button></span></li></ul></section><section class="csec" aria-labelledby="s7"><h2 id="s7"><span class="snum">7</span> Семья</h2><ul class="facts"><li class="fact "><span class="ft">Махлон — муж: <q class="cit">«Руфь Моавитянку, жену Махлонову»</q>; детей от него текст не называет</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 4:10" aria-expanded="false">Руф 4:10</button></span></li><li class="fact "><span class="ft">Вооз — муж; сын Овид</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 4:13" aria-expanded="false">Руф 4:13</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 4:17" aria-expanded="false">Руф 4:17</button></span></li><li class="fact "><span class="ft">Об Овиде: <q class="cit">«Он отец Иессея, отца Давидова»</q></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 4:17" aria-expanded="false">Руф 4:17</button></span></li></ul></section><section class="csec" aria-labelledby="s9"><h2 id="s9"><span class="snum">9</span> Иное родство</h2><ul class="facts"><li class="fact "><span class="ft">Ноеминь — <q class="cit">«сноха ее Руфь Моавитянка»</q></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:22" aria-expanded="false">Руф 1:22</button></span></li></ul></section><section class="csec" aria-labelledby="s10"><h2 id="s10"><span class="snum">10</span> Время</h2><ul class="facts"><li class="fact "><span class="ft"><q class="cit">«В те дни, когда управляли судьи»</q> <button type="button" class="ref" data-ref="Руф 1:1" aria-expanded="false">Руф 1:1</button></span> </li><li class="fact "><span class="ft">Эпоха «Судьи»</span> <span class="cert simple">так следует из сравнения стихов</span><abbr class="cert study" title="вывод: следует из сравнения стихов">выв.</abbr><span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:1" aria-expanded="false">Руф 1:1</button></span></li></ul><p><a class="btn" href="#/time/p-ruf">Время</a></p></section><section class="csec" aria-labelledby="s11"><h2 id="s11"><span class="snum">11</span> Встречи и связи</h2><ul class="facts"><li class="fact "><span class="ft">Вооз — на поле и на гумне</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 2:8-14" aria-expanded="false">Руф 2:8–14</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 3:8-15" aria-expanded="false">Руф 3:8–15</button></span></li><li class="fact "><span class="ft">Ноеминь — не оставила свекровь</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:14-18" aria-expanded="false">Руф 1:14–18</button></span></li></ul></section><section class="csec" aria-labelledby="s12"><h2 id="s12"><span class="snum">12</span> Места</h2><ul class="facts"><li class="fact "><span class="ft">Поля Моавитские</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:4" aria-expanded="false">Руф 1:4</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 1:22" aria-expanded="false">Руф 1:22</button></span></li><li class="fact "><span class="ft">Вифлеем</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:19" aria-expanded="false">Руф 1:19</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 2:18" aria-expanded="false">Руф 2:18</button></span></li><li class="fact "><span class="ft">Поле и гумно Вооза</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 2:3" aria-expanded="false">Руф 2:3</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 3:6" aria-expanded="false">Руф 3:6</button></span></li></ul><p class="muted">География: для Руфи в эскизе не нарисована</p></section><section class="csec" aria-labelledby="s14"><h2 id="s14"><span class="snum">14</span> По порядку</h2><ul class="facts"><li class="fact "><span class="ft">Взята в жёны сыном Елимелеха; около десяти лет жила с семьёй Ноемини в Моаве</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:4" aria-expanded="false">Руф 1:4</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 4:10" aria-expanded="false">Руф 4:10</button></span></li><li class="fact "><span class="ft">Овдовела</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:5" aria-expanded="false">Руф 1:5</button></span></li><li class="fact "><span class="ft">Отказалась вернуться к своему народу и пошла с Ноеминью</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:14-18" aria-expanded="false">Руф 1:14–18</button></span></li><li class="fact "><span class="ft">Пришла с Ноеминью в Вифлеем в начале жатвы ячменя</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 1:22" aria-expanded="false">Руф 1:22</button></span></li><li class="fact "><span class="ft">Пошла подбирать колосья и попала на часть поля Вооза</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 2:2-3" aria-expanded="false">Руф 2:2–3</button></span></li><li class="fact "><span class="ft">Вооз оказал ей милость; она поклонилась ему до земли</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 2:8-13" aria-expanded="false">Руф 2:8–13</button></span></li><li class="fact "><span class="ft">Ела со жнецами; к вечеру набрала около ефы ячменя и отнесла свекрови</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 2:14" aria-expanded="false">Руф 2:14</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 2:17-18" aria-expanded="false">Руф 2:17–18</button></span></li><li class="fact "><span class="ft">По совету Ноемини пришла ночью на гумно и легла у ног Вооза</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 3:1-7" aria-expanded="false">Руф 3:1–7</button></span></li></ul><ul class="facts more-list" hidden><li class="fact "><span class="ft">Просила Вооза <q class="cit">«простри крыло твое на рабу твою»</q> <button type="button" class="ref" data-ref="Руф 3:9-13" aria-expanded="false">Руф 3:9–13</button>; он обещал выкуп</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 3:9-13" aria-expanded="false">Руф 3:9–13</button></span></li><li class="fact "><span class="ft">Получила от Вооза шесть мер ячменя</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 3:15" aria-expanded="false">Руф 3:15</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 3:17" aria-expanded="false">Руф 3:17</button></span></li><li class="fact "><span class="ft">Вооз при старейшинах взял её в жену</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 4:9-10" aria-expanded="false">Руф 4:9–10</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 4:13" aria-expanded="false">Руф 4:13</button></span></li><li class="fact "><span class="ft">Господь дал ей беременность, и она родила сына — Овида</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 4:13" aria-expanded="false">Руф 4:13</button><span class="sep">; </span><button type="button" class="ref" data-ref="Руф 4:17" aria-expanded="false">Руф 4:17</button></span></li><li class="fact "><span class="ft">Женщины назвали её снохой, которая <q class="cit">«лучше семи сыновей»</q> <button type="button" class="ref" data-ref="Руф 4:15" aria-expanded="false">Руф 4:15</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 4:15" aria-expanded="false">Руф 4:15</button></span></li></ul><button type="button" class="morebtn" aria-expanded="false">ещё 5</button></section><section class="csec" aria-labelledby="s15"><h2 id="s15"><span class="snum">15</span> Слова</h2><ul class="facts"><li class="fact"><span class="ft"><q class="cit">«куда ты пойдешь, туда и я пойду, и где ты жить будешь, там и я буду жить; народ твой будет моим народом, и твой Бог — моим Богом»</q> <span class="ctx">Ноемини</span></span> <span class="refs"><button type="button" class="ref" data-ref="Руф 1:16" aria-expanded="false">Руф 1:16</button></span></li><li class="fact"><span class="ft"><q class="cit">«смерть одна разлучит меня с тобою»</q> </span> <span class="refs"><button type="button" class="ref" data-ref="Руф 1:17" aria-expanded="false">Руф 1:17</button></span></li><li class="fact"><span class="ft"><q class="cit">«чем снискала я в глазах твоих милость, что ты принимаешь меня, хотя я и чужеземка?»</q> <span class="ctx">Воозу</span></span> <span class="refs"><button type="button" class="ref" data-ref="Руф 2:10" aria-expanded="false">Руф 2:10</button></span></li><li class="fact"><span class="ft"><q class="cit">«простри крыло твое на рабу твою, ибо ты родственник»</q> <span class="ctx">Воозу на гумне</span></span> <span class="refs"><button type="button" class="ref" data-ref="Руф 3:9" aria-expanded="false">Руф 3:9</button></span></li></ul></section><section class="csec" aria-labelledby="s16"><h2 id="s16"><span class="snum">16</span> Перед Богом</h2><ul class="facts"><li class="fact "><span class="ft">Пришла к Господу Богу Израилеву, <q class="cit">«чтоб успокоиться под Его крылами»</q> <button type="button" class="ref" data-ref="Руф 2:12" aria-expanded="false">Руф 2:12</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 2:12" aria-expanded="false">Руф 2:12</button></span></li><li class="fact "><span class="ft"><q class="cit">«Господь дал ей беременность»</q> <button type="button" class="ref" data-ref="Руф 4:13" aria-expanded="false">Руф 4:13</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 4:13" aria-expanded="false">Руф 4:13</button></span></li></ul></section><section class="csec" aria-labelledby="s18"><h2 id="s18"><span class="snum">18</span> В родословии Иисуса Христа</h2><ul class="facts"><li class="fact "><span class="ft">Названа у Матфея: <q class="cit">«Вооз родил Овида от Руфи»</q> <button type="button" class="ref" data-ref="Мф 1:5" aria-expanded="false">Мф 1:5</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Мф 1:5" aria-expanded="false">Мф 1:5</button></span></li></ul></section><section class="csec" aria-labelledby="s19"><h2 id="s19"><span class="snum">19</span> В других книгах</h2><ul class="facts"><li class="fact "><span class="ft">В родословии Иисуса Христа</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Мф 1:5" aria-expanded="false">Мф 1:5</button></span></li></ul></section><section class="csec" aria-labelledby="s20"><h2 id="s20"><span class="snum">20</span> Места Писания</h2><p>Имя стоит в 20 стихах — счёт эскиза по форме имени. Впервые — <button type="button" class="ref" data-ref="Руф 1:4" aria-expanded="false">Руф 1:4</button></p>

<script type="application/json" id="data">{"verses":{"Быт 5:1":"Вот родословие Адама: когда Бог сотворил человека, по подобию Божию создал его,","Быт 5:2":"мужчину и женщину сотворил их, и благословил их, и нарек им имя: человек, в день сотворения их.","Быт 5:3":"Адам жил сто тридцать [230] лет и родил [сына] по подобию своему [и] по образу своему, и нарек ему имя: Сиф.","Быт 5:4":"Дней Адама по рождении им Сифа было восемьсот [700] лет, и родил он сынов и дочерей.","Быт 5:5":"Всех же дней жизни Адамовой было девятьсот тридцать лет; и он умер.","Быт 5:6":"Сиф жил сто пять [205] лет и родил Еноса.","Быт 5:7":"По рождении Еноса Сиф жил восемьсот семь [707] лет и родил сынов и дочерей.","Быт 5:8":"Всех же дней Сифовых было девятьсот двенадцать лет; и он умер.","Быт 5:9":"Енос жил девяносто [190] лет и родил Каинана.","Быт 5:10":"По рождении Каинана Енос жил восемьсот пятнадцать [715] лет и родил сынов и дочерей.","Быт 5:11":"Всех же дней Еноса было девятьсот пять лет; и он умер.","Быт 5:12":"Каинан жил семьдесят [170] лет и родил Малелеила.","Быт 5:13":"По рождении Малелеила Каинан жил восемьсот сорок [740] лет и родил сынов и дочерей.","Быт 5:14":"Всех же дней Каинана было девятьсот десять лет; и он умер.","Быт 5:15":"Малелеил жил шестьдесят пять [165] лет и родил Иареда.","Быт 5:16":"По рождении Иареда Малелеил жил восемьсот тридцать [730] лет и родил сынов и дочерей.","Быт 5:17":"Всех же дней Малелеила было восемьсот девяносто пять лет; и он умер.","Быт 5:18":"Иаред жил сто шестьдесят два года и родил Еноха.","Быт 5:19":"По рождении Еноха Иаред жил восемьсот лет и родил сынов и дочерей.","Быт 5:20":"Всех же дней Иареда было девятьсот шестьдесят два года; и он умер.","Быт 5:21":"Енох жил шестьдесят пять [165] лет и родил Мафусала.","Быт 5:22":"И ходил Енох пред Богом, по рождении Мафусала, триста [200] лет и родил сынов и дочерей.","Быт 5:23":"Всех же дней Еноха было триста шестьдесят пять лет.","Быт 5:24":"И ходил Енох пред Богом; и не стало его, потому что Бог взял его.","Быт 5:25":"Мафусал жил сто восемьдесят семь лет и родил Ламеха.","Быт 5:26":"По рождении Ламеха Мафусал жил семьсот восемьдесят два года и родил сынов и дочерей.","Быт 5:27":"Всех же дней Мафусала было девятьсот шестьдесят девять лет; и он умер.","Быт 5:28":"Ламех жил сто восемьдесят два [188] года и родил сына,","Быт 5:29":"и нарек ему имя: Ной, сказав: он утешит нас в работе нашей и в трудах рук наших при возделывании земли, которую проклял Господь [Бог].","Быт 5:30":"И жил Ламех по рождении Ноя пятьсот девяносто пять [565] лет и родил сынов и дочерей.","Быт 5:31":"Всех же дней Ламеха было семьсот семьдесят семь [753] лет; и он умер.","Быт 5:32":"Ною было пятьсот лет и родил Ной [трех сынов]: Сима, Хама и Иафета.","Быт 6:1":"Когда люди начали умножаться на земле и родились у них дочери,","Быт 6:2":"тогда сыны Божии увидели дочерей человеческих, что они красивы, и брали их себе в жены, какую кто избрал.","Быт 6:3":"И сказал Господь [Бог]: не вечно Духу Моему быть пренебрегаемым человеками [сими], потому что они плоть; пусть будут дни их сто двадцать лет.","Быт 6:4":"В то время были на земле исполины, особенно же с того времени, как сыны Божии стали входить к дочерям человеческим, и они стали рождать им: это сильные, издревле славные люди.","Быт 6:5":"И увидел Господь [Бог], что велико развращение человеков на земле, и что все мысли и помышления сердца их были зло во всякое время;","Быт 6:6":"и раскаялся Господь, что создал человека на земле, и восскорбел в сердце Своем.","Быт 6:7":"И сказал Господь: истреблю с лица земли человеков, которых Я сотворил, от человека до скотов, и гадов и птиц небесных истреблю, ибо Я раскаялся, что создал их.","Быт 6:8":"Ной же обрел благодать пред очами Господа [Бога].","Быт 6:9":"Вот житие Ноя: Ной был человек праведный и непорочный в роде своем; Ной ходил пред Богом.","Быт 6:10":"Ной родил трех сынов: Сима, Хама и Иафета.","Быт 6:11":"Но земля растлилась пред лицем Божиим, и наполнилась земля злодеяниями.","Быт 6:12":"И воззрел [Господь] Бог на землю, и вот, она растленна, ибо всякая плоть извратила путь свой на земле.","Быт 6:13":"И сказал [Господь] Бог Ною: конец всякой плоти пришел пред лице Мое, ибо земля наполнилась от них злодеяниями; и вот, Я истреблю их с земли.","Быт 6:14":"Сделай себе ковчег из дерева гофер; отделения сделай в ковчеге и осмоли его смолою внутри и снаружи.","Быт 6:15":"И сделай его так: длина ковчега триста локтей; ширина его пятьдесят локтей, а высота его тридцать локтей.","Быт 6:16":"И сделай отверстие в ковчеге, и в локоть сведи его вверху, и дверь в ковчег сделай с боку его; устрой в нем нижнее, второе и третье [жилье].","Быт 6:17":"И вот, Я наведу на землю потоп водный, чтоб истребить всякую плоть, в которой есть дух жизни, под небесами; все, что есть на земле, лишится жизни.","Быт 6:18":"Но с тобою Я поставлю завет Мой, и войдешь в ковчег ты, и сыновья твои, и жена твоя, и жены сынов твоих с тобою.","Быт 6:19":"Введи также в ковчег [из всякого скота, и из всех гадов, и] из всех животных, и от всякой плоти по паре, чтоб они остались с тобою в живых; мужеского пола и женского пусть они будут.","Быт 6:20":"Из [всех] птиц по роду их, и из [всех] скотов по роду их, и из всех пресмыкающихся по земле по роду их, из всех по паре войдут к тебе, чтобы остались в живых [с тобою, мужеского пола и женского].","Быт 6:21":"Ты же возьми себе всякой пищи, какою питаются, и собери к себе; и будет она для тебя и для них пищею.","Быт 6:22":"И сделал Ной всё: как повелел ему [Господь] Бог, так он и сделал.","Быт 7:1":"И сказал Господь [Бог] Ною: войди ты и все семейство твое в ковчег, ибо тебя увидел Я праведным предо Мною в роде сем;","Быт 7:2":"и всякого скота чистого возьми по семи, мужеского пола и женского, а из скота нечистого по два, мужеского пола и женского;","Быт 7:3":"также и из птиц небесных [чистых] по семи, мужеского пола и женского, [и из всех птиц нечистых по две, мужеского пола и женского,] чтобы сохранить племя для всей земли,","Быт 7:4":"ибо чрез семь дней Я буду изливать дождь на землю сорок дней и сорок ночей; и истреблю все существующее, что Я создал, с лица земли.","Быт 7:5":"Ной сделал все, что Господь [Бог] повелел ему.","Быт 7:6":"Ной же был шестисот лет, как потоп водный пришел на землю.","Быт 7:7":"И вошел Ной и сыновья его, и жена его, и жены сынов его с ним в ковчег от вод потопа.","Быт 7:8":"И [из птиц чистых и из птиц нечистых, и] из скотов чистых и из скотов нечистых, [и из зверей] и из всех пресмыкающихся по земле","Быт 7:9":"по паре, мужеского пола и женского, вошли к Ною в ковчег, как [Господь] Бог повелел Ною.","Быт 7:10":"Чрез семь дней воды потопа пришли на землю.","Быт 7:11":"В шестисотый год жизни Ноевой, во второй месяц, в семнадцатый [27] день месяца, в сей день разверзлись все источники великой бездны, и окна небесные отворились;","Быт 7:12":"и лился на землю дождь сорок дней и сорок ночей.","Быт 7:13":"В сей самый день вошел в ковчег Ной, и Сим, Хам и Иафет, сыновья Ноевы, и жена Ноева, и три жены сынов его с ними.","Быт 7:14":"Они, и все звери [земли] по роду их, и всякий скот по роду его, и все гады, пресмыкающиеся по земле, по роду их, и все летающие по роду их, все птицы, все крылатые,","Быт 7:15":"и вошли к Ною в ковчег по паре [мужеского пола и женского] от всякой плоти, в которой есть дух жизни;","Быт 7:16":"и вошедшие [к Ною в ковчег] мужеский и женский пол всякой плоти вошли, как повелел ему [Господь] Бог. И затворил Господь [Бог] за ним [ковчег].","Быт 7:17":"И продолжалось на земле наводнение сорок дней [и сорок ночей], и умножилась вода, и подняла ковчег, и он возвысился над землею;","Быт 7:18":"вода же усиливалась и весьма умножалась на земле, и ковчег плавал по поверхности вод.","Быт 7:19":"И усилилась вода на земле чрезвычайно, так что покрылись все высокие горы, какие есть под всем небом;","Быт 7:20":"на пятнадцать локтей поднялась над ними вода, и покрылись [все высокие] горы.","Быт 7:21":"И лишилась жизни всякая плоть, движущаяся по земле, и птицы, и скоты, и звери, и все гады, ползающие по земле, и все люди;","Быт 7:22":"все, что имело дыхание духа жизни в ноздрях своих на суше, умерло.","Быт 7:23":"Истребилось всякое существо, которое было на поверхности [всей] земли; от человека до скота, и гадов, и птиц небесных, — все истребилось с земли, остался только Ной и что было с ним в ковчеге.","Быт 7:24":"Вода же усиливалась на земле сто пятьдесят дней.","Быт 10:2":"Сыны Иафета: Гомер, Магог, Мадай, Иаван, [Елиса,] Фувал, Мешех и Фирас.","Быт 10:6":"Сыны Хама: Хуш, Мицраим, Фут и Ханаан.","Быт 10:22":"Сыны Сима: Елам, Ассур, Арфаксад, Луд, Арам [и Каинан].","Быт 11:1":"На всей земле был один язык и одно наречие.","Быт 11:2":"Двинувшись с востока, они нашли в земле Сеннаар равнину и поселились там.","Быт 11:3":"И сказали друг другу: наделаем кирпичей и обожжем огнем. И стали у них кирпичи вместо камней, а земляная смола вместо извести.","Быт 11:4":"И сказали они: построим себе город и башню, высотою до небес, и сделаем себе имя, прежде нежели рассеемся по лицу всей земли.","Быт 11:5":"И сошел Господь посмотреть город и башню, которые строили сыны человеческие.","Быт 11:6":"И сказал Господь: вот, один народ, и один у всех язык; и вот что начали они делать, и не отстанут они от того, что задумали делать;","Быт 11:7":"сойдем же и смешаем там язык их, так чтобы один не понимал речи другого.","Быт 11:8":"И рассеял их Господь оттуда по всей земле; и они перестали строить город [и башню].","Быт 11:9":"Посему дано ему имя: Вавилон, ибо там смешал Господь язык всей земли, и оттуда рассеял их Господь по всей земле.","Быт 11:10":"Вот родословие Сима: Сим был ста лет и родил Арфаксада, чрез два года после потопа;","Быт 11:11":"по рождении Арфаксада Сим жил пятьсот лет и родил сынов и дочерей [и умер].","Быт 11:12":"Арфаксад жил тридцать пять [135] лет и родил [Каинана. По рождении Каинана Арфаксад жил триста тридцать лет и родил сынов и дочерей и умер. Каинан жил сто тридцать лет, и родил] Салу.","Быт 11:13":"По рождении Салы Арфаксад [Каинан] жил четыреста три [330] года и родил сынов и дочерей [и умер].","Быт 11:14":"Сала жил тридцать [130] лет и родил Евера.","Быт 11:15":"По рождении Евера Сала жил четыреста три [330] года и родил сынов и дочерей [и умер].","Быт 11:16":"Евер жил тридцать четыре [134] года и родил Фалека.","Быт 11:17":"По рождении Фалека Евер жил четыреста тридцать [370] лет и родил сынов и дочерей [и умер].","Быт 11:18":"Фалек жил тридцать [130] лет и родил Рагава.","Быт 11:19":"По рождении Рагава Фалек жил двести девять лет и родил сынов и дочерей [и умер].","Быт 11:20":"Рагав жил тридцать два [132] года и родил Серуха.","Быт 11:21":"По рождении Серуха Рагав жил двести семь лет и родил сынов и дочерей [и умер].","Быт 11:22":"Серух жил тридцать [130] лет и родил Нахора.","Быт 11:23":"По рождении Нахора Серух жил двести лет и родил сынов и дочерей [и умер].","Быт 11:24":"Нахор жил двадцать девять [79] лет и родил Фарру.","Быт 11:25":"По рождении Фарры Нахор жил сто девятнадцать [129] лет и родил сынов и дочерей [и умер].","Быт 11:26":"Фарра жил семьдесят лет и родил Аврама, Нахора и Арана.","Быт 11:27":"Вот родословие Фарры: Фарра родил Аврама, Нахора и Арана. Аран родил Лота.","Быт 11:28":"И умер Аран при Фарре, отце своем, в земле рождения своего, в Уре Халдейском.","Быт 11:29":"Аврам и Нахор взяли себе жен; имя жены Аврамовой: Сара; имя жены Нахоровой: Милка, дочь Арана, отца Милки и отца Иски.","Быт 11:30":"И Сара была неплодна и бездетна.","Быт 11:31":"И взял Фарра Аврама, сына своего, и Лота, сына Аранова, внука своего, и Сару, невестку свою, жену Аврама, сына своего, и вышел с ними из Ура Халдейского, чтобы идти в землю Ханаанскую; но, дойдя до Харрана, они остановились там.","Быт 11:32":"И было дней жизни Фарры [в Харранской земле] двести пять лет, и умер Фарра в Харране.","Быт 12:1":"И сказал Господь Авраму: пойди из земли твоей, от родства твоего и из дома отца твоего [и иди] в землю, которую Я укажу тебе;","Быт 12:2":"и Я произведу от тебя великий народ, и благословлю тебя, и возвеличу имя твое, и будешь ты в благословение;","Быт 12:3":"Я благословлю благословляющих тебя, и злословящих тебя прокляну; и благословятся в тебе все племена земные.","Быт 12:4":"И пошел Аврам, как сказал ему Господь; и с ним пошел Лот. Аврам был семидесяти пяти лет, когда вышел из Харрана.","Быт 12:5":"И взял Аврам с собою Сару, жену свою, Лота, сына брата своего, и все имение, которое они приобрели, и всех людей, которых они имели в Харране; и вышли, чтобы идти в землю Ханаанскую; и пришли в землю Ханаанскую.","Быт 12:6":"И прошел Аврам по земле сей [по длине ее] до места Сихема, до дубравы Море. В этой земле тогда [жили] Хананеи.","Быт 12:7":"И явился Господь Авраму и сказал [ему]: потомству твоему отдам Я землю сию. И создал там [Аврам] жертвенник Господу, Который явился ему.","Быт 12:8":"Оттуда двинулся он к горе, на восток от Вефиля; и поставил шатер свой так, что от него Вефиль был на запад, а Гай на восток; и создал там жертвенник Господу и призвал имя Господа [явившегося ему].","Быт 12:9":"И поднялся Аврам и продолжал идти к югу.","Быт 12:10":"И был голод в той земле. И сошел Аврам в Египет, пожить там, потому что усилился голод в земле той.","Быт 12:11":"Когда же он приближался к Египту, то сказал Саре, жене своей: вот, я знаю, что ты женщина, прекрасная видом;","Быт 12:12":"и когда Египтяне увидят тебя, то скажут: это жена его; и убьют меня, а тебя оставят в живых;","Быт 12:13":"скажи же, что ты мне сестра, дабы мне хорошо было ради тебя, и дабы жива была душа моя чрез тебя.","Быт 12:14":"И было, когда пришел Аврам в Египет, Египтяне увидели, что она женщина весьма красивая;","Быт 12:15":"увидели ее и вельможи фараоновы и похвалили ее фараону; и взята была она в дом фараонов.","Быт 12:16":"И Авраму хорошо было ради ее; и был у него мелкий и крупный скот и ослы, и рабы и рабыни, и лошаки и верблюды.","Быт 12:17":"Но Господь поразил тяжкими ударами фараона и дом его за Сару, жену Аврамову.","Быт 12:18":"И призвал фараон Аврама и сказал: что ты это сделал со мною? для чего не сказал мне, что она жена твоя?","Быт 12:19":"для чего ты сказал: она сестра моя? и я взял было ее себе в жену. И теперь вот жена твоя; возьми [ее] и пойди.","Быт 12:20":"И дал о нем фараон повеление людям, и проводили его, и жену его, и все, что у него было, [и Лота с ним].","Быт 13:1":"И поднялся Аврам из Египта, сам и жена его, и всё, что у него было, и Лот с ним, на юг.","Быт 13:2":"И был Аврам очень богат скотом, и серебром, и золотом.","Быт 13:3":"И продолжал он переходы свои от юга до Вефиля, до места, где прежде был шатер его между Вефилем и между Гаем,","Быт 13:4":"до места жертвенника, который он сделал там вначале; и там призвал Аврам имя Господа.","Быт 13:5":"И у Лота, который ходил с Аврамом, также был мелкий и крупный скот и шатры.","Быт 13:6":"И непоместительна была земля для них, чтобы жить вместе, ибо имущество их было так велико, что они не могли жить вместе.","Быт 13:7":"И был спор между пастухами скота Аврамова и между пастухами скота Лотова; и Хананеи и Ферезеи жили тогда в той земле.","Быт 13:8":"И сказал Аврам Лоту: да не будет раздора между мною и тобою, и между пастухами моими и пастухами твоими, ибо мы родственники;","Быт 13:9":"не вся ли земля пред тобою? отделись же от меня: если ты налево, то я направо; а если ты направо, то я налево.","Быт 13:10":"Лот возвел очи свои и увидел всю окрестность Иорданскую, что она, прежде нежели истребил Господь Содом и Гоморру, вся до Сигора орошалась водою, как сад Господень, как земля Египетская;","Быт 13:11":"и избрал себе Лот всю окрестность Иорданскую; и двинулся Лот к востоку. И отделились они друг от друга.","Быт 13:12":"Аврам стал жить на земле Ханаанской; а Лот стал жить в городах окрестности и раскинул шатры до Содома.","Быт 13:14":"И сказал Господь Авраму, после того как Лот отделился от него: возведи очи твои и с места, на котором ты теперь, посмотри к северу и к югу, и к востоку и к западу;","Быт 13:15":"ибо всю землю, которую ты видишь, тебе дам Я и потомству твоему навеки,","Быт 13:16":"и сделаю потомство твое, как песок земной; если кто может сосчитать песок земной, то и потомство твое сочтено будет;","Быт 13:17":"встань, пройди по земле сей в долготу и в широту ее, ибо Я тебе дам ее [и потомству твоему навсегда].","Быт 13:18":"И двинул Аврам шатер, и пошел, и поселился у дубравы Мамре, что в Хевроне; и создал там жертвенник Господу.","Быт 14:12":"И взяли Лота, племянника Аврамова, жившего в Содоме, и имущество его и ушли.","Быт 14:13":"И пришел один из уцелевших и известил Аврама Еврея, жившего тогда у дубравы Мамре, Аморреянина, брата Эшколу и брата Анеру, которые были союзники Аврамовы.","Быт 14:14":"Аврам, услышав, что [Лот] сродник его взят в плен, вооружил рабов своих, рожденных в доме его, триста восемнадцать, и преследовал неприятелей до Дана;","Быт 14:15":"и, разделившись, напал на них ночью, сам и рабы его, и поразил их, и преследовал их до Ховы, что по левую сторону Дамаска;","Быт 14:16":"и возвратил все имущество и Лота, сродника своего, и имущество его возвратил, также и женщин и народ.","Быт 14:17":"Когда он возвращался после поражения Кедорлаомера и царей, бывших с ним, царь Содомский вышел ему навстречу в долину Шаве, что ныне долина царская;","Быт 14:18":"и Мелхиседек, царь Салимский, вынес хлеб и вино, — он был священник Бога Всевышнего, —","Быт 14:19":"и благословил его, и сказал: благословен Аврам от Бога Всевышнего, Владыки неба и земли;","Быт 14:20":"и благословен Бог Всевышний, Который предал врагов твоих в руки твои. [Аврам] дал ему десятую часть из всего.","Быт 14:21":"И сказал царь Содомский Авраму: отдай мне людей, а имение возьми себе.","Быт 14:22":"Но Аврам сказал царю Содомскому: поднимаю руку мою к Господу Богу Всевышнему, Владыке неба и земли,","Быт 14:23":"что даже нитки и ремня от обуви не возьму из всего твоего, чтобы ты не сказал: я обогатил Аврама;","Быт 14:24":"кроме того, что съели отроки, и кроме доли, принадлежащей людям, которые ходили со мною; Анер, Эшкол и Мамрий пусть возьмут свою долю.","Быт 15:1":"После сих происшествий было слово Господа к Авраму в видении [ночью], и сказано: не бойся, Аврам; Я твой щит; награда твоя [будет] весьма велика.","Быт 15:2":"Аврам сказал: Владыка Господи! что Ты дашь мне? я остаюсь бездетным; распорядитель в доме моем этот Елиезер из Дамаска.","Быт 15:3":"И сказал Аврам: вот, Ты не дал мне потомства, и вот, домочадец мой наследник мой.","Быт 15:4":"И было слово Господа к нему, и сказано: не будет он твоим наследником, но тот, кто произойдет из чресл твоих, будет твоим наследником.","Быт 15:5":"И вывел его вон и сказал [ему]: посмотри на небо и сосчитай звезды, если ты можешь счесть их. И сказал ему: столько будет у тебя потомков.","Быт 15:6":"Аврам поверил Господу, и Он вменил ему это в праведность.","Быт 15:7":"И сказал ему: Я Господь, Который вывел тебя из Ура Халдейского, чтобы дать тебе землю сию во владение.","Быт 15:8":"Он сказал: Владыка Господи! по чему мне узнать, что я буду владеть ею?","Быт 15:9":"Господь сказал ему: возьми Мне трехлетнюю телицу, трехлетнюю козу, трехлетнего овна, горлицу и молодого голубя.","Быт 15:10":"Он взял всех их, рассек их пополам и положил одну часть против другой; только птиц не рассек.","Быт 15:11":"И налетели на трупы хищные птицы; но Аврам отгонял их.","Быт 15:12":"При захождении солнца крепкий сон напал на Аврама, и вот, напал на него ужас и мрак великий.","Быт 15:13":"И сказал Господь Авраму: знай, что потомки твои будут пришельцами в земле не своей, и поработят их, и будут угнетать их четыреста лет,","Быт 15:14":"но Я произведу суд над народом, у которого они будут в порабощении; после сего они выйдут [сюда] с большим имуществом,","Быт 15:15":"а ты отойдешь к отцам твоим в мире и будешь погребен в старости доброй;","Быт 15:16":"в четвертом роде возвратятся они сюда: ибо мера беззаконий Аморреев доселе еще не наполнилась.","Быт 15:17":"Когда зашло солнце и наступила тьма, вот, дым как бы из печи и пламя огня прошли между рассеченными животными.","Быт 15:18":"В этот день заключил Господь завет с Аврамом, сказав: потомству твоему даю Я землю сию, от реки Египетской до великой реки, реки Евфрата:","Быт 15:19":"Кенеев, Кенезеев, Кедмонеев,","Быт 15:20":"Хеттеев, Ферезеев, Рефаимов,","Быт 15:21":"Аморреев, Хананеев, [Евеев], Гергесеев и Иевусеев.","Быт 16:1":"Но Сара, жена Аврамова, не рождала ему. У ней была служанка Египтянка, именем Агарь.","Быт 16:2":"И сказала Сара Авраму: вот, Господь заключил чрево мое, чтобы мне не рождать; войди же к служанке моей: может быть, я буду иметь детей от нее. Аврам послушался слов Сары.","Быт 16:3":"И взяла Сара, жена Аврамова, служанку свою, Египтянку Агарь, по истечении десяти лет пребывания Аврамова в земле Ханаанской, и дала ее Авраму, мужу своему, в жену.","Быт 16:4":"Он вошел к Агари, и она зачала. Увидев же, что зачала, она стала презирать госпожу свою.","Быт 16:5":"И сказала Сара Авраму: в обиде моей ты виновен; я отдала служанку мою в недро твое; а она, увидев, что зачала, стала презирать меня; Господь пусть будет судьею между мною и между тобою.","Быт 16:6":"Аврам сказал Саре: вот, служанка твоя в твоих руках; делай с нею, что тебе угодно. И Сара стала притеснять ее, и она убежала от нее.","Быт 16:15":"Агарь родила Авраму сына; и нарек [Аврам] имя сыну своему, рожденному от Агари: Измаил.","Быт 16:16":"Аврам был восьмидесяти шести лет, когда Агарь родила Авраму Измаила.","Быт 17:1":"Аврам был девяноста девяти лет, и Господь явился Авраму и сказал ему: Я Бог Всемогущий; ходи предо Мною и будь непорочен;","Быт 17:2":"и поставлю завет Мой между Мною и тобою, и весьма, весьма размножу тебя.","Быт 17:3":"И пал Аврам на лице свое. Бог продолжал говорить с ним и сказал:","Быт 17:4":"Я — вот завет Мой с тобою: ты будешь отцом множества народов,","Быт 17:5":"и не будешь ты больше называться Аврамом, но будет тебе имя: Авраам, ибо Я сделаю тебя отцом множества народов;","Быт 17:6":"и весьма, весьма распложу тебя, и произведу от тебя народы, и цари произойдут от тебя;","Быт 17:7":"и поставлю завет Мой между Мною и тобою и между потомками твоими после тебя в роды их, завет вечный в том, что Я буду Богом твоим и потомков твоих после тебя;","Быт 17:8":"и дам тебе и потомкам твоим после тебя землю, по которой ты странствуешь, всю землю Ханаанскую, во владение вечное; и буду им Богом.","Быт 17:9":"И сказал Бог Аврааму: ты же соблюди завет Мой, ты и потомки твои после тебя в роды их.","Быт 17:10":"Сей есть завет Мой, который вы должны соблюдать между Мною и между вами и между потомками твоими после тебя [в роды их]: да будет у вас обрезан весь мужеский пол;","Быт 17:11":"обрезывайте крайнюю плоть вашу: и сие будет знамением завета между Мною и вами.","Быт 17:12":"Восьми дней от рождения да будет обрезан у вас в роды ваши всякий младенец мужеского пола, рожденный в доме и купленный за серебро у какого—нибудь иноплеменника, который не от твоего семени.","Быт 17:13":"Непременно да будет обрезан рожденный в доме твоем и купленный за серебро твое, и будет завет Мой на теле вашем заветом вечным.","Быт 17:14":"Необрезанный же мужеского пола, который не обрежет крайней плоти своей [в восьмой день], истребится душа та из народа своего, ибо он нарушил завет Мой.","Быт 17:15":"И сказал Бог Аврааму: Сару, жену твою, не называй Сарою, но да будет имя ей: Сарра;","Быт 17:16":"Я благословлю ее и дам тебе от нее сына; благословлю ее, и произойдут от нее народы, и цари народов произойдут от нее.","Быт 17:17":"И пал Авраам на лице свое, и рассмеялся, и сказал сам в себе: неужели от столетнего будет сын? и Сарра, девяностолетняя, неужели родит?","Быт 17:18":"И сказал Авраам Богу: о, хотя бы Измаил был жив пред лицем Твоим!","Быт 17:19":"Бог же сказал [Аврааму]: именно Сарра, жена твоя, родит тебе сына, и ты наречешь ему имя: Исаак; и поставлю завет Мой с ним заветом вечным [в том, что Я буду Богом ему и] потомству его после него.","Быт 17:20":"И о Измаиле Я услышал тебя: вот, Я благословлю его, и возращу его, и весьма, весьма размножу; двенадцать князей родятся от него; и Я произведу от него великий народ.","Быт 17:21":"Но завет Мой поставлю с Исааком, которого родит тебе Сарра в сие самое время на другой год.","Быт 17:23":"И взял Авраам Измаила, сына своего, и всех рожденных в доме своем и всех купленных за серебро свое, весь мужеский пол людей дома Авраамова; и обрезал крайнюю плоть их в тот самый день, как сказал ему Бог.","Быт 17:24":"Авраам был девяноста девяти лет, когда была обрезана крайняя плоть его.","Быт 17:25":"А Измаил, сын его, был тринадцати лет, когда была обрезана крайняя плоть его.","Быт 17:26":"В тот же самый день обрезаны были Авраам и Измаил, сын его,","Быт 17:27":"и с ним обрезан был весь мужеский пол дома его, рожденные в доме и купленные за серебро у иноплеменников.","Быт 18:1":"И явился ему Господь у дубравы Мамре, когда он сидел при входе в шатер [свой], во время зноя дневного.","Быт 18:2":"Он возвел очи свои и взглянул, и вот, три мужа стоят против него. Увидев, он побежал навстречу им от входа в шатер [свой] и поклонился до земли,","Быт 18:3":"и сказал: Владыка! если я обрел благоволение пред очами Твоими, не пройди мимо раба Твоего;","Быт 18:4":"и принесут немного воды, и омоют ноги ваши; и отдохните под сим деревом,","Быт 18:5":"а я принесу хлеба, и вы подкрепите сердца ваши; потом пойдите [в путь свой]; так как вы идете мимо раба вашего. Они сказали: сделай так, как говоришь.","Быт 18:6":"И поспешил Авраам в шатер к Сарре и сказал [ей]: поскорее замеси три саты лучшей муки и сделай пресные хлебы.","Быт 18:7":"И побежал Авраам к стаду, и взял теленка нежного и хорошего, и дал отроку, и тот поспешил приготовить его.","Быт 18:8":"И взял масла и молока и теленка приготовленного, и поставил перед ними, а сам стоял подле них под деревом. И они ели.","Быт 18:10":"И сказал один из них: Я опять буду у тебя в это же время [в следующем году], и будет сын у Сарры, жены твоей. А Сарра слушала у входа в шатер, сзади его.","Быт 18:11":"Авраам же и Сарра были стары и в летах преклонных, и обыкновенное у женщин у Сарры прекратилось.","Быт 18:12":"Сарра внутренно рассмеялась, сказав: мне ли, когда я состарилась, иметь сие утешение? и господин мой стар.","Быт 18:13":"И сказал Господь Аврааму: отчего это [сама в себе] рассмеялась Сарра, сказав: «неужели я действительно могу родить, когда я состарилась»?","Быт 18:14":"Есть ли что трудное для Господа? В назначенный срок буду Я у тебя в следующем году, и [будет] у Сарры сын.","Быт 18:16":"И встали те мужи и оттуда отправились к Содому [и Гоморре]; Авраам же пошел с ними, проводить их.","Быт 18:17":"И сказал Господь: утаю ли Я от Авраама [раба Моего], что хочу делать!","Быт 18:18":"От Авраама точно произойдет народ великий и сильный, и благословятся в нем все народы земли,","Быт 18:19":"ибо Я избрал его для того, чтобы он заповедал сынам своим и дому своему после себя, ходить путем Господним, творя правду и суд; и исполнит Господь над Авраамом [все], что сказал о нем.","Быт 18:22":"И обратились мужи оттуда и пошли в Содом; Авраам же еще стоял пред лицем Господа.","Быт 18:23":"И подошел Авраам и сказал: неужели Ты погубишь праведного с нечестивым [и с праведником будет то же, что с нечестивым]?","Быт 18:24":"может быть, есть в этом городе пятьдесят праведников? неужели Ты погубишь, и не пощадишь [всего] места сего ради пятидесяти праведников, [если они находятся] в нем?","Быт 18:25":"не может быть, чтобы Ты поступил так, чтобы Ты погубил праведного с нечестивым, чтобы то же было с праведником, что с нечестивым; не может быть от Тебя! Судия всей земли поступит ли неправосудно?","Быт 18:26":"Господь сказал: если Я найду в городе Содоме пятьдесят праведников, то Я ради них пощажу [весь город и] все место сие.","Быт 18:27":"Авраам сказал в ответ: вот, я решился говорить Владыке, я, прах и пепел:","Быт 18:28":"может быть, до пятидесяти праведников недостанет пяти, неужели за недостатком пяти Ты истребишь весь город? Он сказал: не истреблю, если найду там сорок пять.","Быт 18:29":"Авраам продолжал говорить с Ним и сказал: может быть, найдется там сорок? Он сказал: не сделаю того и ради сорока.","Быт 18:30":"И сказал Авраам: да не прогневается Владыка, что я буду говорить: может быть, найдется там тридцать? Он сказал: не сделаю, если найдется там тридцать.","Быт 18:31":"Авраам сказал: вот, я решился говорить Владыке: может быть, найдется там двадцать? Он сказал: не истреблю ради двадцати.","Быт 18:32":"Авраам сказал: да не прогневается Владыка, что я скажу еще однажды: может быть, найдется там десять? Он сказал: не истреблю ради десяти.","Быт 18:33":"И пошел Господь, перестав говорить с Авраамом; Авраам же возвратился в свое место.","Быт 19:27":"И встал Авраам рано утром [и пошел] на место, где стоял пред лицем Господа,","Быт 19:28":"и посмотрел к Содому и Гоморре и на все пространство окрестности и увидел: вот, дым поднимается с земли, как дым из печи.","Быт 19:29":"И было, когда Бог истреблял [все] города окрестности сей, вспомнил Бог об Аврааме и выслал Лота из среды истребления, когда ниспровергал города, в которых жил Лот.","Быт 20:1":"Авраам поднялся оттуда к югу и поселился между Кадесом и между Суром; и был на время в Гераре.","Быт 20:2":"И сказал Авраам о Сарре, жене своей: она сестра моя. [Ибо он боялся сказать, что это жена его, чтобы жители города того не убили его за нее.] И послал Авимелех, царь Герарский, и взял Сарру.","Быт 20:3":"И пришел Бог к Авимелеху ночью во сне и сказал ему: вот, ты умрешь за женщину, которую ты взял, ибо она имеет мужа.","Быт 20:4":"Авимелех же не прикасался к ней и сказал: Владыка! неужели ты погубишь [не знавший сего] и невинный народ?","Быт 20:5":"Не сам ли он сказал мне: она сестра моя? И она сама сказала: он брат мой. Я сделал это в простоте сердца моего и в чистоте рук моих.","Быт 20:6":"И сказал ему Бог во сне: и Я знаю, что ты сделал сие в простоте сердца твоего, и удержал тебя от греха предо Мною, потому и не допустил тебя прикоснуться к ней;","Быт 20:7":"теперь же возврати жену мужу, ибо он пророк и помолится о тебе, и ты будешь жив; а если не возвратишь, то знай, что непременно умрешь ты и все твои.","Быт 20:8":"И встал Авимелех утром рано, и призвал всех рабов своих, и пересказал все слова сии в уши их; и люди сии [все] весьма испугались.","Быт 20:9":"И призвал Авимелех Авраама и сказал ему: что ты с нами сделал? чем согрешил я против тебя, что ты навел было на меня и на царство мое великий грех? Ты сделал со мною дела, каких не делают.","Быт 20:10":"И сказал Авимелех Аврааму: что ты имел в виду, когда делал это дело?","Быт 20:11":"Авраам сказал: я подумал, что нет на месте сем страха Божия, и убьют меня за жену мою;","Быт 20:12":"да она и подлинно сестра мне: она дочь отца моего, только не дочь матери моей; и сделалась моею женою;","Быт 20:13":"когда Бог повел меня странствовать из дома отца моего, то я сказал ей: сделай со мною сию милость, в какое ни придем мы место, везде говори обо мне: это брат мой.","Быт 20:14":"И взял Авимелех [серебра тысячу сиклей и] мелкого и крупного скота, и рабов и рабынь, и дал Аврааму; и возвратил ему Сарру, жену его.","Быт 20:15":"И сказал Авимелех [Аврааму]: вот, земля моя пред тобою; живи, где тебе угодно.","Быт 20:16":"И Сарре сказал: вот, я дал брату твоему тысячу сиклей серебра; вот, это тебе покрывало для очей пред всеми, которые с тобою, и пред всеми ты оправдана.","Быт 20:17":"И помолился Авраам Богу, и исцелил Бог Авимелеха, и жену его, и рабынь его, и они стали рождать;","Быт 21:2":"Сарра зачала и родила Аврааму сына в старости его во время, о котором говорил ему Бог;","Быт 21:3":"и нарек Авраам имя сыну своему, родившемуся у него, которого родила ему Сарра, Исаак;","Быт 21:4":"и обрезал Авраам Исаака, сына своего, в восьмой день, как заповедал ему Бог.","Быт 21:5":"Авраам был ста лет, когда родился у него Исаак, сын его.","Быт 21:8":"Дитя выросло и отнято от груди; и Авраам сделал большой пир в тот день, когда Исаак [сын его] отнят был от груди.","Быт 21:9":"И увидела Сарра, что сын Агари Египтянки, которого она родила Аврааму, насмехается [над ее сыном, Исааком],","Быт 21:10":"и сказала Аврааму: выгони эту рабыню и сына ее, ибо не наследует сын рабыни сей с сыном моим Исааком.","Быт 21:11":"И показалось это Аврааму весьма неприятным ради сына его [Измаила].","Быт 21:12":"Но Бог сказал Аврааму: не огорчайся ради отрока и рабыни твоей; во всем, что скажет тебе Сарра, слушайся голоса ее, ибо в Исааке наречется тебе семя;","Быт 21:13":"и от сына рабыни Я произведу [великий] народ, потому что он семя твое.","Быт 21:14":"Авраам встал рано утром, и взял хлеба и мех воды, и дал Агари, положив ей на плечи, и отрока, и отпустил ее. Она пошла, и заблудилась в пустыне Вирсавии;","Быт 21:22":"И было в то время, Авимелех с [Ахузафом невестоводителем и] Фихолом, военачальником своим, сказал Аврааму: с тобою Бог во всем, что ты ни делаешь;","Быт 21:23":"и теперь поклянись мне здесь Богом, что ты не обидишь ни меня, ни сына моего, ни внука моего; и как я хорошо поступал с тобою, так и ты будешь поступать со мною и землею, в которой ты гостишь.","Быт 21:24":"И сказал Авраам: я клянусь.","Быт 21:25":"И Авраам упрекал Авимелеха за колодезь с водою, который отняли рабы Авимелеховы.","Быт 21:26":"Авимелех же сказал [ему]: не знаю, кто это сделал, и ты не сказал мне; я даже и не слыхал о том доныне.","Быт 21:27":"И взял Авраам мелкого и крупного скота и дал Авимелеху, и они оба заключили союз.","Быт 21:28":"И поставил Авраам семь агниц из стада мелкого скота особо.","Быт 21:29":"Авимелех же сказал Аврааму: на что здесь сии семь агниц [из стада овец], которых ты поставил особо?","Быт 21:30":"[Авраам] сказал: семь агниц сих возьми от руки моей, чтобы они были мне свидетельством, что я выкопал этот колодезь.","Быт 21:31":"Потому и назвал он сие место: Вирсавия, ибо тут оба они клялись","Быт 21:32":"и заключили союз в Вирсавии. И встал Авимелех, и [Ахузаф, невестоводитель его, и] Фихол, военачальник его, и возвратились в землю Филистимскую.","Быт 21:33":"И насадил [Авраам] при Вирсавии рощу и призвал там имя Господа, Бога вечного.","Быт 21:34":"И жил Авраам в земле Филистимской, как странник, дни многие.","Быт 22:1":"И было, после сих происшествий Бог искушал Авраама и сказал ему: Авраам! Он сказал: вот я.","Быт 22:2":"Бог сказал: возьми сына твоего, единственного твоего, которого ты любишь, Исаака; и пойди в землю Мориа и там принеси его во всесожжение на одной из гор, о которой Я скажу тебе.","Быт 22:3":"Авраам встал рано утром, оседлал осла своего, взял с собою двоих из отроков своих и Исаака, сына своего; наколол дров для всесожжения, и встав пошел на место, о котором сказал ему Бог.","Быт 22:4":"На третий день Авраам возвел очи свои, и увидел то место издалека.","Быт 22:5":"И сказал Авраам отрокам своим: останьтесь вы здесь с ослом, а я и сын пойдем туда и поклонимся, и возвратимся к вам.","Быт 22:6":"И взял Авраам дрова для всесожжения, и возложил на Исаака, сына своего; взял в руки огонь и нож, и пошли оба вместе.","Быт 22:7":"И начал Исаак говорить Аврааму, отцу своему, и сказал: отец мой! Он отвечал: вот я, сын мой. Он сказал: вот огонь и дрова, где же агнец для всесожжения?","Быт 22:8":"Авраам сказал: Бог усмотрит Себе агнца для всесожжения, сын мой. И шли далее оба вместе.","Быт 22:9":"И пришли на место, о котором сказал ему Бог; и устроил там Авраам жертвенник, разложил дрова и, связав сына своего Исаака, положил его на жертвенник поверх дров.","Быт 22:10":"И простер Авраам руку свою и взял нож, чтобы заколоть сына своего.","Быт 22:11":"Но Ангел Господень воззвал к нему с неба и сказал: Авраам! Авраам! Он сказал: вот я.","Быт 22:12":"Ангел сказал: не поднимай руки твоей на отрока и не делай над ним ничего, ибо теперь Я знаю, что боишься ты Бога и не пожалел сына твоего, единственного твоего, для Меня.","Быт 22:13":"И возвел Авраам очи свои и увидел: и вот, позади овен, запутавшийся в чаще рогами своими. Авраам пошел, взял овна и принес его во всесожжение вместо [Исаака], сына своего.","Быт 22:14":"И нарек Авраам имя месту тому: Иегова—ире. Посему и ныне говорится: на горе Иеговы усмотрится.","Быт 22:15":"И вторично воззвал к Аврааму Ангел Господень с неба","Быт 22:16":"и сказал: Мною клянусь, говорит Господь, что, так как ты сделал сие дело, и не пожалел сына твоего, единственного твоего, [для Меня,]","Быт 22:17":"то Я благословляя благословлю тебя и умножая умножу семя твое, как звезды небесные и как песок на берегу моря; и овладеет семя твое городами врагов своих;","Быт 22:18":"и благословятся в семени твоем все народы земли за то, что ты послушался гласа Моего.","Быт 22:19":"И возвратился Авраам к отрокам своим, и встали и пошли вместе в Вирсавию; и жил Авраам в Вирсавии.","Быт 22:20":"После сих происшествий Аврааму возвестили, сказав: вот, и Милка родила Нахору, брату твоему, сынов:","Быт 22:21":"Уца, первенца его, Вуза, брата сему, Кемуила, отца Арамова,","Быт 22:22":"Кеседа, Хазо, Пилдаша, Идлафа и Вафуила;","Быт 22:23":"от Вафуила родилась Ревекка. Восьмерых сих [сынов] родила Милка Нахору, брату Авраамову;","Быт 23:1":"Жизни Сарриной было сто двадцать семь лет: вот лета жизни Сарриной;","Быт 23:2":"и умерла Сарра в Кириаф—Арбе, [который на долине,] что ныне Хеврон, в земле Ханаанской. И пришел Авраам рыдать по Сарре и оплакивать ее.","Быт 23:3":"И отошел Авраам от умершей своей, и говорил сынам Хетовым, и сказал:","Быт 23:4":"я у вас пришлец и поселенец; дайте мне в собственность место для гроба между вами, чтобы мне умершую мою схоронить от глаз моих.","Быт 23:5":"Сыны Хета отвечали Аврааму и сказали ему:","Быт 23:6":"послушай нас, господин наш; ты князь Божий посреди нас; в лучшем из наших погребальных мест похорони умершую твою; никто из нас не откажет тебе в погребальном месте, для погребения [на нем] умершей твоей.","Быт 23:7":"Авраам встал и поклонился народу земли той, сынам Хетовым;","Быт 23:8":"и говорил им [Авраам] и сказал: если вы согласны, чтобы я похоронил умершую мою, то послушайте меня, попросите за меня Ефрона, сына Цохарова,","Быт 23:9":"чтобы он отдал мне пещеру Махпелу, которая у него на конце поля его, чтобы за довольную цену отдал ее мне посреди вас, в собственность для погребения.","Быт 23:10":"Ефрон же сидел посреди сынов Хетовых; и отвечал Ефрон Хеттеянин Аврааму вслух сынов Хета, всех входящих во врата города его, и сказал:","Быт 23:11":"нет, господин мой, послушай меня: я даю тебе поле и пещеру, которая на нем, даю тебе, пред очами сынов народа моего дарю тебе ее, похорони умершую твою.","Быт 23:12":"Авраам поклонился пред народом земли той","Быт 23:13":"и говорил Ефрону вслух [всего] народа земли той и сказал: если послушаешь, я даю тебе за поле серебро; возьми у меня, и я похороню там умершую мою.","Быт 23:14":"Ефрон отвечал Аврааму и сказал ему:","Быт 23:15":"господин мой! послушай меня: земля стоит четыреста сиклей серебра; для меня и для тебя что это? похорони умершую твою.","Быт 23:16":"Авраам выслушал Ефрона; и отвесил Авраам Ефрону серебра, сколько он объявил вслух сынов Хетовых, четыреста сиклей серебра, какое ходит у купцов.","Быт 23:17":"И стало поле Ефроново, которое при Махпеле, против Мамре, поле и пещера, которая на нем, и все деревья, которые на поле, во всех пределах его вокруг,","Быт 23:18":"владением Авраамовым пред очами сынов Хета, всех входящих во врата города его.","Быт 23:19":"После сего Авраам похоронил Сарру, жену свою, в пещере поля в Махпеле, против Мамре, что ныне Хеврон, в земле Ханаанской.","Быт 23:20":"Так достались Аврааму от сынов Хетовых поле и пещера, которая на нем, в собственность для погребения.","Быт 24:1":"Авраам был уже стар и в летах преклонных. Господь благословил Авраама всем.","Быт 24:2":"И сказал Авраам рабу своему, старшему в доме его, управлявшему всем, что у него было: положи руку твою под стегно мое","Быт 24:3":"и клянись мне Господом, Богом неба и Богом земли, что ты не возьмешь сыну моему [Исааку] жены из дочерей Хананеев, среди которых я живу,","Быт 24:4":"но пойдешь в землю мою, на родину мою [и к племени моему], и возьмешь [оттуда] жену сыну моему Исааку.","Быт 24:5":"Раб сказал ему: может быть, не захочет женщина идти со мною в эту землю, должен ли я возвратить сына твоего в землю, из которой ты вышел?","Быт 24:6":"Авраам сказал ему: берегись, не возвращай сына моего туда;","Быт 24:7":"Господь, Бог неба [и Бог земли], Который взял меня из дома отца моего и из земли рождения моего, Который говорил мне и Который клялся мне, говоря: [тебе и] потомству твоему дам сию землю, — Он пошлет Ангела Своего пред тобою, и ты возьмешь жену сыну моему [Исааку] оттуда;","Быт 24:8":"если же не захочет женщина идти с тобою [в землю сию], ты будешь свободен от сей клятвы моей; только сына моего не возвращай туда.","Быт 24:9":"И положил раб руку свою под стегно Авраама, господина своего, и клялся ему в сем.","Быт 24:15":"Еще не перестал он говорить [в уме своем], и вот, вышла Ревекка, которая родилась от Вафуила, сына Милки, жены Нахора, брата Авраамова, и кувшин ее на плече ее;","Быт 24:35":"Господь весьма благословил господина моего, и он сделался великим: Он дал ему овец и волов, серебро и золото, рабов и рабынь, верблюдов и ослов;","Быт 24:48":"И преклонился я и поклонился Господу, и благословил Господа, Бога господина моего Авраама, Который прямым путем привел меня, чтобы взять дочь брата господина моего за сына его.","Быт 25:1":"И взял Авраам еще жену, именем Хеттуру.","Быт 25:2":"Она родила ему Зимрана, Иокшана, Медана, Мадиана, Ишбака и Шуаха.","Быт 25:3":"Иокшан родил Шеву, [Фемана] и Дедана. Сыны Дедана были: [Рагуил, Навдеил,] Ашурим, Летушим и Леюмим.","Быт 25:4":"Сыны Мадиана: Ефа, Ефер, Ханох, Авида и Елдага. Все сии сыны Хеттуры.","Быт 25:5":"И отдал Авраам все, что было у него, Исааку [сыну своему],","Быт 25:6":"а сынам наложниц, которые были у Авраама, дал Авраам подарки и отослал их от Исаака, сына своего, еще при жизни своей, на восток, в землю восточную.","Быт 25:7":"Дней жизни Авраамовой, которые он прожил, было сто семьдесят пять лет;","Быт 25:8":"и скончался Авраам, и умер в старости доброй, престарелый и насыщенный [жизнью], и приложился к народу своему.","Быт 25:9":"И погребли его Исаак и Измаил, сыновья его, в пещере Махпеле, на поле Ефрона, сына Цохара, Хеттеянина, которое против Мамре,","Быт 25:10":"на поле [и в пещере], которые Авраам приобрел от сынов Хетовых. Там погребены Авраам и Сарра, жена его.","Быт 25:11":"По смерти Авраама Бог благословил Исаака, сына его. Исаак жил при Беэр—лахай—рои.","Быт 25:12":"Вот родословие Измаила, сына Авраамова, которого родила Аврааму Агарь Египтянка, служанка Саррина;","Быт 25:13":"и вот имена сынов Измаиловых, имена их по родословию их: первенец Измаилов Наваиоф, за ним Кедар, Адбеел, Мивсам,","Быт 25:14":"Мишма, Дума, Масса,","Быт 25:15":"Хадад, Фема, Иетур, Нафиш и Кедма.","Быт 25:16":"Сии суть сыны Измаиловы, и сии имена их, в селениях их, в кочевьях их. Это двенадцать князей племен их.","Быт 25:17":"Лет же жизни Измаиловой было сто тридцать семь лет; и скончался он, и умер, и приложился к народу своему.","Быт 25:18":"Они жили от Хавилы до Сура, что пред Египтом, как идешь к Ассирии. Они поселились пред лицем всех братьев своих.","Быт 25:19":"Вот родословие Исаака, сына Авраамова. Авраам родил Исаака.","Быт 25:20":"Исаак был сорока лет, когда он взял себе в жену Ревекку, дочь Вафуила Арамеянина из Месопотамии, сестру Лавана Арамеянина.","Быт 25:21":"И молился Исаак Господу о [Ревекке] жене своей, потому что она была неплодна; и Господь услышал его, и зачала Ревекка, жена его.","Быт 25:22":"Сыновья в утробе ее стали биться, и она сказала: если так будет, то для чего мне это? И пошла вопросить Господа.","Быт 25:23":"Господь сказал ей: два племени во чреве твоем, и два различных народа произойдут из утробы твоей; один народ сделается сильнее другого, и больший будет служить меньшему.","Быт 25:24":"И настало время родить ей: и вот близнецы в утробе ее.","Быт 25:25":"Первый вышел красный, весь, как кожа, косматый; и нарекли ему имя Исав.","Быт 25:26":"Потом вышел брат его, держась рукою своею за пяту Исава; и наречено ему имя Иаков. Исаак же был шестидесяти лет, когда они родились [от Ревекки].","Быт 25:27":"Дети выросли, и стал Исав человеком искусным в звероловстве, человеком полей; а Иаков человеком кротким, живущим в шатрах.","Быт 25:28":"Исаак любил Исава, потому что дичь его была по вкусу его, а Ревекка любила Иакова.","Быт 25:29":"И сварил Иаков кушанье; а Исав пришел с поля усталый.","Быт 25:30":"И сказал Исав Иакову: дай мне поесть красного, красного этого, ибо я устал. От сего дано ему прозвание: Едом.","Быт 25:31":"Но Иаков сказал [Исаву]: продай мне теперь же свое первородство.","Быт 25:32":"Исав сказал: вот, я умираю, что мне в этом первородстве?","Быт 25:33":"Иаков сказал [ему]: поклянись мне теперь же. Он поклялся ему, и продал [Исав] первородство свое Иакову.","Быт 25:34":"И дал Иаков Исаву хлеба и кушанья из чечевицы; и он ел и пил, и встал и пошел; и пренебрег Исав первородство.","Быт 26:5":"за то, что Авраам [отец твой] послушался гласа Моего и соблюдал, что Мною заповедано было соблюдать: повеления Мои, уставы Мои и законы Мои.","Быт 29:21":"И сказал Иаков Лавану: дай жену мою, потому что мне уже исполнилось время, чтобы войти к ней.","Быт 29:22":"Лаван созвал всех людей того места и сделал пир.","Быт 29:23":"Вечером же взял [Лаван] дочь свою Лию и ввел ее к нему; и вошел к ней [Иаков].","Быт 29:24":"И дал Лаван служанку свою Зелфу в служанки дочери своей Лии.","Быт 29:25":"Утром же оказалось, что это Лия. И [Иаков] сказал Лавану: что это сделал ты со мною? не за Рахиль ли я служил у тебя? зачем ты обманул меня?","Быт 30:4":"И дала она Валлу, служанку свою, в жену ему; и вошел к ней Иаков.","Быт 30:9":"Лия увидела, что перестала рождать, и взяла служанку свою Зелфу, и дала ее Иакову в жену, [и он вошел к ней].","Быт 30:21":"Потом родила дочь и нарекла ей имя: Дина.","Быт 33:19":"И купил часть поля, на котором раскинул шатер свой, у сынов Еммора, отца Сихемова, за сто монет.","Быт 35:22":"Во время пребывания Израиля в той стране, Рувим пошел и переспал с Валлою, наложницею отца своего [Иакова]. И услышал Израиль [и принял то с огорчением]. Сынов же у Иакова было двенадцать.","Быт 35:23":"Сыновья Лии: первенец Иакова Рувим, по нем Симеон, Левий, Иуда, Иссахар и Завулон.","Быт 35:24":"Сыновья Рахили: Иосиф и Вениамин.","Быт 35:25":"Сыновья Валлы, служанки Рахилиной: Дан и Неффалим.","Быт 35:26":"Сыновья Зелфы, служанки Лииной: Гад и Асир. Сии сыновья Иакова, родившиеся ему в Месопотамии.","Быт 41:46":"Иосифу было тридцать лет от рождения, когда он предстал пред лице фараона, царя Египетского. И вышел Иосиф от лица фараонова и прошел по всей земле Египетской.","Быт 46:19":"Сыны Рахили, жены Иакова: Иосиф и Вениамин.","Быт 48:5":"И ныне два сына твои, родившиеся тебе в земле Египетской, до моего прибытия к тебе в Египет, мои они; Ефрем и Манассия, как Рувим и Симеон, будут мои;","Быт 49:28":"Вот все двенадцать колен Израилевых; и вот что сказал им отец их; и благословил их, и дал им благословение, каждому свое.","Быт 49:29":"И заповедал он им и сказал им: я прилагаюсь к народу моему; похороните меня с отцами моими в пещере, которая на поле Ефрона Хеттеянина,","Быт 49:30":"в пещере, которая на поле Махпела, что пред Мамре, в земле Ханаанской, которую [пещеру] купил Авраам с полем у Ефрона Хеттеянина в собственность для погребения;","Быт 49:31":"там похоронили Авраама и Сарру, жену его; там похоронили Исаака и Ревекку, жену его; и там похоронил я Лию;","Исх 2:24":"И услышал Бог стенание их, и вспомнил Бог завет Свой с Авраамом, Исааком и Иаковом.","Исх 3:6":"И сказал [ему]: Я Бог отца твоего, Бог Авраама, Бог Исаака и Бог Иакова. Моисей закрыл лице свое, потому что боялся воззреть на Бога.","Исх 3:15":"И сказал еще Бог Моисею: так скажи сынам Израилевым: Господь, Бог отцов ваших, Бог Авраама, Бог Исаака и Бог Иакова послал меня к вам. Вот имя Мое на веки, и памятование о Мне из рода в род.","Исх 7:7":"Моисей был восьмидесяти, а Аарон [брат его] восьмидесяти трех лет, когда стали говорить они к фараону.","Исх 12:1":"И сказал Господь Моисею и Аарону в земле Египетской, говоря:","Исх 12:2":"месяц сей да будет у вас началом месяцев, первым да будет он у вас между месяцами года.","Исх 12:3":"Скажите всему обществу [сынов] Израилевых: в десятый день сего месяца пусть возьмут себе каждый одного агнца по семействам, по агнцу на семейство;","Исх 12:4":"а если семейство так мало, что не съест агнца, то пусть возьмет с соседом своим, ближайшим к дому своему, по числу душ: по той мере, сколько каждый съест, расчислитесь на агнца.","Исх 12:5":"Агнец у вас должен быть без порока, мужеского пола, однолетний; возьмите его от овец, или от коз,","Исх 12:6":"и пусть он хранится у вас до четырнадцатого дня сего месяца: тогда пусть заколет его все собрание общества Израильского вечером,","Исх 12:7":"и пусть возьмут от крови его и помажут на обоих косяках и на перекладине дверей в домах, где будут есть его;","Исх 12:8":"пусть съедят мясо его в сию самую ночь, испеченное на огне; с пресным хлебом и с горькими травами пусть съедят его;","Исх 12:9":"не ешьте от него недопеченного, или сваренного в воде, но ешьте испеченное на огне, голову с ногами и внутренностями;","Исх 12:10":"не оставляйте от него до утра [и кости его не сокрушайте], но оставшееся от него до утра сожгите на огне.","Исх 12:11":"Ешьте же его так: пусть будут чресла ваши препоясаны, обувь ваша на ногах ваших и посохи ваши в руках ваших, и ешьте его с поспешностью: это — Пасха Господня.","Исх 12:12":"А Я в сию самую ночь пройду по земле Египетской и поражу всякого первенца в земле Египетской, от человека до скота, и над всеми богами Египетскими произведу суд. Я Господь.","Исх 12:13":"И будет у вас кровь знамением на домах, где вы находитесь, и увижу кровь и пройду мимо вас, и не будет между вами язвы губительной, когда буду поражать землю Египетскую.","Исх 12:14":"И да будет вам день сей памятен, и празднуйте в оный праздник Господу во [все] роды ваши; как установление вечное празднуйте его.","Исх 12:15":"Семь дней ешьте пресный хлеб; с самого первого дня уничтожьте квасное в домах ваших, ибо кто будет есть квасное с первого дня до седьмого дня, душа та истреблена будет из среды Израиля.","Исх 12:16":"И в первый день да будет у вас священное собрание, и в седьмой день священное собрание: никакой работы не должно делать в них; только что есть каждому, одно то можно делать вам.","Исх 12:17":"Наблюдайте опресноки, ибо в сей самый день Я вывел ополчения ваши из земли Египетской, и наблюдайте день сей в роды ваши, как установление вечное.","Исх 12:18":"С четырнадцатого дня первого месяца, с вечера ешьте пресный хлеб до вечера двадцать первого дня того же месяца;","Исх 12:19":"семь дней не должно быть закваски в домах ваших, ибо кто будет есть квасное, душа та истреблена будет из общества [сынов] Израилевых, пришлец ли то, или природный житель земли той.","Исх 12:20":"Ничего квасного не ешьте; во всяком местопребывании вашем ешьте пресный хлеб.","Исх 12:21":"И созвал Моисей всех старейшин [сынов] Израилевых и сказал им: выберите и возьмите себе агнцев по семействам вашим и заколите пасху;","Исх 12:22":"и возьмите пучок иссопа, и обмочите в кровь, которая в сосуде, и помажьте перекладину и оба косяка дверей кровью, которая в сосуде; а вы никто не выходите за двери дома своего до утра.","Исх 12:23":"И пойдет Господь поражать Египет, и увидит кровь на перекладине и на обоих косяках, и пройдет Господь мимо дверей, и не попустит губителю войти в домы ваши для поражения.","Исх 12:24":"Храните сие, как закон для себя и для сынов своих на веки.","Исх 12:25":"Когда войдете в землю, которую Господь даст вам, как Он говорил, соблюдайте сие служение.","Исх 12:26":"И когда скажут вам дети ваши: что это за служение?","Исх 12:27":"скажите [им]: это пасхальная жертва Господу, Который прошел мимо домов сынов Израилевых в Египте, когда поражал Египтян, и домы наши избавил. И преклонился народ и поклонился.","Исх 12:28":"И пошли сыны Израилевы и сделали: как повелел Господь Моисею и Аарону, так и сделали.","Исх 12:29":"В полночь Господь поразил всех первенцев в земле Египетской, от первенца фараона, сидевшего на престоле своем, до первенца узника, находившегося в темнице, и все первородное из скота.","Исх 12:30":"И встал фараон ночью сам и все рабы его и весь Египет; и сделался великий вопль [во всей земле] Египетской, ибо не было дома, где не было бы мертвеца.","Исх 12:31":"И призвал [фараон] Моисея и Аарона ночью и сказал [им]: встаньте, выйдите из среды народа моего, как вы, так и сыны Израилевы, и пойдите, совершите служение Господу [Богу вашему], как говорили вы;","Исх 12:32":"и мелкий и крупный скот ваш возьмите, как вы говорили; и пойдите и благословите меня.","Исх 12:33":"И понуждали Египтяне народ, чтобы скорее выслать его из земли той; ибо говорили они: мы все помрем.","Исх 12:34":"И понес народ тесто свое, прежде нежели оно вскисло; квашни их, завязанные в одеждах их, были на плечах их.","Исх 12:35":"И сделали сыны Израилевы по слову Моисея и просили у Египтян вещей серебряных и вещей золотых и одежд.","Исх 12:36":"Господь же дал милость народу [Своему] в глазах Египтян: и они давали ему, и обобрал он Египтян.","Исх 12:37":"И отправились сыны Израилевы из Раамсеса в Сокхоф до шестисот тысяч пеших мужчин, кроме детей;","Исх 12:38":"и множество разноплеменных людей вышли с ними, и мелкий и крупный скот, стадо весьма большое.","Исх 12:39":"И испекли они из теста, которое вынесли из Египта, пресные лепешки, ибо оно еще не вскисло, потому что они выгнаны были из Египта и не могли медлить, и даже пищи не приготовили себе на дорогу.","Исх 12:40":"Времени же, в которое сыны Израилевы [и отцы их] обитали в Египте [и в земле Ханаанской], было четыреста тридцать лет.","Исх 12:41":"По прошествии четырехсот тридцати лет, в этот самый день вышло все ополчение Господне из земли Египетской ночью.","Исх 12:42":"Это — ночь бдения Господу за изведение их из земли Египетской; эта самая ночь — бдение Господу у всех сынов Израилевых в роды их.","Исх 12:43":"И сказал Господь Моисею и Аарону: вот устав Пасхи: никакой иноплеменник не должен есть ее;","Исх 12:44":"а всякий раб, купленный за серебро, когда обрежешь его, может есть ее;","Исх 12:45":"поселенец и наемник не должен есть ее.","Исх 12:46":"В одном доме должно есть ее, [не оставляйте от нее до утра,] не выносите мяса вон из дома и костей ее не сокрушайте.","Исх 12:47":"Все общество [сынов] Израиля должно совершать ее.","Исх 12:48":"Если же поселится у тебя пришлец и захочет совершить Пасху Господу, то обрежь у него всех мужеского пола, и тогда пусть он приступит к совершению ее и будет как природный житель земли; а никакой необрезанный не должен есть ее;","Исх 12:49":"один закон да будет и для природного жителя и для пришельца, поселившегося между вами.","Исх 12:50":"И сделали все сыны Израилевы: как повелел Господь Моисею и Аарону, так и сделали.","Исх 12:51":"В этот самый день Господь вывел сынов Израилевых из земли Египетской по ополчениям их.","Исх 13:21":"Господь же шел пред ними днем в столпе облачном, показывая им путь, а ночью в столпе огненном, светя им, дабы идти им и днем и ночью.","Чис 1:47":"А левиты по поколениям отцов их не были исчислены между ними.","Втор 23:3":"Аммонитянин и Моавитянин не может войти в общество Господне, и десятое поколение их не может войти в общество Господне во веки,","Втор 34:7":"Моисею было сто двадцать лет, когда он умер; но зрение его не притупилось, и крепость в нем не истощилась.","Нав 1:1":"По смерти Моисея, раба Господня, Господь сказал Иисусу, сыну Навину, служителю Моисееву:","Нав 1:2":"Моисей, раб Мой, умер; итак встань, перейди через Иордан сей, ты и весь народ сей, в землю, которую Я даю им, сынам Израилевым.","Нав 24:2":"И сказал Иисус всему народу: так говорит Господь Бог Израилев: «за рекою жили отцы ваши издревле, Фарра, отец Авраама и отец Нахора, и служили иным богам.","Нав 24:3":"Но Я взял отца вашего Авраама из-за реки и водил его по всей земле Ханаанской, и размножил семя его и дал ему Исаака.","Нав 24:32":"И кости Иосифа, которые вынесли сыны Израилевы из Египта, схоронили в Сихеме, в участке поля, которое купил Иаков у сынов Еммора, отца Сихемова, за сто монет и которое досталось в удел сынам Иосифовым.","Суд 6:11":"И пришел Ангел Господень и сел в Офре под дубом, принадлежащим Иоасу, потомку Авиезерову; сын его Гедеон выколачивал тогда пшеницу в точиле, чтобы скрыться от Мадианитян.","Руф 1:1":"В те дни, когда управляли судьи, случился голод на земле. И пошел один человек из Вифлеема Иудейского со своею женою и двумя сыновьями своими жить на полях Моавитских.","Руф 1:2":"Имя человека того Елимелех, имя жены его Ноеминь, а имена двух сынов его Махлон и Хилеон; они были Ефрафяне из Вифлеема Иудейского. И пришли они на поля Моавитские и остались там.","Руф 1:3":"И умер Елимелех, муж Ноемини, и осталась она с двумя сыновьями своими.","Руф 1:4":"Они взяли себе жен из Моавитянок, имя одной Орфа, а имя другой Руфь, и жили там около десяти лет.","Руф 1:5":"Но потом и оба [сына ее], Махлон и Хилеон, умерли, и осталась та женщина после обоих своих сыновей и после мужа своего.","Руф 1:6":"И встала она со снохами своими и пошла обратно с полей Моавитских, ибо услышала на полях Моавитских, что Бог посетил народ Свой и дал им хлеб.","Руф 1:7":"И вышла она из того места, в котором жила, и обе снохи ее с нею. Когда они шли по дороге, возвращаясь в землю Иудейскую,","Руф 1:8":"Ноеминь сказала двум снохам своим: пойдите, возвратитесь каждая в дом матери своей; да сотворит Господь с вами милость, как вы поступали с умершими и со мною!","Руф 1:9":"да даст вам Господь, чтобы вы нашли пристанище каждая в доме своего мужа! И поцеловала их. Но они подняли вопль и плакали","Руф 1:10":"и сказали: нет, мы с тобою возвратимся к народу твоему.","Руф 1:11":"Ноеминь же сказала: возвратитесь, дочери мои; зачем вам идти со мною? Разве еще есть у меня сыновья в моем чреве, которые были бы вам мужьями?","Руф 1:12":"Возвратитесь, дочери мои, пойдите, ибо я уже стара, чтоб быть замужем. Да если б я и сказала: «есть мне еще надежда», и даже если бы я сию же ночь была с мужем и потом родила сыновей, —","Руф 1:13":"то можно ли вам ждать, пока они выросли бы? можно ли вам медлить и не выходить замуж? Нет, дочери мои, я весьма сокрушаюсь о вас, ибо рука Господня постигла меня.","Руф 1:14":"Они подняли вопль и опять стали плакать. И Орфа простилась со свекровью своею [и возвратилась к народу своему], а Руфь осталась с нею.","Руф 1:15":"[Ноеминь] сказала [Руфи]: вот, невестка твоя возвратилась к народу своему и к своим богам; возвратись и ты вслед за невесткою твоею.","Руф 1:16":"Но Руфь сказала: не принуждай меня оставить тебя и возвратиться от тебя; но куда ты пойдешь, туда и я пойду, и где ты жить будешь, там и я буду жить; народ твой будет моим народом, и твой Бог — моим Богом;","Руф 1:17":"и где ты умрешь, там и я умру и погребена буду; пусть то и то сделает мне Господь, и еще больше сделает; смерть одна разлучит меня с тобою.","Руф 1:18":"[Ноеминь,] видя, что она твердо решилась идти с нею, перестала уговаривать ее.","Руф 1:19":"И шли обе они, доколе не пришли в Вифлеем. Когда пришли они в Вифлеем, весь город пришел в движение от них, и говорили: это Ноеминь?","Руф 1:20":"Она сказала им: не называйте меня Ноеминью, а называйте меня Марою, потому что Вседержитель послал мне великую горесть;","Руф 1:21":"я вышла отсюда с достатком, а возвратил меня Господь с пустыми руками; зачем называть меня Ноеминью, когда Господь заставил меня страдать, и Вседержитель послал мне несчастье?","Руф 1:22":"И возвратилась Ноеминь, и с нею сноха ее Руфь Моавитянка, пришедшая с полей Моавитских, и пришли они в Вифлеем в начале жатвы ячменя.","Руф 2:1":"У Ноемини был родственник по мужу ее, человек весьма знатный, из племени Елимелехова, имя ему Вооз.","Руф 2:2":"И сказала Руфь Моавитянка Ноемини: пойду я на поле и буду подбирать колосья по следам того, у кого найду благоволение. Она сказала ей: пойди, дочь моя.","Руф 2:3":"Она пошла, и пришла, и подбирала в поле колосья позади жнецов. И случилось, что та часть поля принадлежала Воозу, который из племени Елимелехова.","Руф 2:4":"И вот, Вооз пришел из Вифлеема и сказал жнецам: Господь с вами! Они сказали ему: да благословит тебя Господь!","Руф 2:5":"И сказал Вооз слуге своему, приставленному к жнецам: чья это молодая женщина?","Руф 2:6":"Слуга, приставленный к жнецам, отвечал и сказал: эта молодая женщина — Моавитянка, пришедшая с Ноеминью с полей Моавитских;","Руф 2:7":"она сказала: «буду я подбирать и собирать между снопами позади жнецов»; и пришла, и находится здесь с самого утра доселе; мало бывает она дома.","Руф 2:8":"И сказал Вооз Руфи: послушай, дочь моя, не ходи подбирать на другом поле и не переходи отсюда, но будь здесь с моими служанками;","Руф 2:9":"пусть в глазах твоих будет то поле, где они жнут, и ходи за ними; вот, я приказал слугам моим не трогать тебя; когда захочешь пить, иди к сосудам и пей, откуда черпают слуги мои.","Руф 2:10":"Она пала на лице свое и поклонилась до земли и сказала ему: чем снискала я в глазах твоих милость, что ты принимаешь меня, хотя я и чужеземка?","Руф 2:11":"Вооз отвечал и сказал ей: мне сказано все, что сделала ты для свекрови своей по смерти мужа твоего, что ты оставила твоего отца и твою мать и твою родину и пришла к народу, которого ты не знала вчера и третьего дня;","Руф 2:12":"да воздаст Господь за это дело твое, и да будет тебе полная награда от Господа Бога Израилева, к Которому ты пришла, чтоб успокоиться под Его крылами!","Руф 2:13":"Она сказала: да буду я в милости пред очами твоими, господин мой! Ты утешил меня и говорил по сердцу рабы твоей, между тем как я не стою ни одной из рабынь твоих.","Руф 2:14":"И сказал ей Вооз: время обеда; приди сюда и ешь хлеб и обмакивай кусок твой в уксус. И села она возле жнецов. Он подал ей хлеба; она ела, наелась, и еще осталось.","Руф 2:15":"И встала, чтобы подбирать. Вооз дал приказ слугам своим, сказав: пусть подбирает она и между снопами, и не обижайте ее;","Руф 2:16":"да и от снопов откидывайте ей и оставляйте, пусть она подбирает [и ест], и не браните ее.","Руф 2:17":"Так подбирала она на поле до вечера и вымолотила собранное, и вышло около ефы ячменя.","Руф 2:18":"Взяв это, она пошла в город, и свекровь ее увидела, что она набрала. И вынула [Руфь из пазухи своей] и дала ей то, что оставила, наевшись сама.","Руф 2:19":"И сказала ей свекровь ее: где ты собирала сегодня и где работала? да будет благословен принявший тебя! [Руфь!] объявила свекрови своей, у кого она работала, и сказала: человеку тому, у которого я сегодня работала, имя Вооз.","Руф 2:20":"И сказала Ноеминь снохе своей: благословен он от Господа за то, что не лишил милости своей ни живых, ни мертвых! И сказала ей Ноеминь: человек этот близок к нам; он из наших родственников.","Руф 2:21":"Руфь Моавитянка сказала [свекрови своей]: он даже сказал мне: будь с моими служанками, доколе не докончат они жатвы моей.","Руф 2:22":"И сказала Ноеминь снохе своей Руфи: хорошо, дочь моя, что ты будешь ходить со служанками его, и не будут оскорблять тебя на другом поле.","Руф 2:23":"Так была она со служанками Воозовыми и подбирала [колосья], доколе не кончилась жатва ячменя и жатва пшеницы, и жила у свекрови своей.","Руф 3:1":"И сказала ей Ноеминь, свекровь ее: дочь моя, не поискать ли тебе пристанища, чтобы тебе хорошо было?","Руф 3:2":"Вот, Вооз, со служанками которого ты была, родственник наш; вот, он в эту ночь веет на гумне ячмень;","Руф 3:3":"умойся, помажься, надень на себя [нарядные] одежды твои и пойди на гумно, но не показывайся ему, доколе не кончит есть и пить;","Руф 3:4":"когда же он ляжет спать, узнай место, где он ляжет; тогда придешь и откроешь у ног его и ляжешь; он скажет тебе, что тебе делать.","Руф 3:5":"[Руфь] сказала ей: сделаю все, что ты сказала мне.","Руф 3:6":"И пошла на гумно и сделала все так, как приказывала ей свекровь ее.","Руф 3:7":"Вооз наелся и напился, и развеселил сердце свое, и пошел и лег спать подле скирда. И она пришла тихонько, открыла у ног его и легла.","Руф 3:8":"В полночь он содрогнулся, приподнялся, и вот, у ног его лежит женщина.","Руф 3:9":"И сказал [ей Вооз]: кто ты? Она сказала: я Руфь, раба твоя, простри крыло твое на рабу твою, ибо ты родственник.","Руф 3:10":"[Вооз] сказал: благословенна ты от Господа [Бога], дочь моя! это последнее твое доброе дело сделала ты еще лучше прежнего, что ты не пошла искать молодых людей, ни бедных, ни богатых;","Руф 3:11":"итак, дочь моя, не бойся, я сделаю тебе все, что ты сказала; ибо у всех ворот народа моего знают, что ты женщина добродетельная;","Руф 3:12":"хотя и правда, что я родственник, но есть еще родственник ближе меня;","Руф 3:13":"переночуй эту ночь; завтра же, если он примет тебя, то хорошо, пусть примет; а если он не захочет принять тебя, то я приму; жив Господь! Спи до утра.","Руф 3:14":"И спала она у ног его до утра и встала прежде, нежели могли они распознать друг друга. И сказал Вооз: пусть не знают, что женщина приходила на гумно.","Руф 3:15":"И сказал ей: подай верхнюю одежду, которая на тебе, подержи ее. Она держала, и он отмерил [ей] шесть мер ячменя, и положил на нее, и пошел в город.","Руф 3:16":"А [Руфь] пришла к свекрови своей. Та сказала [ей]: что, дочь моя? Она пересказала ей все, что сделал ей человек тот.","Руф 3:17":"И сказала [ей]: эти шесть мер ячменя он дал мне и сказал мне: не ходи к свекрови своей с пустыми руками.","Руф 3:18":"Та сказала: подожди, дочь моя, доколе не узнаешь, чем кончится дело; ибо человек тот не останется в покое, не кончив сегодня дела.","Руф 4:1":"Вооз вышел к воротам и сидел там. И вот, идет мимо родственник, о котором говорил Вооз. И сказал ему [Вооз]: зайди сюда и сядь здесь. Тот зашел и сел.","Руф 4:2":"[Вооз] взял десять человек из старейшин города и сказал: сядьте здесь. И они сели.","Руф 4:3":"И сказал [Вооз] родственнику: Ноеминь, возвратившаяся с полей Моавитских, продает часть поля, принадлежащую брату нашему Елимелеху;","Руф 4:4":"я решился довести до ушей твоих и сказать: купи при сидящих здесь и при старейшинах народа моего; если хочешь выкупить, выкупай; а если не хочешь выкупить, скажи мне, и я буду знать; ибо кроме тебя некому выкупить; а по тебе я. Тот сказал: я выкупаю.","Руф 4:5
