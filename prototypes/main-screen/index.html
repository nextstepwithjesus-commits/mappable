":"Вооз сказал: когда ты купишь поле у Ноемини, то должен купить и у Руфи Моавитянки, жены умершего, и должен взять ее в замужество, чтобы восстановить имя умершего в уделе его.","Руф 4:6":"И сказал тот родственник: не могу я взять ее себе, чтобы не расстроить своего удела; прими ее ты, ибо я не могу принять.","Руф 4:7":"Прежде такой был обычай у Израиля при выкупе и при мене для подтверждения какого-либо дела: один снимал сапог свой и давал другому, [который принимал право родственника,] и это было свидетельством у Израиля.","Руф 4:8":"И сказал тот родственник Воозу: купи себе. И снял сапог свой [и дал ему].","Руф 4:9":"И сказал Вооз старейшинам и всему народу: вы теперь свидетели тому, что я покупаю у Ноемини все Елимелехово и все Хилеоново и Махлоново;","Руф 4:10":"также и Руфь Моавитянку, жену Махлонову, беру себе в жену, чтоб оставить имя умершего в уделе его, и чтобы не исчезло имя умершего между братьями его и у ворот местопребывания его: вы сегодня свидетели тому.","Руф 4:11":"И сказал весь народ, который при воротах, и старейшины: мы свидетели; да соделает Господь жену, входящую в дом твой, как Рахиль и как Лию, которые обе устроили дом Израилев; приобретай богатство в Ефрафе, и да славится имя твое в Вифлееме;","Руф 4:12":"и да будет дом твой, как дом Фареса, которого родила Фамарь Иуде, от того семени, которое даст тебе Господь от этой молодой женщины.","Руф 4:13":"И взял Вооз Руфь, и она сделалась его женою. И вошел он к ней, и Господь дал ей беременность, и она родила сына.","Руф 4:14":"И говорили женщины Ноемини: благословен Господь, что Он не оставил тебя ныне без наследника! И да будет славно имя его в Израиле!","Руф 4:15":"Он будет тебе отрадою и питателем в старости твоей, ибо его родила сноха твоя, которая любит тебя, которая для тебя лучше семи сыновей.","Руф 4:16":"И взяла Ноеминь дитя сие, и носила его в объятиях своих, и была ему нянькою.","Руф 4:17":"Соседки нарекли ему имя и говорили: «у Ноемини родился сын», и нарекли ему имя: Овид. Он отец Иессея, отца Давидова.","Руф 4:18":"И вот род Фаресов: Фарес родил Есрома;","Руф 4:19":"Есром родил Арама; Арам родил Аминадава;","Руф 4:20":"Аминадав родил Наассона; Наассон родил Салмона;","Руф 4:21":"Салмон родил Вооза; Вооз родил Овида;","Руф 4:22":"Овид родил Иессея; Иессей родил Давида.","1Цар 16:1":"И сказал Господь Самуилу: доколе будешь ты печалиться о Сауле, которого Я отверг, чтоб он не был царем над Израилем? Наполни рог твой елеем и пойди; Я пошлю тебя к Иессею Вифлеемлянину, ибо между сыновьями его Я усмотрел Себе царя.","1Цар 16:11":"И сказал Самуил Иессею: все ли дети здесь? И отвечал Иессей: есть еще меньший; он пасет овец. И сказал Самуил Иессею: пошли и возьми его, ибо мы не сядем обедать, доколе не придет он сюда.","1Цар 16:13":"И взял Самуил рог с елеем и помазал его среди братьев его, и почивал Дух Господень на Давиде с того дня и после; Самуил же встал и отошел в Раму.","1Цар 16:19":"И послал Саул вестников к Иессею и сказал: пошли ко мне Давида, сына твоего, который при стаде.","1Цар 17:12":"Давид же был сын Ефрафянина из Вифлеема Иудина, по имени Иессея, у которого было восемь сыновей. Этот человек во дни Саула достиг старости и был старший между мужами.","1Цар 17:23":"И вот, когда он разговаривал с ними, единоборец, по имени Голиаф, Филистимлянин из Гефа, выступает из рядов Филистимских и говорит те слова, и Давид услышал их.","1Цар 17:45":"А Давид отвечал Филистимлянину: ты идешь против меня с мечом и копьем и щитом, а я иду против тебя во имя Господа Саваофа, Бога воинств Израильских, которые ты поносил;","1Цар 20:6":"Если отец твой спросит обо мне, ты скажи: «Давид выпросился у меня сходить в свой город Вифлеем; потому что там годичное жертвоприношение всего родства его».","1Цар 20:27":"Наступил и второй день новомесячия, а место Давида оставалось праздным. Тогда сказал Саул сыну своему Ионафану: почему сын Иессеев не пришел к обеду ни вчера, ни сегодня?","2Цар 5:4":"Тридцать лет было Давиду, когда он воцарился; царствовал сорок лет.","2Цар 5:5":"В Хевроне царствовал над Иудою семь лет и шесть месяцев, и в Иерусалиме царствовал тридцать три года над всем Израилем и Иудою.","2Цар 5:13":"И взял Давид еще наложниц и жен из Иерусалима, после того, как пришел из Хеврона.","2Цар 5:14":"И родились еще у Давида сыновья и дочери. И вот имена родившихся у него в Иерусалиме: Самус, и Совав, и Нафан, и Соломон,","3Цар 2:10":"И почил Давид с отцами своими и погребен был в городе Давидовом.","3Цар 2:11":"Времени царствования Давида над Израилем было сорок лет: в Хевроне царствовал он семь лет и тридцать три года царствовал в Иерусалиме.","3Цар 6:1":"В четыреста восьмидесятом году по исшествии сынов Израилевых из земли Египетской, в четвертый год царствования Соломонова над Израилем, в месяц Зиф, который есть второй месяц, начал он строить храм Господу.","3Цар 17:1":"И сказал Илия [пророк], Фесвитянин, из жителей Галаадских, Ахаву: жив Господь Бог Израилев, пред Которым я стою! в сии годы не будет ни росы, ни дождя, разве только по моему слову.","4Цар 8:24":"И почил Иорам с отцами своими, и погребен с отцами своими в городе Давидовом. И воцарился Охозия, сын его, вместо него.","4Цар 18:10":"и взял ее через три года; в шестой год Езекии, то есть в девятый год Осии, царя Израильского, взята Самария.","1Пар 1:24":"[Сыновья же] Симовы: Арфаксад, [Каинан,] Сала,","1Пар 1:25":"Евер, Фалек, Рагав,","1Пар 1:26":"Серух, Нахор, Фарра,","1Пар 1:27":"Аврам, он же Авраам.","1Пар 1:32":"Сыновья Хеттуры, наложницы Авраамовой: она родила Зимрана, Иокшана, Медана, Мадиана, Ишбака и Шуаха. Сыновья Иокшана: Шева и Дедан. [Сыновья Дедановы: Рагуил, Навдеил, Ассуриим, Астусиим и Асомин.]","1Пар 3:1":"Сыновья Давида, родившиеся у него в Хевроне, были: первенец Амнон, от Ахиноамы Изреелитянки; второй — Далуия, от Авигеи Кармилитянки;","1Пар 3:5":"А сии родились у него в Иерусалиме: Шима, Шовав, Нафан и Соломон, четверо от Вирсавии, дочери Аммииловой;","1Пар 3:6":"Ивхар, Елишама, Елифелет,","1Пар 3:7":"Ногаг, Нефег, Иафиа,","1Пар 3:8":"Елишама, Елиада и Елифелет — девятеро.","1Пар 3:9":"Вот все сыновья Давида, кроме сыновей от наложниц. Сестра их Фамарь.","1Пар 3:11":"его сын Иорам, его сын Охозия, его сын Иоас,","1Пар 3:12":"его сын Амасия, его сын Азария, его сын Иофам,","Езд 2:1":"Вот сыны страны из пленников переселения, которых Навуходоносор, царь Вавилонский, отвел в Вавилон, возвратившиеся в Иерусалим и Иудею, каждый в свой город, —","Езд 2:2":"пришедшие с Зоровавелем, Иисусом, Неемиею, Сараием, Реелаем, Мардохеем, Билшаном, Мисфаром, Бигваем, Рехумом, Вааном. Число людей народа Израилева:","Езд 7:6":"сей Ездра вышел из Вавилона. Он был книжник, сведущий в законе Моисеевом, который дал Господь Бог Израилев. И дал ему царь все по желанию его, так как рука Господа Бога его была над ним.","Неем 9:7":"Ты Сам, Господи Боже, избрал Аврама, и вывел его из Ура Халдейского, и дал ему имя Авраама,","Неем 9:8":"и нашел сердце его верным пред Тобою, и заключил с ним завет, чтобы дать [ему и] семени его землю Хананеев, Хеттеев, Аморреев, Ферезеев, Иевусеев и Гергесеев. И Ты исполнил слово Свое, потому что Ты праведен.","Ис 41:8":"А ты, Израиль, раб Мой, Иаков, которого Я избрал, семя Авраама, друга Моего, -","Ис 51:2":"Посмотрите на Авраама, отца вашего, и на Сарру, родившую вас: ибо Я призвал его одного и благословил его, и размножил его.","Иез 33:24":"сын человеческий! живущие на опустелых местах в земле Израилевой говорят: «Авраам был один, и получил во владение землю сию, а нас много; итак нам дана земля сия во владение».","Дан 1:1":"В третий год царствования Иоакима, царя Иудейского, пришел Навуходоносор, царь Вавилонский, к Иерусалиму и осадил его.","Дан 1:2":"И предал Господь в руку его Иоакима, царя Иудейского, и часть сосудов дома Божия, и он отправил их в землю Сеннаар, в дом бога своего, и внес эти сосуды в сокровищницу бога своего.","Дан 1:3":"И сказал царь Асфеназу, начальнику евнухов своих, чтобы он из сынов Израилевых, из рода царского и княжеского, привел","Дан 1:4":"отроков, у которых нет никакого телесного недостатка, красивых видом, и понятливых для всякой науки, и разумеющих науки, и смышленых и годных служить в чертогах царских, и чтобы научил их книгам и языку Халдейскому.","Дан 1:5":"И назначил им царь ежедневную пищу с царского стола и вино, которое сам пил, и велел воспитывать их три года, по истечении которых они должны были предстать пред царя.","Дан 1:6":"Между ними были из сынов Иудиных Даниил, Анания, Мисаил и Азария.","Мф 1:1":"Родословие Иисуса Христа, Сына Давидова, Сына Авраамова.","Мф 1:2":"Авраам родил Исаака; Исаак родил Иакова; Иаков родил Иуду и братьев его;","Мф 1:3":"Иуда родил Фареса и Зару от Фамари; Фарес родил Есрома; Есром родил Арама;","Мф 1:4":"Арам родил Аминадава; Аминадав родил Наассона; Наассон родил Салмона;","Мф 1:5":"Салмон родил Вооза от Рахавы; Вооз родил Овида от Руфи; Овид родил Иессея;","Мф 1:6":"Иессей родил Давида царя; Давид царь родил Соломона от бывшей за Уриею;","Мф 1:7":"Соломон родил Ровоама; Ровоам родил Авию; Авия родил Асу;","Мф 1:8":"Аса родил Иосафата; Иосафат родил Иорама; Иорам родил Озию;","Мф 1:9":"Озия родил Иоафама; Иоафам родил Ахаза; Ахаз родил Езекию;","Мф 1:10":"Езекия родил Манассию; Манассия родил Амона; Амон родил Иосию;","Мф 1:11":"Иосия родил Иоакима; Иоаким родил Иехонию и братьев его, перед переселением в Вавилон.","Мф 1:12":"По переселении же в Вавилон, Иехония родил Салафииля; Салафииль родил Зоровавеля;","Мф 1:13":"Зоровавель родил Авиуда; Авиуд родил Елиакима; Елиаким родил Азора;","Мф 1:14":"Азор родил Садока; Садок родил Ахима; Ахим родил Елиуда;","Мф 1:15":"Елиуд родил Елеазара; Елеазар родил Матфана; Матфан родил Иакова;","Мф 1:16":"Иаков родил Иосифа, мужа Марии, от Которой родился Иисус, называемый Христос.","Мф 1:17":"Итак всех родов от Авраама до Давида четырнадцать родов; и от Давида до переселения в Вавилон четырнадцать родов; и от переселения в Вавилон до Христа четырнадцать родов.","Мф 1:18":"Рождество Иисуса Христа было так: по обручении Матери Его Марии с Иосифом, прежде нежели сочетались они, оказалось, что Она имеет во чреве от Духа Святаго.","Мф 1:19":"Иосиф же муж Ее, будучи праведен и не желая огласить Ее, хотел тайно отпустить Ее.","Мф 1:20":"Но когда он помыслил это, — се, Ангел Господень явился ему во сне и сказал: Иосиф, сын Давидов! не бойся принять Марию, жену твою, ибо родившееся в Ней есть от Духа Святаго;","Мф 1:21":"родит же Сына, и наречешь Ему имя Иисус, ибо Он спасет людей Своих от грехов их.","Мф 1:22":"А все сие произошло, да сбудется реченное Господом через пророка, который говорит:","Мф 1:23":"се, Дева во чреве приимет и родит Сына, и нарекут имя Ему Еммануил, что значит: с нами Бог.","Мф 1:24":"Встав от сна, Иосиф поступил, как повелел ему Ангел Господень, и принял жену свою,","Мф 1:25":"и не знал Ее. [Как] наконец Она родила Сына Своего первенца, и он нарек Ему имя: Иисус.","Мф 2:1":"Когда же Иисус родился в Вифлееме Иудейском во дни царя Ирода, пришли в Иерусалим волхвы с востока и говорят:","Мф 3:1":"В те дни приходит Иоанн Креститель и проповедует в пустыне Иудейской","Мф 3:9":"и не думайте говорить в себе: «отец у нас Авраам», ибо говорю вам, что Бог может из камней сих воздвигнуть детей Аврааму.","Мф 8:11":"Говорю же вам, что многие придут с востока и запада и возлягут с Авраамом, Исааком и Иаковом в Царстве Небесном;","Мф 22:32":"Я Бог Авраама, и Бог Исаака, и Бог Иакова? Бог не есть Бог мертвых, но живых.","Лк 1:73":"клятву, которою клялся Он Аврааму, отцу нашему, дать нам,","Лк 3:1":"В пятнадцатый же год правления Тиверия кесаря, когда Понтий Пилат начальствовал в Иудее, Ирод был четвертовластником в Галилее, Филипп, брат его, четвертовластником в Итурее и Трахонитской области, а Лисаний четвертовластником в Авилинее,","Лк 3:2":"при первосвященниках Анне и Каиафе, был глагол Божий к Иоанну, сыну Захарии, в пустыне.","Лк 3:3":"И он проходил по всей окрестной стране Иорданской, проповедуя крещение покаяния для прощения грехов,","Лк 3:4":"как написано в книге слов пророка Исаии, который говорит: глас вопиющего в пустыне: приготовьте путь Господу, прямыми сделайте стези Ему;","Лк 3:5":"всякий дол да наполнится, и всякая гора и холм да понизятся, кривизны выпрямятся и неровные пути сделаются гладкими;","Лк 3:6":"и узрит всякая плоть спасение Божие.","Лк 3:7":"Иоанн приходившему креститься от него народу говорил: порождения ехиднины! кто внушил вам бежать от будущего гнева?","Лк 3:8":"Сотворите же достойные плоды покаяния и не думайте говорить в себе: отец у нас Авраам, ибо говорю вам, что Бог может из камней сих воздвигнуть детей Аврааму.","Лк 3:9":"Уже и секира при корне дерев лежит: всякое дерево, не приносящее доброго плода, срубают и бросают в огонь.","Лк 3:10":"И спрашивал его народ: что же нам делать?","Лк 3:11":"Он сказал им в ответ: у кого две одежды, тот дай неимущему, и у кого есть пища, делай то же.","Лк 3:12":"Пришли и мытари креститься, и сказали ему: учитель! что нам делать?","Лк 3:13":"Он отвечал им: ничего не требуйте более определенного вам.","Лк 3:14":"Спрашивали его также и воины: а нам что делать? И сказал им: никого не обижайте, не клевещите, и довольствуйтесь своим жалованьем.","Лк 3:15":"Когда же народ был в ожидании, и все помышляли в сердцах своих об Иоанне, не Христос ли он, —","Лк 3:16":"Иоанн всем отвечал: я крещу вас водою, но идет Сильнейший меня, у Которого я недостоин развязать ремень обуви; Он будет крестить вас Духом Святым и огнем.","Лк 3:17":"Лопата Его в руке Его, и Он очистит гумно Свое и соберет пшеницу в житницу Свою, а солому сожжет огнем неугасимым.","Лк 3:18":"Многое и другое благовествовал он народу, поучая его.","Лк 3:19":"Ирод же четвертовластник, обличаемый от него за Иродиаду, жену брата своего, и за все, что сделал Ирод худого,","Лк 3:20":"прибавил ко всему прочему и то, что заключил Иоанна в темницу.","Лк 3:21":"Когда же крестился весь народ, и Иисус, крестившись, молился: отверзлось небо,","Лк 3:22":"и Дух Святый нисшел на Него в телесном виде, как голубь, и был глас с небес, глаголющий: Ты Сын Мой Возлюбленный; в Тебе Мое благоволение!","Лк 3:23":"Иисус, начиная Свое служение, был лет тридцати, и был, как думали, Сын Иосифов, Илиев,","Лк 3:24":"Матфатов, Левиин, Мелхиев, Ианнаев, Иосифов,","Лк 3:25":"Маттафиев, Амосов, Наумов, Еслимов, Наггеев,","Лк 3:26":"Маафов, Маттафиев, Семеиев, Иосифов, Иудин,","Лк 3:27":"Иоаннанов, Рисаев, Зоровавелев, Салафиилев, Нириев,","Лк 3:28":"Мелхиев, Аддиев, Косамов, Елмодамов, Иров,","Лк 3:29":"Иосиев, Елиезеров, Иоримов, Матфатов, Левиин,","Лк 3:30":"Симеонов, Иудин, Иосифов, Ионанов, Елиакимов,","Лк 3:31":"Мелеаев, Маинанов, Маттафаев, Нафанов, Давидов,","Лк 3:32":"Иессеев, Овидов, Воозов, Салмонов, Наассонов,","Лк 3:33":"Аминадавов, Арамов, Есромов, Фаресов, Иудин,","Лк 3:34":"Иаковлев, Исааков, Авраамов, Фаррин, Нахоров,","Лк 3:35":"Серухов, Рагавов, Фалеков, Еверов, Салин,","Лк 3:36":"Каинанов, Арфаксадов, Симов, Ноев, Ламехов,","Лк 3:37":"Мафусалов, Енохов, Иаредов, Малелеилов, Каинанов,","Лк 3:38":"Еносов, Сифов, Адамов, Божий.","Лк 13:28":"Там будет плач и скрежет зубов, когда увидите Авраама, Исаака и Иакова и всех пророков в Царствии Божием, а себя изгоняемыми вон.","Лк 16:22":"Умер нищий и отнесен был Ангелами на лоно Авраамово. Умер и богач, и похоронили его.","Лк 16:23":"И в аде, будучи в муках, он поднял глаза свои, увидел вдали Авраама и Лазаря на лоне его","Лк 16:24":"и, возопив, сказал: отче Аврааме! умилосердись надо мною и пошли Лазаря, чтобы омочил конец перста своего в воде и прохладил язык мой, ибо я мучаюсь в пламени сем.","Лк 16:25":"Но Авраам сказал: чадо! вспомни, что ты получил уже доброе твое в жизни твоей, а Лазарь — злое; ныне же он здесь утешается, а ты страдаешь;","Лк 16:26":"и сверх всего того между нами и вами утверждена великая пропасть, так что хотящие перейти отсюда к вам не могут, также и оттуда к нам не переходят.","Лк 16:27":"Тогда сказал он: так прошу тебя, отче, пошли его в дом отца моего,","Лк 16:28":"ибо у меня пять братьев; пусть он засвидетельствует им, чтобы и они не пришли в это место мучения.","Лк 16:29":"Авраам сказал ему: у них есть Моисей и пророки; пусть слушают их.","Лк 16:30":"Он же сказал: нет, отче Аврааме, но если кто из мертвых придет к ним, покаются.","Лк 16:31":"Тогда Авраам сказал ему: если Моисея и пророков не слушают, то если бы кто и из мертвых воскрес, не поверят.","Ин 7:42":"Не сказано ли в Писании, что Христос придет от семени Давидова и из Вифлеема, из того места, откуда был Давид?","Ин 8:33":"Ему отвечали: мы семя Авраамово и не были рабами никому никогда; как же Ты говоришь: сделаетесь свободными?","Ин 8:34":"Иисус отвечал им: истинно, истинно говорю вам: всякий, делающий грех, есть раб греха.","Ин 8:35":"Но раб не пребывает в доме вечно; сын пребывает вечно.","Ин 8:36":"Итак, если Сын освободит вас, то истинно свободны будете.","Ин 8:37":"Знаю, что вы семя Авраамово; однако ищете убить Меня, потому что слово Мое не вмещается в вас.","Ин 8:38":"Я говорю то, что видел у Отца Моего; а вы делаете то, что видели у отца вашего.","Ин 8:39":"Сказали Ему в ответ: отец наш есть Авраам. Иисус сказал им: если бы вы были дети Авраама, то дела Авраамовы делали бы.","Ин 8:40":"А теперь ищете убить Меня, Человека, сказавшего вам истину, которую слышал от Бога: Авраам этого не делал.","Ин 8:41":"Вы делаете дела отца вашего. На это сказали Ему: мы не от любодеяния рождены; одного Отца имеем, Бога.","Ин 8:42":"Иисус сказал им: если бы Бог был Отец ваш, то вы любили бы Меня, потому что Я от Бога исшел и пришел; ибо Я не Сам от Себя пришел, но Он послал Меня.","Ин 8:43":"Почему вы не понимаете речи Моей? Потому что не можете слышать слова Моего.","Ин 8:44":"Ваш отец диавол; и вы хотите исполнять похоти отца вашего. Он был человекоубийца от начала и не устоял в истине, ибо нет в нем истины. Когда говорит он ложь, говорит свое, ибо он лжец и отец лжи.","Ин 8:45":"А как Я истину говорю, то не верите Мне.","Ин 8:46":"Кто из вас обличит Меня в неправде? Если же Я говорю истину, почему вы не верите Мне?","Ин 8:47":"Кто от Бога, тот слушает слова Божии. Вы потому не слушаете, что вы не от Бога.","Ин 8:48":"На это Иудеи отвечали и сказали Ему: не правду ли мы говорим, что Ты Самарянин и что бес в Тебе?","Ин 8:49":"Иисус отвечал: во Мне беса нет; но Я чту Отца Моего, а вы бесчестите Меня.","Ин 8:50":"Впрочем Я не ищу Моей славы: есть Ищущий и Судящий.","Ин 8:51":"Истинно, истинно говорю вам: кто соблюдет слово Мое, тот не увидит смерти вовек.","Ин 8:52":"Иудеи сказали Ему: теперь узнали мы, что бес в Тебе. Авраам умер и пророки, а Ты говоришь: кто соблюдет слово Мое, тот не вкусит смерти вовек.","Ин 8:53":"Неужели Ты больше отца нашего Авраама, который умер? и пророки умерли: чем Ты Себя делаешь?","Ин 8:54":"Иисус отвечал: если Я Сам Себя славлю, то слава Моя ничто. Меня прославляет Отец Мой, о Котором вы говорите, что Он Бог ваш.","Ин 8:55":"И вы не познали Его, а Я знаю Его; и если скажу, что не знаю Его, то буду подобный вам лжец. Но Я знаю Его и соблюдаю слово Его.","Ин 8:56":"Авраам, отец ваш, рад был увидеть день Мой; и увидел и возрадовался.","Ин 8:57":"На это сказали Ему Иудеи: Тебе нет еще пятидесяти лет, — и Ты видел Авраама?","Ин 8:58":"Иисус сказал им: истинно, истинно говорю вам: прежде нежели был Авраам, Я есмь.","Деян 2:14":"Петр же, став с одиннадцатью, возвысил голос свой и возгласил им: мужи Иудейские, и все живущие в Иерусалиме! сие да будет вам известно, и внимайте словам моим:","Деян 3:13":"Бог Авраама и Исаака и Иакова, Бог отцов наших, прославил Сына Своего Иисуса, Которого вы предали и от Которого отреклись перед лицом Пилата, когда он полагал освободить Его.","Деян 7:2":"Но он сказал: мужи братия и отцы! послушайте. Бог славы явился отцу нашему Аврааму в Месопотамии, прежде переселения его в Харран,","Деян 7:3":"и сказал ему: выйди из земли твоей и из родства твоего и из дома отца твоего, и пойди в землю, которую покажу тебе.","Деян 7:4":"Тогда он вышел из земли Халдейской и поселился в Харране; а оттуда, по смерти отца его, переселил его Бог в сию землю, в которой вы ныне живете.","Деян 7:5":"И не дал ему на ней наследства ни на стопу ноги, а обещал дать ее во владение ему и потомству его по нем, когда еще был он бездетен.","Деян 7:6":"И сказал ему Бог, что потомки его будут переселенцами в чужой земле и будут в порабощении и притеснении лет четыреста.","Деян 7:7":"Но Я, сказал Бог, произведу суд над тем народом, у которого они будут в порабощении; и после того они выйдут и будут служить Мне на сем месте.","Деян 7:8":"И дал ему завет обрезания. По сем родил он Исаака и обрезал его в восьмой день; а Исаак родил Иакова, Иаков же двенадцать патриархов.","Деян 7:16":"и перенесены были в Сихем и положены во гробе, который купил Авраам ценою серебра у сынов Еммора Сихемова.","Деян 13:9":"Но Савл, он же и Павел, исполнившись Духа Святаго и устремив на него взор,","Деян 13:17":"Бог народа сего избрал отцов наших и возвысил сей народ во время пребывания в земле Египетской, и мышцею вознесенною вывел их из нее,","Деян 13:18":"и около сорока лет времени питал их в пустыне.","Деян 13:19":"И, истребив семь народов в земле Ханаанской, разделил им в наследие землю их.","Деян 13:20":"И после сего, около четырехсот пятидесяти лет, давал им судей до пророка Самуила.","Деян 13:21":"Потом просили они царя, и Бог дал им Саула, сына Кисова, мужа из колена Вениаминова. Так прошло лет сорок.","Деян 13:22":"Отринув его, поставил им царем Давида, о котором и сказал, свидетельствуя: нашел Я мужа по сердцу Моему, Давида, сына Иессеева, который исполнит все хотения Мои.","Иак 2:21":"Не делами ли оправдался Авраам, отец наш, возложив на жертвенник Исаака, сына своего?","Иак 2:22":"Видишь ли, что вера содействовала делам его, и делами вера достигла совершенства?","Иак 2:23":"И исполнилось слово Писания: «веровал Авраам Богу, и это вменилось ему в праведность, и он наречен другом Божиим».","Рим 1:3":"о Сыне Своем, Который родился от семени Давидова по плоти","Рим 4:1":"Что же, скажем, Авраам, отец наш, приобрел по плоти?","Рим 4:3":"Ибо что говорит Писание? Поверил Авраам Богу, и это вменилось ему в праведность.","Рим 4:9":"Блаженство сие относится к обрезанию, или к необрезанию? Мы говорим, что Аврааму вера вменилась в праведность.","Рим 4:10":"Когда вменилась? по обрезании или до обрезания? Не по обрезании, а до обрезания.","Рим 4:11":"И знак обрезания он получил, как печать праведности через веру, которую имел в необрезании, так что он стал отцом всех верующих в необрезании, чтобы и им вменилась праведность,","Рим 4:12":"и отцом обрезанных, не только принявших обрезание, но и ходящих по следам веры отца нашего Авраама, которую имел он в необрезании.","Рим 4:16":"Итак по вере, чтобы было по милости, дабы обетование было непреложно для всех, не только по закону, но и по вере потомков Авраама, который есть отец всем нам","Рим 4:17":"(как написано: Я поставил тебя отцом многих народов) пред Богом, Которому он поверил, животворящим мертвых и называющим несуществующее, как существующее.","Рим 4:18":"Он, сверх надежды, поверил с надеждою, через что сделался отцом многих народов, по сказанному: «так многочисленно будет семя твое».","Рим 4:19":"И, не изнемогши в вере, он не помышлял, что тело его, почти столетнего, уже омертвело, и утроба Саррина в омертвении;","Рим 4:20":"не поколебался в обетовании Божием неверием, но пребыл тверд в вере, воздав славу Богу","Рим 4:21":"и будучи вполне уверен, что Он силен и исполнить обещанное.","Рим 4:22":"Потому и вменилось ему в праведность.","Рим 9:7":"и не все дети Авраама, которые от семени его, но сказано: в Исааке наречется тебе семя.","Рим 11:1":"Итак, спрашиваю: неужели Бог отверг народ Свой? Никак. Ибо и я Израильтянин, от семени Авраамова, из колена Вениаминова.","2Кор 11:22":"Они Евреи? и я. Израильтяне? и я. Семя Авраамово? и я.","Гал 3:6":"Так Авраам поверил Богу, и это вменилось ему в праведность.","Гал 3:8":"И Писание, провидя, что Бог верою оправдает язычников, предвозвестило Аврааму: в тебе благословятся все народы.","Гал 3:16":"Но Аврааму даны были обетования и семени его. Не сказано: и потомкам, как бы о многих, но как об одном: и семени твоему, которое есть Христос.","Гал 3:17":"Я говорю то, что завета о Христе, прежде Богом утвержденного, закон, явившийся спустя четыреста тридцать лет, не отменяет так, чтобы обетование потеряло силу.","Гал 3:29":"Если же вы Христовы, то вы семя Авраамово и по обетованию наследники.","Гал 4:22":"Ибо написано: Авраам имел двух сынов, одного от рабы, а другого от свободной.","Гал 4:23":"Но который от рабы, тот рожден по плоти; а который от свободной, тот по обетованию.","Гал 4:24":"В этом есть иносказание. Это два завета: один от горы Синайской, рождающий в рабство, который есть Агарь,","Гал 4:25":"ибо Агарь означает гору Синай в Аравии и соответствует нынешнему Иерусалиму, потому что он с детьми своими в рабстве;","Гал 4:26":"а вышний Иерусалим свободен: он — матерь всем нам.","Гал 4:27":"Ибо написано: возвеселись, неплодная, нерождающая; воскликни и возгласи, не мучившаяся родами; потому что у оставленной гораздо более детей, нежели у имеющей мужа.","Гал 4:28":"Мы, братия, дети обетования по Исааку.","Гал 4:29":"Но, как тогда рожденный по плоти гнал рожденного по духу, так и ныне.","Гал 4:30":"Что же говорит Писание? Изгони рабу и сына ее, ибо сын рабы не будет наследником вместе с сыном свободной.","Гал 4:31":"Итак, братия, мы дети не рабы, но свободной.","Евр 6:13":"Бог, давая обетование Аврааму, как не мог никем высшим клясться, клялся Самим Собою,","Евр 6:14":"говоря: истинно благословляя благословлю тебя и размножая размножу тебя.","Евр 6:15":"И так Авраам, долготерпев, получил обещанное.","Евр 7:1":"Ибо Мелхиседек, царь Салима, священник Бога Всевышнего, тот, который встретил Авраама и благословил его, возвращающегося после поражения царей,","Евр 7:2":"которому и десятину отделил Авраам от всего, — во-первых, по знаменованию имени царь правды, а потом и царь Салима, то есть царь мира,","Евр 7:4":"Видите, как велик тот, которому и Авраам патриарх дал десятину из лучших добыч своих.","Евр 7:6":"Но сей, не происходящий от рода их, получил десятину от Авраама и благословил имевшего обетования.","Евр 11:8":"Верою Авраам повиновался призванию идти в страну, которую имел получить в наследие, и пошел, не зная, куда идет.","Евр 11:9":"Верою обитал он на земле обетованной, как на чужой, и жил в шатрах с Исааком и Иаковом, сонаследниками того же обетования;","Евр 11:10":"ибо он ожидал города, имеющего основание, которого художник и строитель Бог.","Евр 11:13":"Все сии умерли в вере, не получив обетований, а только издали видели оные, и радовались, и говорили о себе, что они странники и пришельцы на земле;","Евр 11:14":"ибо те, которые так говорят, показывают, что они ищут отечества.","Евр 11:15":"И если бы они в мыслях имели то отечество, из которого вышли, то имели бы время возвратиться;","Евр 11:16":"но они стремились к лучшему, то есть к небесному; посему и Бог не стыдится их, называя Себя их Богом: ибо Он приготовил им город.","Евр 11:17":"Верою Авраам, будучи искушаем, принес в жертву Исаака и, имея обетование, принес единородного,","Евр 11:18":"о котором было сказано: в Исааке наречется тебе семя.","Евр 11:19":"Ибо он думал, что Бог силен и из мертвых воскресить, почему и получил его в предзнаменование."},"persons":[["p-adam",["Адам"],"","человек",5,"Быт 2:7"],["p-eva",["Ева","Жена"],"","человек",5,"Быт 2:22"],["p-kain",["Каин"],"","человек",4,"Быт 4:1"],["p-enokh-syn-kaina",["Енох"],"сын Каина","человек",2,"Быт 4:17"],["p-irad",["Ирад"],"","человек",1,"Быт 4:18"],["p-mekhiael",["Мехиаель"],"","человек",1,"Быт 4:18"],["p-mafusal-syn-mekhiaelya",["Мафусал"],"сын Мехиаеля, потомок Каина","человек",1,"Быт 4:18"],["p-lamekh-kainit",["Ламех"],"сын Мафусала, потомок Каина","человек",3,"Быт 4:18"],["p-ada-zhena-lamekha",["Ада"],"жена Ламеха, потомка Каина","человек",2,"Быт 4:19"],["p-tsilla",["Цилла"],"жена Ламеха, потомка Каина","человек",2,"Быт 4:19"],["p-iaval",["Иавал"],"","человек",2,"Быт 4:20"],["p-iuval",["Иувал"],"","человек",2,"Быт 4:21"],["p-tuvalkain",["Тувалкаин"],"", <script>/* Эскиз «Библия наглядно»: маршрутизация по #адресу (история браузера), вклейки стихов,
   поиск, варианты главного экрана, журнал действий для ведущего. Без библиотек. */
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var root = document.documentElement;
  var main = document.getElementById('main');

  // ── Хранилище: всё в try/catch, эскиз работает и без него
  var mem = {};
  var LS = {
    get: function (k, d) {
      try { var v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : d) : JSON.parse(v); }

    },
    set: function (k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* без хранилища */ } },
    del: function (k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) { /* без хранилища */ } }
  };

  var params;

  // ── Имена лиц

  // ── Журнал

  if (!Array.isArray(log)) log = [];
  var countEl = document.querySelector('[data-h-count]');
  function addLog(type, data) {
    var e = { t: new Date().toISOString(), type: type, variant: variant, route: location.hash || '#/',
      width: window.innerWidth, layer: root.getAttribute('data-layer'), participant: LS.get('bn-part', '') };
    for (var k in data) if (data[k] !== undefined) e[k] = data[k];
    log.push(e);
    if (log.length > 20000) log.shift();
    LS.set(LOGKEY, log);
    if (countEl) countEl.textContent = String(log.length);
  }
  function labelOf(el) {
    var s = el.getAttribute('aria-label') || el.getAttribute('data-name') || el.textContent || el.value || '';
    return s.replace(/\s+/g, ' ').trim().slice(0, 80);
  }
  document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-host]')) return;
    var el = ev.target.closest('a,button,summary,select,input');
    addLog('click', el ? { el: el.tagName.toLowerCase(), label: labelOf(el), href: el.getAttribute('href') || undefined,
      x: Math.round(ev.clientX), y: Math.round(ev.clientY) }
      : { el: 'none', label: (ev.target.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40), x: Math.round(ev.clientX), y: Math.round(ev.clientY) });
  }, true);

  // ── Слой и тема
  function setLayer(v, silent) {
    root.setAttribute('data-layer', v);
    var sel = document.querySelector('[data-layer-select]');
    if (sel) sel.value = v;
    LS.set('bn-layer', v);
    if (!silent) addLog('layer', { value: v });
  }
  function setTheme(v) {
    if (v) root.setAttribute('data-theme', v); else root.removeAttribute('data-theme');
    LS.set('bn-theme', v);
  }
  setLayer(LS.get('bn-layer', 'simple'), true);
  setTheme(LS.get('bn-theme', ''));
  document.querySelector('[data-layer-select]').addEventListener('change', function (e) { setLayer(e.target.value); });

  // ── Стихи: адреса и вклейки
  var BOOKS = {};
  D.books.forEach(function (b) { BOOKS[b[0].toLowerCase()] = b[0]; });
  function normBook(s) {
    var t = s.replace(/\s+/g, '').toLowerCase().replace(/ё/g, 'е');
    if (BOOKS[t]) return BOOKS[t];
    for (var i = 0; i < D.books.length; i++) {
      var full = D.books[i][1].replace(/\s+/g, '').toLowerCase().replace(/ё/g, 'е');
      if (t.length >= 3 && (full === t || full.indexOf(t) === 0)) return D.books[i][0];
    }
    for (var j = 0; j < D.books.length; j++) {
      var ab = D.books[j][0].toLowerCase();
      if (t.length >= 2 && t.indexOf(ab) === 0 && t.length - ab.length <= 2) return D.books[j][0];
    }
    return null;
  }
  function expandRef(ref) {
    var out = [], book = null;
    ref.split(/;\s*/).forEach(function (part) {
      var m = part.trim().match(/^(?:(\d?\s*[А-ЯЁа-яё]+)\.?\s+)?(\d+)(?::([\d,\-–\s]+))?$/);
      if (!m) return;
      if (m[1]) book = normBook(m[1]);
      if (!book) return;
      if (!m[3]) return;
      m[3].split(',').forEach(function (piece) {
        var ab = piece.trim().replace('–', '-').split('-');
        var a = parseInt(ab[0], 10), z = parseInt(ab[1] || ab[0], 10);
        for (var v = a; v <= z && v - a < 200; v++) out.push(book + ' ' + m[2] + ':' + v);
      });
    });
    return out;
  }
  function dispKey(k) { return k.replace(/^(\d)(\S)/, '$1 $2').replace(' ', ' '); }
  function verseHTML(t) {
    return esc(t).replace(/\[[^\]]*\]/g, function (m) { return '<span class="br">' + m + '</span>'; })
      .replace(/\([^)]*\)/g, function (m) { return '<span class="br">' + m + '</span>'; });
  }
  function hasBr(t) { return /[\[\(]/.test(t); }
  function insetFor(ref) {

    box.className = 'inset';

    var br = false, html = '';
    keys.forEach(function (k, i) {
      var t = D.verses[k];
      if (t && hasBr(t)) br = true;
      html += '<p class="v"' + (i >= 3 ? ' hidden' : '') + '><span class="vadr">' + esc(dispKey(k)) + '</span>' +
        (t ? verseHTML(t) : '<span class="vnone">Текста этого стиха в эскизе нет.</span>') + '</p>';
    });
    if (keys.length > 3) html += '<button type="button" class="vmore">ещё ' + (keys.length - 3) + ' ' + plural(keys.length - 3, 'стих', 'стиха', 'стихов') + '</button>';
    if (br) html += '<p class="brnote">Слова в скобках [ ] и ( ) — в скобках Синодального издания.</p>';
    box.innerHTML = html;
    return box;
  }
  function plural(n, a, b, c) { var m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); }
  var insetSeq = 0;
  function toggleRef(btn) {
    var open = btn.getAttribute('aria-expanded') === 'true';
    if (open) {
      var old = document.getElementById(btn.getAttribute('aria-controls'));
      if (old) old.remove();
      btn.setAttribute('aria-expanded', 'false');
      return;
    }
    var box = insetFor(btn.getAttribute('data-ref'));
    box.id = 'inset-' + (++insetSeq);
    btn.setAttribute('aria-controls', box.id);
    btn.setAttribute('aria-expanded', 'true');
    var host = btn.closest('li, td, th, .uhead, .couple, p, blockquote, .gap, figcaption, h2');
    if (!host) host = btn.parentNode;
    var tag = host.tagName;
    if (tag === 'LI' || tag === 'TD' || tag === 'TH' || host.classList.contains('gap')) host.appendChild(box);
    else host.insertAdjacentElement('afterend', box);
  }

  // ── Выбор лица: «что открыть?»
  var ACTS = [['card', 'Карточка'], ['gen', 'Генеалогия'], ['time', 'Время'], ['geo', 'География'], ['links', 'Связи']];
  function toolHref(pid, k, label, nm) {
    var d = D.drawn[pid] || {};
    return d[k] || stubHref(label + ' — ' + nm);
  }
  function closeActs(except) {
    Array.prototype.forEach.call(document.querySelectorAll('.pick[aria-expanded="true"]'), function (b) {
      if (b === except) return;
      b.setAttribute('aria-expanded', 'false');
      var r = document.getElementById(b.getAttribute('aria-controls'));
      if (r) (r.tagName === 'TR' ? r : r).remove();
    });
  }
  var actSeq = 0;
  function togglePick(btn) {
    var open = btn.getAttribute('aria-expanded') === 'true';
    closeActs(btn);
    if (open) {
      var r0 = document.getElementById(btn.getAttribute('aria-controls'));
      if (r0) r0.remove();
      btn.setAttribute('aria-expanded', 'false');
      return;
    }
    var pid = btn.getAttribute('data-pid'), nm = btn.getAttribute('data-name');
    var inner = '<p class="acts-h">' + esc(nm) + ': что открыть?</p><ul class="btnrow">' + ACTS.map(function (a) {
      return '<li><a class="btn" href="' + toolHref(pid, a[0], a[1], nm) + '">' + a[1] + '</a></li>';
    }).join('') + '</ul>';
    var id = 'acts-' + (++actSeq), node;
    var td = btn.closest('td');
    if (td) {
      node = document.createElement('tr');
      node.className = 'actsrow';
      node.innerHTML = '<td colspan="2"><div class="acts">' + inner + '</div></td>';
      td.parentNode.insertAdjacentElement('afterend', node);
    } else {
      node = document.createElement('div');
      node.className = 'acts';
      node.innerHTML = inner;
      var li = btn.closest('li');
      var gn = btn.closest('.gap-names');
      if (gn) gn.insertAdjacentElement('afterend', node);
      else if (li) li.appendChild(node);
      else btn.insertAdjacentElement('afterend', node);
    }
    node.id = id;
    btn.setAttribute('aria-controls', id);
    btn.setAttribute('aria-expanded', 'true');
  }

  // ── Панель инструментов экрана
  var TOOLS = [['gen', 'Генеалогия'], ['time', 'Время'], ['geo', 'География'], ['links', 'Связи'], ['card', 'Карточка']];
  var TOOLNAME = { gen: 'Генеалогия', time: 'Время', geo: 'География', links: 'Связи', card: 'Карточка' };
  function fillToolbar(nav) {
    var pid = nav.getAttribute('data-pid'), cur = nav.getAttribute('data-current');
    var html = '<button type="button" class="btn back" data-back>' + BACK_ICON + '<span>Назад</span></button>';
    if (pid) {
      var nm = PN[pid] || pid;
      html += '<p class="subj"><span class="lbl">Выбрано:</span>' + esc(nm) + '</p><ul class="ttabs">' + TOOLS.map(function (t) {
        return '<li><a href="' + toolHref(pid, t[0], t[1], nm) + '"' + (t[0] === cur ? ' aria-current="page"' : '') + '>' + t[1] + '</a></li>';
      }).join('') + '</ul>';
    } else {
      html += '<p class="subj"><span class="lbl">Инструмент:</span>' + (TOOLNAME[cur] || '') + '</p>';
    }
    nav.innerHTML = html;
  }
  function fillCardTools(nav) {
    var pid = nav.getAttribute('data-pid'), nm = PN[pid] || pid;
    nav.innerHTML = '<ul class="btnrow">' + TOOLS.filter(function (t) { return t[0] !== 'card'; }).map(function (t) {
      return '<li><a class="btn" href="' + toolHref(pid, t[0], t[1], nm) + '">' + t[1] + '</a></li>';
    }).join('') + '</ul>';
  }
  var BACK_ICON = '<svg class="ico" viewBox="0 0 48 48" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M28 10L14 24l14 14"/></svg>';

  // ── Поиск
  var LAT = 'qwertyuiop[]asdfghjkl;\'zxcvbnm,.`', CYR = 'йцукенгшщзхъфывапролджэячсмитьбюё';
  function fixLayout(s) {
    if (/[а-яё]/i.test(s) || !/[a-z]/i.test(s)) return s;
    return s.toLowerCase().split('').map(function (c) { var i = LAT.indexOf(c); return i >= 0 ? CYR[i] : c; }).join('');
  }
  function nrm(s) { return s.toLowerCase().replace(/ё/g, 'е').replace(/[^0-9a-zа-я\s]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function matchForm(f, q) {
    if (f === q) return 4;
    if (f.indexOf(q) === 0 && q.length >= 2) return 3;
    var words = f.split(' ');
    for (var i = 1; i < words.length; i++) if (words[i].indexOf(q) === 0 && q.length >= 3) return 2;
    if (f.length >= 4 && q.indexOf(f.slice(0, -1)) === 0 && q.length - f.length <= 2) return 2;
    if (f.length === 3 && q.length === 3 && q.slice(0, 2) === f.slice(0, 2) && /[аяеуюи]$/.test(q)) return 1;
    return 0;
  }
  function primaryHref(pid, nm) {
    var d = D.drawn[pid] || {};
    return d.card || d.gen || d.time || d.geo || stubHref('Карточка — ' + nm);
  }
  function parseQueryRef(q) {
    var m = q.trim().match(/^(\d?\s*[А-ЯЁа-яё]+)\.?\s*(\d+)\s*[:.,]\s*(\d+)(?:\s*[-–]\s*(\d+))?$/);
    if (!m) return null;
    var b = normBook(m[1]);
    if (!b) return null;
    return { book: b, ref: b + ' ' + m[2] + ':' + m[3] + (m[4] ? '-' + m[4] : '') };
  }
  var AREAKIND = { tribe: 'колено', nation: 'народ', house: 'дом' };
  function runSearch(qRaw, box) {
    var q0 = (qRaw || '').trim();
    var html = '';
    if (!q0) { box.innerHTML = '<p>Введите имя, место или адрес стиха.</p>'; return; }

      var any = false, br = false, named = [];
      keys.forEach(function (k) {
        var t = D.verses[k];

          any = true; if (hasBr(t)) br = true;
          html += '<blockquote class="rverse"><span class="sr">' + esc(k) + ': </span>' + verseHTML(t) + '</blockquote>';
          (D.versePersons[k] || []).forEach(function (p) { if (named.indexOf(p) < 0) named.push(p); });
        }
      });
      if (!any) html += '<p>Текста этого стиха в эскизе нет. В эскиз вошли стихи, нужные его экранам, и главы Быт 5–7, 11, 12, 25; Исх 12; Руф 1–4; Мф 1; Лк 3.</p>';
      if (br) html += '<p class="hint">Слова в скобках [ ] и ( ) — в скобках Синодального издания.</p>';
      if (named.length) {
        html += '<h3>Названы в стихе — ' + named.length + '</h3><ul>' + named.map(function (p) {
          var info = PINFO[p] || [p, [p], '', '', 0, ''];
          return '<li class="res"><a class="rname" href="' + primaryHref(p, info[1][0]) + '">' + esc(PN[p] || p) + '</a>' +
            (info[2] ? '<span class="rsub">' + esc(info[2]) + '</span>' : '') + '</li>';
        }).join('') + '</ul>';
      } else if (any) {
        html += '<p class="hint">Лиц этого стиха в данных эскиза не найдено.</p>';
      }
      html += '</section>';
      box.innerHTML = html;
      return;
    }
    var q = nrm(fixLayout(q0));
    var res = [];
    D.persons.forEach(function (p) {
      var best = 0;
      p[1].forEach(function (f) { best = Math.max(best, matchForm(nrm(f), q)); });
      if (best) res.push([best, p]);
    });
    res.sort(function (a, b) { return b[0] - a[0] || b[1][4] - a[1][4] || (a[1][1][0] < b[1][1][0] ? -1 : 1); });
    var areas = D.areas.filter(function (a) {
      return nrm(a[1]).split(' ').some(function (w) { return w.indexOf(q) === 0 || (q.length >= 4 && w.indexOf(q.slice(0, -1)) === 0); });
    });
    var fixed = fixLayout(q0) !== q0 ? ' (исправлена раскладка: «' + esc(fixLayout(q0)) + '»)' : '';
    var total = res.length + areas.length;
    html += '<p class="res-h">По запросу «' + esc(q0) + '»' + fixed + ' найдено: ' + total + '</p>';
    if (!total) {
      html += '<p>Ничего не найдено. Проверьте написание или попробуйте адрес стиха, например: Руф 4:17.</p>';
    }
    if (res.length) {
      html += '<section class="res-sec" aria-labelledby="rp"><h2 id="rp">Люди — ' + res.length + '</h2><ul>';
      res.slice(0, 40).forEach(function (r, i) {
        var p = r[1], nm = p[1][0];
        var other = p[1].slice(1).filter(function (f) { return nrm(f).indexOf(q) === 0; });
        html += '<li class="res"><a class="rname" href="' + primaryHref(p[0], nm) + '">' + esc(nm) + '</a>' +
          (p[2] ? '<span class="rsub">' + esc(p[2]) + '</span>' : '') +
          '<span class="rkind">' + esc(p[3]) + (other.length ? '; иначе — ' + esc(other.join(', ')) : '') +
          (p[5] ? '; впервые назван — ' + esc(p[5]) : '') + '</span>';
        if (i < 3) {
          html += '<ul class="rtools" aria-label="Открыть: ' + esc(nm) + '">' + TOOLS.map(function (t) {
            return '<li><a href="' + toolHref(p[0], t[0], t[1], nm) + '">' + t[1] + '</a></li>';
          }).join('') + '</ul>';
        }
        html += '</li>';
      });
      html += '</ul>';
      if (res.length > 40) html += '<p class="hint">ещё ' + (res.length - 40) + ' — уточните запрос</p>';
      html += '</section>';
    }
    if (areas.length) {
      html += '<section class="res-sec" aria-labelledby="ra"><h2 id="ra">Колена, народы, дома — ' + areas.length + '</h2><ul>' + areas.map(function (a) {
        return '<li class="res"><a class="rname" href="' + stubHref('Генеалогия — ' + a[1]) + '">' + esc(a[1]) + '</a>' +
          '<span class="rkind">' + (AREAKIND[a[2]] || 'область') + ' — показ в Генеалогии</span></li>';
      }).join('') + '</ul></section>';
    }
    box.innerHTML = html;
  }
  var PINFO = {};
  D.persons.forEach(function (p) { PINFO[p[0]] = p; });

  document.querySelector('[data-search]').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    addLog('search', { query: v });
    if (!v) return;
    location.hash = '#/s/' + encodeURIComponent(v);
  });

  // ── История: «Назад» возвращает в прежний экран
  var navN = 0;
  try {
    if (!history.state || typeof history.state.n !== 'number') history.replaceState({ n: 0 }, '');
    navN = history.state.n;
  } catch (e) { navN = 0; }
  function goBack() {
    var n = 0;
    try { n = history.state && history.state.n || 0; } catch (e) { n = 0; }
    if (n > 0) history.back(); else location.hash = '#/';
  }

  // ── Отрисовка экрана по адресу
  var first = true;
  function route() {
    try {
      if (!history.state || typeof history.state.n !== 'number') history.replaceState({ n: navN + 1 }, '');
      navN = history.state.n;
    } catch (e) { /* без истории */ }
    var h = (location.hash || '').replace(/^#/, '') || '/';
    var seg = h.split('/').filter(Boolean);
    var tpl, ctx = {};
    if (!seg.length) tpl = 'home-' + variant;
    else if (seg[0] === 's') { tpl = 'search'; ctx.q = safeDecode(seg.slice(1).join('/')); }
    else if (seg[0] === 'gen' && seg[1]) tpl = 'gen-' + seg[1];
    else if (seg[0] === 'time') { tpl = 'time'; ctx.sel = seg[1] || ''; }
    else if (seg[0] === 'geo') tpl = 'geo-' + seg[1];
    else if (seg[0] === 'card') tpl = 'card-' + seg[1];
    else if (seg[0] === 'index') tpl = seg[1] === 'ruf' ? 'index-ruf' : 'index';
    else if (seg[0] === 'stub') { tpl = 'stub'; ctx.what = safeDecode(seg.slice(1).join('/')); }
    var t = document.getElementById('t-' + tpl);
    if (!t) { ctx.what = 'Адрес «' + h + '»'; t = document.getElementById('t-stub'); tpl = 'stub'; }
    main.replaceChildren(t.content.cloneNode(true));
    var scr = main.firstElementChild;
    var isHome = tpl.indexOf('home-') === 0;
    root.classList.toggle('is-home', isHome);
    document.querySelector('[data-home]').hidden = isHome;
    document.querySelector('[data-brand-slot]').innerHTML = isHome
      ? '<h1 class="brand" tabindex="-1">Библия наглядно</h1>' : '<p class="brand">Библия наглядно</p>';
    var title = scr.getAttribute('data-title') || 'Библия наглядно';
    var cont = scr.getAttribute('data-continue');

    if (tpl === 'stub') {
      var w = scr.querySelector('[data-stub-what]');
      w.textContent = ctx.what ? 'Вы открыли: ' + ctx.what + '.' : '';
      addLog('stub', { what: ctx.what || '' });
    }
    if (tpl === 'search') {
      document.getElementById('q').value = ctx.q || '';
      scr.querySelector('.scr-h').textContent = 'Поиск: ' + (ctx.q || '');
      runSearch(ctx.q, scr.querySelector('[data-results]'));
      title = 'Поиск: ' + (ctx.q || '');
    } else if (!first) {
      document.getElementById('q').value = '';
    }
    if (tpl === 'time') {
      var sel = ctx.sel || 'none';
      var panel = scr.querySelector('[data-panel="' + sel + '"]') || scr.querySelector('[data-panel="none"]');
      Array.prototype.forEach.call(scr.querySelectorAll('[data-panel]'), function (p) { p.hidden = p !== panel; });
      var tb = scr.querySelector('.toolbar');
      if (sel.indexOf('p-') === 0 && panel.getAttribute('data-panel') === sel) {
        tb.setAttribute('data-pid', sel);
        var a = scr.querySelector('a.tp[data-pid="' + sel + '"]');
        if (a) { a.setAttribute('aria-current', 'true'); a.closest('.erow').classList.add('sel-p'); }
        scr.querySelector('.scr-h').textContent = (PN[sel] || '') + ' — Время';
        title = (PN[sel] || '') + ' — Время';
        cont = title;
      } else if (sel.indexOf('e-') === 0) {
        var row = scr.querySelector('.erow[data-epoch="' + sel.slice(2) + '"]');
        if (row) row.classList.add('sel');
        cont = 'Время — ' + (row ? row.querySelector('.ehead span').textContent : '');
      } else {
        cont = 'Время — эпохи по порядку';
      }
    }
    Array.prototype.forEach.call(scr.querySelectorAll('nav.toolbar'), fillToolbar);
    Array.prototype.forEach.call(scr.querySelectorAll('nav.cardtools'), fillCardTools);
    if (isHome) {
      var last = LS.get('bn-last', null);
      var cs = scr.querySelector('.continue');
      if (cs && last && last.href) {
        cs.hidden = false;
        var l = cs.querySelector('[data-continue-link]');
        l.href = last.href;
        l.textContent = 'Продолжить: ' + last.label;
      }
      document.title = 'Библия наглядно — главная';
    } else {
      document.title = title + ' — Библия наглядно';
      if (cont) LS.set('bn-last', { href: location.hash, label: cont });
    }
    addLog('screen', { screen: tpl, sel: ctx.sel || undefined, query: ctx.q || undefined });
    // фокус — на заголовок нового экрана; при первой загрузке не трогаем
    if (!first) {
      var hh = isHome ? document.querySelector('.brand') : scr.querySelector('.scr-h');
      if (hh) { try { hh.focus({ preventScroll: true }); } catch (e) { hh.focus(); } }
      window.scrollTo(0, 0);
    }
    first = false;
  }
  function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

  // ── Делегирование нажатий
  main.addEventListener('click', function (ev) {
    var b = ev.target.closest('button, a');
    if (!b) return;
    if (b.classList.contains('ref')) { toggleRef(b); return; }
    if (b.classList.contains('pick')) { togglePick(b); return; }
    if (b.classList.contains('vmore')) {
      Array.prototype.forEach.call(b.parentNode.querySelectorAll('.v[hidden]'), function (p) { p.hidden = false; });
      b.remove(); return;
    }
    if (b.classList.contains('morebtn')) {
      var lst = b.previousElementSibling;
      var open = b.getAttribute('aria-expanded') === 'true';
      lst.hidden = open;
      b.setAttribute('aria-expanded', open ? 'false' : 'true');
      b.textContent = open ? 'ещё ' + lst.children.length : 'свернуть';
      return;
    }
    if (b.classList.contains('gapbtn')) {
      var g = document.getElementById(b.getAttribute('aria-controls'));
      var o = b.getAttribute('aria-expanded') === 'true';
      g.hidden = o;
      b.setAttribute('aria-expanded', o ? 'false' : 'true');
      return;
    }
    if (b.classList.contains('ecell')) { toggleEpoch(b); return; }
    if (b.hasAttribute('data-back')) { goBack(); return; }
  });
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-back]');
    if (b && !main.contains(b)) goBack();
  });
  function toggleEpoch(btn) {
    var eid = btn.getAttribute('data-epoch');
    var panel = document.getElementById('ep-panel');
    var open = btn.getAttribute('aria-expanded') === 'true';
    Array.prototype.forEach.call(document.querySelectorAll('.ecell'), function (c) { c.setAttribute('aria-expanded', 'false'); });
    closeActs(null);
    if (open) { panel.hidden = true; return; }
    btn.setAttribute('aria-expanded', 'true');
    Array.prototype.forEach.call(panel.querySelectorAll('.ep-body'), function (b) { b.hidden = b.getAttribute('data-epoch') !== eid; });
    panel.hidden = false;
    if (window.matchMedia('(max-width: 599px)').matches) btn.closest('li').insertAdjacentElement('afterend', panel);
    else document.querySelector('.ecells').insertAdjacentElement('afterend', panel);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeActs(null);
    if (e.code === 'KeyH' && e.ctrlKey && e.altKey) { e.preventDefault(); toggleHost(); }
  });
  document.querySelector('[data-skip]').addEventListener('click', function (e) {
    e.preventDefault(); document.getElementById('q').focus();
  });

  // ── Панель ведущего
  var hostEl = document.querySelector('[data-host]');
  function toggleHost(show) {
    hostEl.hidden = show === undefined ? !hostEl.hidden : !show;
  }
  if (params.get('host') === '1') toggleHost(true);
  if (countEl) countEl.textContent = String(log.length);
  var partEl = hostEl.querySelector('[data-h-part]');
  partEl.value = LS.get('bn-part', '');
  partEl.addEventListener('change', function () { LS.set('bn-part', partEl.value.trim()); addLog('host', { action: 'участник', value: partEl.value.trim() }); });
  Array.prototype.forEach.call(hostEl.querySelectorAll('input[name=hv]'), function (r) {
    r.checked = r.value === variant;
    r.addEventListener('change', function () {
      addLog('host', { action: 'вариант', value: r.value });
      var u = location.pathname + '?v=' + r.value + (hostEl.hidden ? '' : '&host=1') + '#/';
      location.href = u;
    });
  });
  hostEl.querySelector('[data-h-theme]').value = LS.get('bn-theme', '');
  hostEl.querySelector('[data-h-theme]').addEventListener('change', function (e) { setTheme(e.target.value); addLog('host', { action: 'тема', value: e.target.value }); });
  Array.prototype.forEach.call(hostEl.querySelectorAll('[data-h-mark]'), function (b) {
    b.addEventListener('click', function () {
      addLog('task', { task: hostEl.querySelector('[data-h-task]').value, mark: b.getAttribute('data-h-mark') });
      b.blur();
    });
  });
  function toStart() {
    LS.del('bn-last');
    setLayer('simple', true);
    location.hash = '#/';
  }
  hostEl.querySelector('[data-h-home]').addEventListener('click', function () { addLog('host', { action: 'исходный экран' }); toStart(); });
  hostEl.querySelector('[data-h-reset]').addEventListener('click', function () {
    addLog('host', { action: 'новый участник' });
    LS.set('bn-part', ''); partEl.value = '';
    toStart();
  });
  hostEl.querySelector('[data-h-hide]').addEventListener('click', function () { toggleHost(false); });
  hostEl.querySelector('[data-h-dl]').addEventListener('click', function () {
    var stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    var who = (LS.get('bn-part', '') || 'uchastnik').replace(/[^\wА-Яа-яЁё-]+/g, '_');
    var blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), userAgent: navigator.userAgent, entries: log }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'zhurnal-eskiza-' + who + '-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  });
  hostEl.querySelector('[data-h-clear]').addEventListener('click', function () {
    if (!window.confirm('Удалить все записи журнала на этом устройстве? Сначала скачайте журнал.')) return;
    log = []; LS.set(LOGKEY, log); countEl.textContent = '0';
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
