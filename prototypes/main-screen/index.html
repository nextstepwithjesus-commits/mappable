    <ol class="places"><li><span class="gnum" aria-hidden="true">1</span><span class="gtxt"><span class="gname">Ур Халдейский</span> <span class="gwhat">— вышел оттуда с Фаррою</span></span><button type="button" class="ref" data-ref="Быт 11:31" aria-expanded="false">Быт 11:31</button></li><li><span class="gnum" aria-hidden="true">2</span><span class="gtxt"><span class="gname">Харран</span> <span class="gwhat">— остановились; вышел семидесяти пяти лет</span></span><button type="button" class="ref" data-ref="Быт 11:31; 12:4" aria-expanded="false">Быт 11:31; 12:4</button></li><li><span class="gnum" aria-hidden="true">3</span><span class="gtxt"><span class="gname">Сихем, дубрава Море</span> <span class="gwhat">— прошёл до этого места</span></span><button type="button" class="ref" data-ref="Быт 12:6" aria-expanded="false">Быт 12:6</button></li><li><span class="gnum" aria-hidden="true">4</span><span class="gtxt"><span class="gname">Гора между Вефилем и Гаем</span> <span class="gwhat">— шатёр и жертвенник</span></span><button type="button" class="ref" data-ref="Быт 12:8" aria-expanded="false">Быт 12:8</button></li><li><span class="gnum" aria-hidden="true">5</span><span class="gtxt"><span class="gname">Египет</span> <span class="gwhat">— пожил там во время голода</span></span><button type="button" class="ref" data-ref="Быт 12:10" aria-expanded="false">Быт 12:10</button></li><li><span class="gnum" aria-hidden="true">6</span><span class="gtxt"><span class="gname">Снова между Вефилем и Гаем</span> <span class="gwhat">— вернулся к жертвеннику</span></span><button type="button" class="ref" data-ref="Быт 13:3-4" aria-expanded="false">Быт 13:3–4</button></li><li><span class="gnum" aria-hidden="true">7</span><span class="gtxt"><span class="gname">Дубрава Мамре, что в Хевроне</span> <span class="gwhat">— поселился, жертвенник</span></span><button type="button" class="ref" data-ref="Быт 13:18" aria-expanded="false">Быт 13:18</button></li><li><span class="gnum" aria-hidden="true">8</span><span class="gtxt"><span class="gname">Дан</span> <span class="gwhat">— преследовал неприятелей</span></span><button type="button" class="ref" data-ref="Быт 14:14" aria-expanded="false">Быт 14:14</button></li><li><span class="gnum" aria-hidden="true">9</span><span class="gtxt"><span class="gname">Герар</span> <span class="gwhat">— был на время</span></span><button type="button" class="ref" data-ref="Быт 20:1" aria-expanded="false">Быт 20:1</button></li><li><span class="gnum" aria-hidden="true">10</span><span class="gtxt"><span class="gname">Вирсавия</span> <span class="gwhat">— насадил рощу; жил</span></span><button type="button" class="ref" data-ref="Быт 21:33; 22:19" aria-expanded="false">Быт 21:33; 22:19</button></li><li><span class="gnum" aria-hidden="true">11</span><span class="gtxt"><span class="gname">Земля Мориа</span> <span class="gwhat">— пошёл туда с Исааком</span></span><button type="button" class="ref" data-ref="Быт 22:2" aria-expanded="false">Быт 22:2</button></li><li><span class="gnum" aria-hidden="true">12</span><span class="gtxt"><span class="gname">Пещера Махпела против Мамре</span> <span class="gwhat">— похоронил Сарру; там погребён</span></span><button type="button" class="ref" data-ref="Быт 23:19; 25:9" aria-expanded="false">Быт 23:19; 25:9</button></li></ol>
  </section>
</div></div></template>
<template id="t-card-p-avraam"><div class="screen " data-title="Авраам — Карточка" data-subject="p-avraam" data-continue="Авраам — Карточка" data-tool="card"><nav class="toolbar" aria-label="Инструменты" data-pid="p-avraam" data-current="card"></nav><h1 class="scr-h" tabindex="-1">Авраам</h1><div class="card">
<p class="kind">человек</p>
<ul class="brief">
  <li class="fact "><span class="ft">По слову Господа вышел из Харрана в землю Ханаанскую</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:4-5" aria-expanded="false">Быт 12:4–5</button></span></li>
  <li class="fact "><span class="ft">Бог дал ему новое имя: Аврам стал Авраамом</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 17:5" aria-expanded="false">Быт 17:5</button></span></li>
  <li class="fact "><span class="ft">С него Матфей начинает родословие Иисуса Христа</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Мф 1:1-2" aria-expanded="false">Мф 1:1–2</button></span></li>
</ul>
<nav class="cardtools" aria-label="Инструменты для этого лица" data-pid="p-avraam"></nav>
<blockquote class="mainverse"><q class="cit">«Аврам поверил Господу, и Он вменил ему это в праведность»</q> <button type="button" class="ref" data-ref="Быт 15:6" aria-expanded="false">Быт 15:6</button></blockquote>
<table class="passport"><caption class="sr">Паспорт</caption>
  <tr><th scope="row">Отец</th><td>Фарра</td><td><a href="#s4">Родители (4)</a></td></tr>
  <tr><th scope="row">Время</th><td>эпоха «Патриархи»</td><td><a href="#s10">Время (10)</a></td></tr>
  <tr><th scope="row">Супруги</th><td>названы по имени 3</td><td><a href="#s7">Семья (7)</a></td></tr>
</table><div class="sections"><section class="csec" aria-labelledby="s1"><h2 id="s1"><span class="snum">1</span> Имена</h2><ul class="facts"><li class="fact "><span class="ft">Аврам — прежнее имя; новое дал Бог: <q class="cit">«не будешь ты больше называться Аврамом, но будет тебе имя: Авраам, ибо Я сделаю тебя отцом множества народов»</q> <button type="button" class="ref" data-ref="Быт 17:5" aria-expanded="false">Быт 17:5</button></span> </li><li class="fact "><span class="ft">Аврам Еврей</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 14:13" aria-expanded="false">Быт 14:13</button></span></li><li class="fact "><span class="ft">Друг Божий: <q class="cit">«семя Авраама, друга Моего»</q> <button type="button" class="ref" data-ref="Ис 41:8" aria-expanded="false">Ис 41:8</button>; <q class="cit">«и он наречен другом Божиим»</q> <button type="button" class="ref" data-ref="Иак 2:23" aria-expanded="false">Иак 2:23</button></span> </li></ul></section><section class="csec" aria-labelledby="s3"><h2 id="s3"><span class="snum">3</span> Кто это</h2><ul class="facts"><li class="fact "><span class="ft">Праотец Израиля: <q class="cit">«Авраам, отец наш»</q> <button type="button" class="ref" data-ref="Рим 4:1" aria-expanded="false">Рим 4:1</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Ис 51:2" aria-expanded="false">Ис 51:2</button><span class="sep">; </span><button type="button" class="ref" data-ref="Лк 1:73" aria-expanded="false">Лк 1:73</button><span class="sep">; </span><button type="button" class="ref" data-ref="Ин 8:39" aria-expanded="false">Ин 8:39</button><span class="sep">; </span><button type="button" class="ref" data-ref="Рим 4:1" aria-expanded="false">Рим 4:1</button></span></li><li class="fact "><span class="ft">Назван патриархом</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Евр 7:4" aria-expanded="false">Евр 7:4</button></span></li><li class="fact "><span class="ft">Очень богат скотом, серебром и золотом, рабами и рабынями</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 13:2" aria-expanded="false">Быт 13:2</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 24:35" aria-expanded="false">Быт 24:35</button></span></li><li class="fact "><span class="ft">Сыны Хета называли его <q class="cit">«князь Божий посреди нас»</q> <button type="button" class="ref" data-ref="Быт 23:6" aria-expanded="false">Быт 23:6</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 23:6" aria-expanded="false">Быт 23:6</button></span></li></ul></section><section class="csec" aria-labelledby="s4"><h2 id="s4"><span class="snum">4</span> Родители</h2><ul class="facts"><li class="fact "><span class="ft">Отец — <a href="#/stub/%D0%9A%D0%B0%D1%80%D1%82%D0%BE%D1%87%D0%BA%D0%B0%20%E2%80%94%20%D0%A4%D0%B0%D1%80%D1%80%D0%B0">Фарра</a></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 11:26-27" aria-expanded="false">Быт 11:26–27</button></span></li><li class="fact "><span class="ft">Мать текст не называет</span> </li></ul></section><section class="csec" aria-labelledby="s5"><h2 id="s5"><span class="snum">5</span> Род и колено</h2><ul class="facts"><li class="fact "><span class="ft">Потомок Сима: Сим — Арфаксад — Сала — Евер — Фалек — Рагав — Серух — Нахор — Фарра — Аврам; у Луки между Арфаксадом и Салой назван ещё Каинан</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 11:10-26" aria-expanded="false">Быт 11:10–26</button><span class="sep">; </span><button type="button" class="ref" data-ref="1Пар 1:24-27" aria-expanded="false">1 Пар 1:24–27</button><span class="sep">; </span><button type="button" class="ref" data-ref="Лк 3:34-36" aria-expanded="false">Лк 3:34–36</button></span></li><li class="fact "><span class="ft">Отцы его жили <q class="cit">«за рекою»</q> <button type="button" class="ref" data-ref="Нав 24:2" aria-expanded="false">Нав 24:2</button> и <q class="cit">«служили иным богам»</q> <button type="button" class="ref" data-ref="Нав 24:2" aria-expanded="false">Нав 24:2</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Нав 24:2" aria-expanded="false">Нав 24:2</button></span></li></ul></section><section class="csec" aria-labelledby="s6"><h2 id="s6"><span class="snum">6</span> Рождение</h2><ul class="facts"><li class="fact "><span class="ft">Место рождения выводится из сопоставления стихов: Аран умер <q class="cit">«в земле рождения своего, в Уре Халдейском»</q> <button type="button" class="ref" data-ref="Быт 11:28" aria-expanded="false">Быт 11:28</button>; Бог вывел Аврама <q class="cit">«из Ура Халдейского»</q> <button type="button" class="ref" data-ref="Быт 15:7" aria-expanded="false">Быт 15:7</button>, <q class="cit">«из земли рождения»</q> <button type="button" class="ref" data-ref="Быт 24:7" aria-expanded="false">Быт 24:7</button> его</span> <span class="cert simple">так следует из сравнения стихов</span><abbr class="cert study" title="вывод: следует из сравнения стихов">выв.</abbr><span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 11:28" aria-expanded="false">Быт 11:28</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 15:7" aria-expanded="false">Быт 15:7</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 24:7" aria-expanded="false">Быт 24:7</button></span></li></ul></section><section class="csec" aria-labelledby="s7"><h2 id="s7"><span class="snum">7</span> Семья</h2><ul class="facts"><li class="fact "><span class="ft">Сарра — жена; сын Исаак</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 23:19" aria-expanded="false">Быт 23:19</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 21:2-3" aria-expanded="false">Быт 21:2–3</button></span></li><li class="fact "><span class="ft">Агарь, служанка Сарры, которую дали в жену; сын Измаил</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 16:3" aria-expanded="false">Быт 16:3</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 16:15" aria-expanded="false">Быт 16:15</button></span></li><li class="fact "><span class="ft">Хеттура — «жена»; в 1 Пар 1:32 — «наложница»; сыновья Зимран, Иокшан, Медан, Мадиан, Ишбак и Шуах</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 25:1-2" aria-expanded="false">Быт 25:1–2</button><span class="sep">; </span><button type="button" class="ref" data-ref="1Пар 1:32" aria-expanded="false">1 Пар 1:32</button></span></li><li class="fact "><span class="ft">Ещё наложницы — по имени не названы</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 25:6" aria-expanded="false">Быт 25:6</button></span></li></ul><p><a class="btn" href="#/gen/p-avraam">Открыть семью</a></p></section><section class="csec" aria-labelledby="s8"><h2 id="s8"><span class="snum">8</span> Братья и сёстры</h2><ul class="facts"><li class="fact "><span class="ft">Братья — Нахор и Аран; Аран умер ещё при жизни Фарры в Уре Халдейском</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 11:27-28" aria-expanded="false">Быт 11:27–28</button></span></li><li class="fact "><span class="ft">Сарра — по его словам: <q class="cit">«она дочь отца моего, только не дочь матери моей»</q></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 20:12" aria-expanded="false">Быт 20:12</button></span></li></ul></section><section class="csec" aria-labelledby="s9"><h2 id="s9"><span class="snum">9</span> Иное родство</h2><ul class="facts"><li class="fact "><span class="ft">Лот назван так: <q class="cit">«Лота, сына брата своего»</q> <button type="button" class="ref" data-ref="Быт 12:5" aria-expanded="false">Быт 12:5</button>, <q class="cit">«Лота, племянника Аврамова»</q> <button type="button" class="ref" data-ref="Быт 14:12" aria-expanded="false">Быт 14:12</button>, <q class="cit">«Лота, сродника своего»</q> <button type="button" class="ref" data-ref="Быт 14:16" aria-expanded="false">Быт 14:16</button>; Авраам говорит ему: <q class="cit">«мы родственники»</q> <button type="button" class="ref" data-ref="Быт 13:8" aria-expanded="false">Быт 13:8</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:5" aria-expanded="false">Быт 12:5</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 13:8" aria-expanded="false">Быт 13:8</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 14:12" aria-expanded="false">Быт 14:12</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 14:16" aria-expanded="false">Быт 14:16</button></span></li><li class="fact "><span class="ft">Ревекку, внучку брата Нахора, раб Авраама называет так: <q class="cit">«дочь брата господина моего»</q> <button type="button" class="ref" data-ref="Быт 24:48" aria-expanded="false">Быт 24:48</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 24:15" aria-expanded="false">Быт 24:15</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 24:48" aria-expanded="false">Быт 24:48</button></span></li></ul></section><section class="csec" aria-labelledby="s10"><h2 id="s10"><span class="snum">10</span> Время</h2><ul class="facts"><li class="fact "><span class="ft"><q class="cit">«Аврам был семидесяти пяти лет, когда вышел из Харрана»</q> <button type="button" class="ref" data-ref="Быт 12:4" aria-expanded="false">Быт 12:4</button></span> </li><li class="fact "><span class="ft"><q class="cit">«Авраам был ста лет, когда родился у него Исаак, сын его»</q> <button type="button" class="ref" data-ref="Быт 21:5" aria-expanded="false">Быт 21:5</button></span> </li><li class="fact "><span class="ft"><q class="cit">«Дней жизни Авраамовой, которые он прожил, было сто семьдесят пять лет»</q> <button type="button" class="ref" data-ref="Быт 25:7" aria-expanded="false">Быт 25:7</button></span> </li><li class="fact "><span class="ft">Эпоха «Патриархи»</span> <span class="cert simple">так следует из сравнения стихов</span><abbr class="cert study" title="вывод: следует из сравнения стихов">выв.</abbr><span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:4" aria-expanded="false">Быт 12:4</button></span></li><li class="fact study">Около 2166–1991 гг. до Р. Х. <span class="cert simple">год примерный, расчёт атласа</span><abbr class="cert study" title="расчёт по модели атласа">расч.</abbr> модель «масоретская, длинное пребывание»</li><li class="fact "><span class="ft">Прожил в Ханаане 10 лет до брака с Агарью: 75 + 10 = 85 лет</span> <span class="cert simple">так следует из сравнения стихов</span><abbr class="cert study" title="вывод: следует из сравнения стихов">выв.</abbr><span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:4" aria-expanded="false">Быт 12:4</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 16:3" aria-expanded="false">Быт 16:3</button></span></li><li class="fact "><span class="ft">Пережил Сарру на 38 лет: ей было 127 лет, и она была на 10 лет моложе его</span> <span class="cert simple">так следует из сравнения стихов</span><abbr class="cert study" title="вывод: следует из сравнения стихов">выв.</abbr><span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 17:17" aria-expanded="false">Быт 17:17</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 23:1" aria-expanded="false">Быт 23:1</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 25:7" aria-expanded="false">Быт 25:7</button></span></li><li class="fact "><span class="ft">Умер, когда Исааку было 75 лет, а Исаву и Иакову — 15</span> <span class="cert simple">так следует из сравнения стихов</span><abbr class="cert study" title="вывод: следует из сравнения стихов">выв.</abbr><span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 21:5" aria-expanded="false">Быт 21:5</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 25:7" aria-expanded="false">Быт 25:7</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 25:26" aria-expanded="false">Быт 25:26</button></span></li></ul><p><a class="btn" href="#/time/p-avraam">Время</a></p></section><section class="csec" aria-labelledby="s11"><h2 id="s11"><span class="snum">11</span> Встречи и связи</h2><ul class="facts"><li class="fact "><span class="ft">Лот — странствовал с Лотом, разделился с ним, освободил его из плена</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:4-5" aria-expanded="false">Быт 12:4–5</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 13:8-11" aria-expanded="false">Быт 13:8–11</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 14:12-16" aria-expanded="false">Быт 14:12–16</button></span></li><li class="fact "><span class="ft">Мелхиседек — принял хлеб, вино и благословение, дал десятину</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 14:18-20" aria-expanded="false">Быт 14:18–20</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 7:1" aria-expanded="false">Евр 7:1</button></span></li><li class="fact "><span class="ft">Мамрий — союзники Аврама Мамрий, Эшкол и Анер ходили с ним против царей</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 14:13" aria-expanded="false">Быт 14:13</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 14:24" aria-expanded="false">Быт 14:24</button></span></li><li class="fact "><span class="ft">Ефрон — купил у Ефрона поле с пещерой Махпела</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 23:10-16" aria-expanded="false">Быт 23:10–16</button></span></li><li class="fact "><span class="ft">Елиезер — распорядитель в его доме</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 15:2" aria-expanded="false">Быт 15:2</button></span></li></ul></section><section class="csec" aria-labelledby="s12"><h2 id="s12"><span class="snum">12</span> Места</h2><ul class="facts"><li class="fact "><span class="ft">Харран</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 11:31" aria-expanded="false">Быт 11:31</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 12:4-5" aria-expanded="false">Быт 12:4–5</button><span class="sep">; </span><button type="button" class="ref" data-ref="Деян 7:4" aria-expanded="false">Деян 7:4</button></span></li><li class="fact "><span class="ft">Сихем, дубрава Море</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:6-7" aria-expanded="false">Быт 12:6–7</button></span></li><li class="fact "><span class="ft">Гора между Вефилем и Гаем</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:8" aria-expanded="false">Быт 12:8</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 13:3-4" aria-expanded="false">Быт 13:3–4</button></span></li><li class="fact "><span class="ft">Египет</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:10" aria-expanded="false">Быт 12:10</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 13:1" aria-expanded="false">Быт 13:1</button></span></li><li class="fact "><span class="ft">Дубрава Мамре в Хевроне</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 13:18" aria-expanded="false">Быт 13:18</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 14:13" aria-expanded="false">Быт 14:13</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 18:1" aria-expanded="false">Быт 18:1</button></span></li><li class="fact "><span class="ft">Дан и Хова близ Дамаска</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 14:14-15" aria-expanded="false">Быт 14:14–15</button></span></li><li class="fact "><span class="ft">Долина Шаве, «долина царская»</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 14:17" aria-expanded="false">Быт 14:17</button></span></li><li class="fact "><span class="ft">Между Кадесом и Суром; Герар</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 20:1" aria-expanded="false">Быт 20:1</button></span></li></ul><ul class="facts more-list" hidden><li class="fact "><span class="ft">Вирсавия</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 21:31-33" aria-expanded="false">Быт 21:31–33</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 22:19" aria-expanded="false">Быт 22:19</button></span></li><li class="fact "><span class="ft">Земля Филистимская</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 21:34" aria-expanded="false">Быт 21:34</button></span></li><li class="fact "><span class="ft">Гора в земле Мориа, Иегова-ире</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 22:2" aria-expanded="false">Быт 22:2</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 22:14" aria-expanded="false">Быт 22:14</button></span></li></ul><button type="button" class="morebtn" aria-expanded="false">ещё 3</button><p><a class="btn" href="#/geo/p-avraam">География</a></p></section><section class="csec" aria-labelledby="s13"><h2 id="s13"><span class="snum">13</span> Служение</h2><ul class="facts"><li class="fact "><span class="ft">Пророк — так назвал его Бог</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 20:7" aria-expanded="false">Быт 20:7</button></span></li></ul></section><section class="csec" aria-labelledby="s14"><h2 id="s14"><span class="snum">14</span> По порядку</h2><ul class="facts"><li class="fact "><span class="ft">С отцом Фаррою, Лотом и Сарою вышел из Ура Халдейского в землю Ханаанскую; дойдя до Харрана, остановились там</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 11:31" aria-expanded="false">Быт 11:31</button><span class="sep">; </span><button type="button" class="ref" data-ref="Деян 7:4" aria-expanded="false">Деян 7:4</button></span></li><li class="fact "><span class="ft">По слову Господа вышел из Харрана с Сарою, Лотом, имением и людьми и пришёл в землю Ханаанскую</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:4-5" aria-expanded="false">Быт 12:4–5</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 11:8" aria-expanded="false">Евр 11:8</button></span></li><li class="fact "><span class="ft">Создал жертвенники Господу у Сихема и между Вефилем и Гаем и призвал имя Господа; продолжал идти к югу</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:7-9" aria-expanded="false">Быт 12:7–9</button></span></li><li class="fact "><span class="ft">Из-за голода сошёл в Египет; назвал Сару сестрой, её взяли в дом фараона; Господь поразил фараона, и тот отпустил Аврама с женою и имением</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:10-20" aria-expanded="false">Быт 12:10–20</button></span></li><li class="fact "><span class="ft">Вернулся из Египта очень богатым к месту первого жертвенника между Вефилем и Гаем</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 13:1-4" aria-expanded="false">Быт 13:1–4</button></span></li><li class="fact "><span class="ft">Из-за спора пастухов предложил Лоту разделиться; Лот избрал окрестность Иорданскую</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 13:5-12" aria-expanded="false">Быт 13:5–12</button></span></li><li class="fact "><span class="ft">Поселился у дубравы Мамре в Хевроне и создал там жертвенник</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 13:18" aria-expanded="false">Быт 13:18</button></span></li><li class="fact "><span class="ft">Узнав о пленении Лота, вооружил 318 рабов, рождённых в его доме, ночью разбил Кедорлаомера и союзных царей и вернул Лота, имущество и людей</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 14:12-16" aria-expanded="false">Быт 14:12–16</button></span></li></ul><ul class="facts more-list" hidden><li class="fact "><span class="ft">Принял благословение Мелхиседека, царя Салимского, и дал ему десятую часть из всего</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 14:18-20" aria-expanded="false">Быт 14:18–20</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 7:1-2" aria-expanded="false">Евр 7:1–2</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 7:4" aria-expanded="false">Евр 7:4</button></span></li><li class="fact "><span class="ft">Отказался взять из добычи царя Содомского <q class="cit">«даже нитки и ремня от обуви»</q> <button type="button" class="ref" data-ref="Быт 14:21-24" aria-expanded="false">Быт 14:21–24</button>, оставив долю союзникам</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 14:21-24" aria-expanded="false">Быт 14:21–24</button></span></li><li class="fact "><span class="ft">По совету Сары взял в жену её служанку Агарь; Агарь зачала и стала презирать госпожу</span> <span class="cert simple">так следует из сравнения стихов</span><abbr class="cert study" title="вывод: следует из сравнения стихов">выв.</abbr><span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 16:1-6" aria-expanded="false">Быт 16:1–6</button></span></li><li class="fact "><span class="ft">Агарь родила ему Измаила; Аврам нарёк сыну имя</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 16:15-16" aria-expanded="false">Быт 16:15–16</button></span></li><li class="fact "><span class="ft">В тот же день, как сказал ему Бог, обрезал себя, Измаила и весь мужской пол своего дома</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 17:23-27" aria-expanded="false">Быт 17:23–27</button></span></li><li class="fact "><span class="ft">Принял у дубравы Мамре трёх мужей: угостил их хлебами и телёнком и проводил к Содому</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 18:1-8" aria-expanded="false">Быт 18:1–8</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 18:16" aria-expanded="false">Быт 18:16</button></span></li><li class="fact "><span class="ft">Утром увидел дым над Содомом и Гоморрою; Бог, вспомнив об Аврааме, вывел Лота из среды истребления</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 19:27-29" aria-expanded="false">Быт 19:27–29</button></span></li><li class="fact "><span class="ft">В Гераре снова назвал Сарру сестрой; Авимелех, царь Герарский, взял её, но по слову Бога возвратил с дарами</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 20:1-16" aria-expanded="false">Быт 20:1–16</button></span></li><li class="fact "><span class="ft">Сарра родила ему Исаака; Авраам нарёк ему имя и обрезал его в восьмой день</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 21:2-5" aria-expanded="false">Быт 21:2–5</button></span></li><li class="fact "><span class="ft">Сделал большой пир в день, когда Исаак был отнят от груди</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 21:8" aria-expanded="false">Быт 21:8</button></span></li><li class="fact "><span class="ft">По требованию Сарры и слову Бога отпустил Агарь с Измаилом, дав им хлеба и мех воды</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 21:9-14" aria-expanded="false">Быт 21:9–14</button></span></li><li class="fact "><span class="ft">Заключил союз с Авимелехом о колодезе; место названо Вирсавией; насадил рощу и призвал имя Господа, Бога вечного</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 21:22-33" aria-expanded="false">Быт 21:22–33</button></span></li><li class="fact "><span class="ft">По повелению Бога повёл Исаака в землю Мориа, связал его и положил на жертвенник; Ангел Господень остановил его, и он принёс во всесожжение вместо сына овна, запутавшегося в чаще рогами; назвал место <q class="cit">«Иегова-ире»</q> <button type="button" class="ref" data-ref="Быт 22:1-14" aria-expanded="false">Быт 22:1–14</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 22:1-14" aria-expanded="false">Быт 22:1–14</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 11:17-19" aria-expanded="false">Евр 11:17–19</button><span class="sep">; </span><button type="button" class="ref" data-ref="Иак 2:21" aria-expanded="false">Иак 2:21</button></span></li><li class="fact "><span class="ft">Узнал, что Милка родила Нахору сыновей и что от Вафуила родилась Ревекка</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 22:20-23" aria-expanded="false">Быт 22:20–23</button></span></li><li class="fact "><span class="ft">Оплакал Сарру, купил у Ефрона Хеттеянина поле с пещерой Махпела за 400 сиклей серебра и похоронил её там</span> <span class="cert simple">так следует из сравнения стихов</span><abbr class="cert study" title="вывод: следует из сравнения стихов">выв.</abbr><span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 23:2-20" aria-expanded="false">Быт 23:2–20</button></span></li><li class="fact "><span class="ft">Взял с раба, старшего в доме, клятву взять Исааку жену не из дочерей Хананеев, а из его родни</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 24:1-9" aria-expanded="false">Быт 24:1–9</button></span></li><li class="fact "><span class="ft">Взял ещё жену — Хеттуру; она родила ему шестерых сыновей</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 25:1-2" aria-expanded="false">Быт 25:1–2</button></span></li><li class="fact "><span class="ft">Всё имение отдал Исааку, а сынов наложниц при жизни одарил и отослал на восток</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 25:5-6" aria-expanded="false">Быт 25:5–6</button></span></li></ul><button type="button" class="morebtn" aria-expanded="false">ещё 18</button></section><section class="csec" aria-labelledby="s15"><h2 id="s15"><span class="snum">15</span> Слова</h2><ul class="facts"><li class="fact"><span class="ft"><q class="cit">«Бог усмотрит Себе агнца для всесожжения, сын мой»</q> <span class="ctx">ответ Исааку по пути на гору</span></span> <span class="refs"><button type="button" class="ref" data-ref="Быт 22:8" aria-expanded="false">Быт 22:8</button></span></li><li class="fact"><span class="ft"><q class="cit">«я и сын пойдем туда и поклонимся, и возвратимся к вам»</q> <span class="ctx">отрокам у горы в земле Мориа</span></span> <span class="refs"><button type="button" class="ref" data-ref="Быт 22:5" aria-expanded="false">Быт 22:5</button></span></li><li class="fact"><span class="ft"><q class="cit">«Судия всей земли поступит ли неправосудно?»</q> <span class="ctx">ходатайство за Содом</span></span> <span class="refs"><button type="button" class="ref" data-ref="Быт 18:25" aria-expanded="false">Быт 18:25</button></span></li><li class="fact"><span class="ft"><q class="cit">«вот, я решился говорить Владыке, я, прах и пепел»</q> <span class="ctx">ходатайство за Содом</span></span> <span class="refs"><button type="button" class="ref" data-ref="Быт 18:27" aria-expanded="false">Быт 18:27</button></span></li><li class="fact"><span class="ft"><q class="cit">«да не будет раздора между мною и тобою, и между пастухами моими и пастухами твоими, ибо мы родственники»</q> <span class="ctx">Лоту</span></span> <span class="refs"><button type="button" class="ref" data-ref="Быт 13:8" aria-expanded="false">Быт 13:8</button></span></li><li class="fact"><span class="ft"><q class="cit">«я у вас пришлец и поселенец»</q> <span class="ctx">сынам Хета, прося места для погребения Сарры</span></span> <span class="refs"><button type="button" class="ref" data-ref="Быт 23:4" aria-expanded="false">Быт 23:4</button></span></li></ul></section><section class="csec" aria-labelledby="s16"><h2 id="s16"><span class="snum">16</span> Перед Богом</h2><ul class="facts"><li class="fact "><span class="ft"><q class="cit">«Бог славы явился отцу нашему Аврааму в Месопотамии, прежде переселения его в Харран»</q> <button type="button" class="ref" data-ref="Деян 7:2-3" aria-expanded="false">Деян 7:2–3</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Деян 7:2-3" aria-expanded="false">Деян 7:2–3</button></span></li><li class="fact "><span class="ft">Призвание и обетование: <q class="cit">«пойди из земли твоей… и Я произведу от тебя великий народ… и благословятся в тебе все племена земные»</q> <button type="button" class="ref" data-ref="Быт 12:1-3" aria-expanded="false">Быт 12:1–3</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:1-3" aria-expanded="false">Быт 12:1–3</button><span class="sep">; </span><button type="button" class="ref" data-ref="Гал 3:8" aria-expanded="false">Гал 3:8</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 11:8" aria-expanded="false">Евр 11:8</button></span></li><li class="fact "><span class="ft">Явление у Сихема: <q class="cit">«потомству твоему отдам Я землю сию»</q> <button type="button" class="ref" data-ref="Быт 12:7" aria-expanded="false">Быт 12:7</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 12:7" aria-expanded="false">Быт 12:7</button></span></li><li class="fact "><span class="ft">После разлуки с Лотом — обетование всей видимой земли навеки и потомства, <q class="cit">«как песок земной»</q> <button type="button" class="ref" data-ref="Быт 13:14-17" aria-expanded="false">Быт 13:14–17</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 13:14-17" aria-expanded="false">Быт 13:14–17</button></span></li><li class="fact "><span class="ft">Видение: <q class="cit">«не бойся, Аврам; Я твой щит»</q> <button type="button" class="ref" data-ref="Быт 15:1-5" aria-expanded="false">Быт 15:1–5</button>; наследником будет тот, <q class="cit">«кто произойдет из чресл твоих»</q> <button type="button" class="ref" data-ref="Быт 15:1-5" aria-expanded="false">Быт 15:1–5</button>; потомков будет, как звёзд</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 15:1-5" aria-expanded="false">Быт 15:1–5</button></span></li><li class="fact "><span class="ft"><q class="cit">«Аврам поверил Господу, и Он вменил ему это в праведность»</q> <button type="button" class="ref" data-ref="Быт 15:6" aria-expanded="false">Быт 15:6</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 15:6" aria-expanded="false">Быт 15:6</button><span class="sep">; </span><button type="button" class="ref" data-ref="Рим 4:3" aria-expanded="false">Рим 4:3</button><span class="sep">; </span><button type="button" class="ref" data-ref="Гал 3:6" aria-expanded="false">Гал 3:6</button><span class="sep">; </span><button type="button" class="ref" data-ref="Иак 2:23" aria-expanded="false">Иак 2:23</button></span></li><li class="fact "><span class="ft">Завет между рассечёнными животными: пророчество о 400 годах порабощения потомков, о выходе их <q class="cit">«с большим имуществом»</q> <button type="button" class="ref" data-ref="Быт 15:7-21" aria-expanded="false">Быт 15:7–21</button> и возвращении <q class="cit">«в четвертом роде»</q> <button type="button" class="ref" data-ref="Быт 15:7-21" aria-expanded="false">Быт 15:7–21</button>; земля от реки Египетской до Евфрата</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 15:7-21" aria-expanded="false">Быт 15:7–21</button><span class="sep">; </span><button type="button" class="ref" data-ref="Деян 7:6-7" aria-expanded="false">Деян 7:6–7</button></span></li><li class="fact "><span class="ft">В 99 лет: <q class="cit">«Я Бог Всемогущий; ходи предо Мною и будь непорочен»</q> <button type="button" class="ref" data-ref="Быт 17:1-21" aria-expanded="false">Быт 17:1–21</button>; завет вечный, новое имя, обрезание как знамение завета, обетование сына от Сарры</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 17:1-21" aria-expanded="false">Быт 17:1–21</button></span></li></ul><ul class="facts more-list" hidden><li class="fact "><span class="ft">Знак обрезания получил <q class="cit">«как печать праведности через веру, которую имел в необрезании»</q> <button type="button" class="ref" data-ref="Рим 4:9-12" aria-expanded="false">Рим 4:9–12</button>, и стал отцом всех верующих</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Рим 4:9-12" aria-expanded="false">Рим 4:9–12</button><span class="sep">; </span><button type="button" class="ref" data-ref="Рим 4:16-22" aria-expanded="false">Рим 4:16–22</button></span></li><li class="fact "><span class="ft">Господь явился у дубравы Мамре и обещал: <q class="cit">«будет сын у Сарры»</q> <button type="button" class="ref" data-ref="Быт 18:10-14" aria-expanded="false">Быт 18:10–14</button>; <q class="cit">«Есть ли что трудное для Господа?»</q> <button type="button" class="ref" data-ref="Быт 18:10-14" aria-expanded="false">Быт 18:10–14</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 18:1" aria-expanded="false">Быт 18:1</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 18:10-14" aria-expanded="false">Быт 18:10–14</button></span></li><li class="fact "><span class="ft"><q class="cit">«Я избрал его для того, чтобы он заповедал сынам своим и дому своему после себя, ходить путем Господним»</q> <button type="button" class="ref" data-ref="Быт 18:17-19" aria-expanded="false">Быт 18:17–19</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 18:17-19" aria-expanded="false">Быт 18:17–19</button></span></li><li class="fact "><span class="ft">Ходатайствовал за Содом — от пятидесяти до десяти праведников</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 18:22-33" aria-expanded="false">Быт 18:22–33</button></span></li><li class="fact "><span class="ft">По его молитве Бог исцелил Авимелеха, его жену и рабынь</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 20:17" aria-expanded="false">Быт 20:17</button></span></li><li class="fact "><span class="ft">Бог велел ему слушаться Сарры: <q class="cit">«в Исааке наречется тебе семя»</q> <button type="button" class="ref" data-ref="Быт 21:12" aria-expanded="false">Быт 21:12</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 21:12" aria-expanded="false">Быт 21:12</button><span class="sep">; </span><button type="button" class="ref" data-ref="Рим 9:7" aria-expanded="false">Рим 9:7</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 11:18" aria-expanded="false">Евр 11:18</button></span></li><li class="fact "><span class="ft">Бог искушал Авраама повелением принести Исаака; после испытания Господь клялся Самим Собою: <q class="cit">«благословятся в семени твоем все народы земли за то, что ты послушался гласа Моего»</q> <button type="button" class="ref" data-ref="Быт 22:15-18" aria-expanded="false">Быт 22:15–18</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 22:1-2" aria-expanded="false">Быт 22:1–2</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 22:15-18" aria-expanded="false">Быт 22:15–18</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 6:13-15" aria-expanded="false">Евр 6:13–15</button></span></li><li class="fact "><span class="ft"><q class="cit">«Вера содействовала делам его, и делами вера достигла совершенства»</q> <button type="button" class="ref" data-ref="Иак 2:21-22" aria-expanded="false">Иак 2:21–22</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Иак 2:21-22" aria-expanded="false">Иак 2:21–22</button></span></li><li class="fact "><span class="ft"><q class="cit">«Господь благословил Авраама всем»</q> <button type="button" class="ref" data-ref="Быт 24:1" aria-expanded="false">Быт 24:1</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 24:1" aria-expanded="false">Быт 24:1</button></span></li><li class="fact "><span class="ft">Бог говорит Исааку: Авраам <q class="cit">«послушался гласа Моего и соблюдал… повеления Мои, уставы Мои и законы Мои»</q> <button type="button" class="ref" data-ref="Быт 26:5" aria-expanded="false">Быт 26:5</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 26:5" aria-expanded="false">Быт 26:5</button></span></li><li class="fact "><span class="ft">Верою жил на земле обетованной, как на чужой, в шатрах, ожидая города, <q class="cit">«которого художник и строитель Бог»</q> <button type="button" class="ref" data-ref="Евр 11:9-10" aria-expanded="false">Евр 11:9–10</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Евр 11:9-10" aria-expanded="false">Евр 11:9–10</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 11:13-16" aria-expanded="false">Евр 11:13–16</button></span></li></ul><button type="button" class="morebtn" aria-expanded="false">ещё 11</button></section><section class="csec" aria-labelledby="s17"><h2 id="s17"><span class="snum">17</span> Смерть и погребение</h2><ul class="facts"><li class="fact "><span class="ft">Прожил 175 лет; скончался Авраам, и умер в старости доброй, престарелый и насыщенный, и приложился к народу своему — как было обещано: <q class="cit">«будешь погребен в старости доброй»</q> <button type="button" class="ref" data-ref="Быт 15:15" aria-expanded="false">Быт 15:15</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 25:7-8" aria-expanded="false">Быт 25:7–8</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 15:15" aria-expanded="false">Быт 15:15</button></span></li><li class="fact "><span class="ft">Погребён сыновьями Исааком и Измаилом в пещере Махпеле, на поле Ефрона, сына Цохара, против Мамре, рядом с Саррой</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 25:9-10" aria-expanded="false">Быт 25:9–10</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 49:29-31" aria-expanded="false">Быт 49:29–31</button></span></li></ul></section><section class="csec" aria-labelledby="s18"><h2 id="s18"><span class="snum">18</span> В родословии Иисуса Христа</h2><ul class="facts"><li class="fact "><span class="ft">Матфей начинает родословие с него: <q class="cit">«Родословие Иисуса Христа, Сына Давидова, Сына Авраамова»</q> <button type="button" class="ref" data-ref="Мф 1:1-2" aria-expanded="false">Мф 1:1–2</button>; <q class="cit">«от Авраама до Давида четырнадцать родов»</q> <button type="button" class="ref" data-ref="Мф 1:17" aria-expanded="false">Мф 1:17</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Мф 1:1-2" aria-expanded="false">Мф 1:1–2</button><span class="sep">; </span><button type="button" class="ref" data-ref="Мф 1:17" aria-expanded="false">Мф 1:17</button></span></li><li class="fact "><span class="ft">Обетование <q class="cit">«и семени твоему»</q> <button type="button" class="ref" data-ref="Гал 3:16" aria-expanded="false">Гал 3:16</button> Павел относит ко Христу: <q class="cit">«как об одном: и семени твоему, которое есть Христос»</q> <button type="button" class="ref" data-ref="Гал 3:16" aria-expanded="false">Гал 3:16</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Гал 3:16" aria-expanded="false">Гал 3:16</button></span></li><li class="fact "><span class="ft"><q class="cit">«Авраам, отец ваш, рад был увидеть день Мой; и увидел и возрадовался»</q> <button type="button" class="ref" data-ref="Ин 8:56" aria-expanded="false">Ин 8:56</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Ин 8:56" aria-expanded="false">Ин 8:56</button></span></li><li class="fact study">У Матфея — 1-й в первой четырнадцатке, у Луки — 55-й от Иосифа (по счёту атласа) <span class="refs"><button type="button" class="ref" data-ref="Мф 1:2" aria-expanded="false">Мф 1:2</button><span class="sep">; </span><button type="button" class="ref" data-ref="Лк 3:34" aria-expanded="false">Лк 3:34</button></span></li></ul></section><section class="csec" aria-labelledby="s19"><h2 id="s19"><span class="snum">19</span> В других книгах</h2><ul class="facts"><li class="fact "><span class="ft">Бог называет Себя: <q class="cit">«Бог Авраама, Бог Исаака и Бог Иакова»</q> <button type="button" class="ref" data-ref="Исх 3:6" aria-expanded="false">Исх 3:6</button> — и помнит завет с ними</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Исх 2:24" aria-expanded="false">Исх 2:24</button><span class="sep">; </span><button type="button" class="ref" data-ref="Исх 3:6" aria-expanded="false">Исх 3:6</button><span class="sep">; </span><button type="button" class="ref" data-ref="Исх 3:15" aria-expanded="false">Исх 3:15</button><span class="sep">; </span><button type="button" class="ref" data-ref="Мф 22:32" aria-expanded="false">Мф 22:32</button><span class="sep">; </span><button type="button" class="ref" data-ref="Деян 3:13" aria-expanded="false">Деян 3:13</button></span></li><li class="fact "><span class="ft">Иисус Навин: Бог взял Авраама <q class="cit">«из-за реки»</q> <button type="button" class="ref" data-ref="Нав 24:3" aria-expanded="false">Нав 24:3</button>, водил по Ханаану и дал ему Исаака</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Нав 24:3" aria-expanded="false">Нав 24:3</button></span></li><li class="fact "><span class="ft">Неемия: Бог избрал Аврама, вывел из Ура Халдейского, дал ему имя Авраама и нашёл сердце его верным</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Неем 9:7-8" aria-expanded="false">Неем 9:7–8</button></span></li><li class="fact "><span class="ft">Исаия: <q class="cit">«Посмотрите на Авраама, отца вашего, и на Сарру, родившую вас»</q> <button type="button" class="ref" data-ref="Ис 51:2" aria-expanded="false">Ис 51:2</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Ис 51:2" aria-expanded="false">Ис 51:2</button></span></li><li class="fact "><span class="ft">Иезекииль передаёт слова живущих в опустошённой земле: <q class="cit">«Авраам был один, и получил во владение землю сию»</q> <button type="button" class="ref" data-ref="Иез 33:24" aria-expanded="false">Иез 33:24</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Иез 33:24" aria-expanded="false">Иез 33:24</button></span></li><li class="fact "><span class="ft">Иоанн Креститель: <q class="cit">«Бог может из камней сих воздвигнуть детей Аврааму»</q> <button type="button" class="ref" data-ref="Мф 3:9" aria-expanded="false">Мф 3:9</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Мф 3:9" aria-expanded="false">Мф 3:9</button></span></li><li class="fact "><span class="ft">Иисус: многие <q class="cit">«возлягут с Авраамом, Исааком и Иаковом в Царстве Небесном»</q> <button type="button" class="ref" data-ref="Мф 8:11" aria-expanded="false">Мф 8:11</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Мф 8:11" aria-expanded="false">Мф 8:11</button><span class="sep">; </span><button type="button" class="ref" data-ref="Лк 13:28" aria-expanded="false">Лк 13:28</button></span></li><li class="fact "><span class="ft">Притча о богаче и Лазаре: <q class="cit">«лоно Авраамово»</q> <button type="button" class="ref" data-ref="Лк 16:22-31" aria-expanded="false">Лк 16:22–31</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Лк 16:22-31" aria-expanded="false">Лк 16:22–31</button></span></li></ul><ul class="facts more-list" hidden><li class="fact "><span class="ft">Спор Иисуса с иудеями о детях Авраама: <q class="cit">«прежде нежели был Авраам, Я есмь»</q> <button type="button" class="ref" data-ref="Ин 8:33-58" aria-expanded="false">Ин 8:33–58</button></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Ин 8:33-58" aria-expanded="false">Ин 8:33–58</button></span></li><li class="fact "><span class="ft">Речь Стефана о призвании и завете Авраама</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Деян 7:2-8" aria-expanded="false">Деян 7:2–8</button></span></li><li class="fact "><span class="ft"><q class="cit">«Семя Авраамово»</q> <button type="button" class="ref" data-ref="2Кор 11:22" aria-expanded="false">2 Кор 11:22</button>: Павел — о себе и о всех, кто Христов</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Рим 11:1" aria-expanded="false">Рим 11:1</button><span class="sep">; </span><button type="button" class="ref" data-ref="2Кор 11:22" aria-expanded="false">2 Кор 11:22</button><span class="sep">; </span><button type="button" class="ref" data-ref="Гал 3:29" aria-expanded="false">Гал 3:29</button></span></li><li class="fact "><span class="ft">Иносказание о двух сыновьях Авраама — от рабы и от свободной</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Гал 4:22-31" aria-expanded="false">Гал 4:22–31</button></span></li></ul><button type="button" class="morebtn" aria-expanded="false">ещё 4</button></section><section class="csec" aria-labelledby="s20"><h2 id="s20"><span class="snum">20</span> Места Писания</h2><p>Имя стоит в 291 стихах — счёт эскиза по форме имени. Впервые — <button type="button" class="ref" data-ref="Быт 11:26" aria-expanded="false">Быт 11:26</button></p>
<details class="explain"><summary>По книгам: 28</summary><ul class="booklist"><li><span class="bk">Бытие</span> <span class="bn">177</span></li><li><span class="bk">Исход</span> <span class="bn">9</span></li><li><span class="bk">Левит</span> <span class="bn">1</span></li><li><span class="bk">Числа</span> <span class="bn">1</span></li><li><span class="bk">Второзаконие</span> <span class="bn">7</span></li><li><span class="bk">Иисус Навин</span> <span class="bn">2</span></li><li><span class="bk">3 Царств</span> <span class="bn">1</span></li><li><span class="bk">4 Царств</span> <span class="bn">1</span></li><li><span class="bk">1 Паралипоменон</span> <span class="bn">6</span></li><li><span class="bk">2 Паралипоменон</span> <span class="bn">2</span></li><li><span class="bk">Неемия</span> <span class="bn">1</span></li><li><span class="bk">Есфирь</span> <span class="bn">1</span></li><li><span class="bk">Псалтирь</span> <span class="bn">4</span></li><li><span class="bk">Исаия</span> <span class="bn">4</span></li><li><span class="bk">Иеремия</span> <span class="bn">1</span></li><li><span class="bk">Иезекииль</span> <span class="bn">1</span></li><li><span class="bk">Михей</span> <span class="bn">1</span></li><li><span class="bk">От Матфея</span> <span class="bn">6</span></li><li><span class="bk">От Марка</span> <span class="bn">1</span></li><li><span class="bk">От Луки</span> <span class="bn">15</span></li><li><span class="bk">От Иоанна</span> <span class="bn">9</span></li><li><span class="bk">Деяния</span> <span class="bn">7</span></li><li><span class="bk">Иакова</span> <span class="bn">2</span></li><li><span class="bk">1 Петра</span> <span class="bn">1</span></li><li><span class="bk">Римлянам</span> <span class="bn">9</span></li><li><span class="bk">2 Коринфянам</span> <span class="bn">1</span></li><li><span class="bk">Галатам</span> <span class="bn">9</span></li><li><span class="bk">Евреям</span> <span class="bn">11</span></li></ul></details></section><section class="csec study" aria-labelledby="s21"><h2 id="s21"><span class="snum">21</span> Для изучающих</h2><ul class="facts"><li class="fact "><span class="ft">Возраст Фарры при рождении Аврама — 130 лет — выводится: Фарра умер в Харране 205 лет (Быт 11:32), Аврам вышел из Харрана 75 лет (Быт 12:4) <q class="cit">«по смерти отца его»</q> <button type="button" class="ref" data-ref="Деян 7:4" aria-expanded="false">Деян 7:4</button> (Деян 7:4). Слова <q class="cit">«Фарра жил семьдесят лет и родил Аврама, Нахора и Арана»</q> <button type="button" class="ref" data-ref="Быт 11:26" aria-expanded="false">Быт 11:26</button> (Быт 11:26) при этом понимаются как возраст Фарры при рождении старшего из сыновей, а Аврам назван первым как главное лицо повествования. В альтернативной модели Фарре 70 лет при рождении Аврама; тогда Фарра жил ещё 60 лет после ухода Аврама из Харрана, что расходится с Деян 7:4</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 11:26" aria-expanded="false">Быт 11:26</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 11:32" aria-expanded="false">Быт 11:32</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 12:4" aria-expanded="false">Быт 12:4</button><span class="sep">; </span><button type="button" class="ref" data-ref="Деян 7:4" aria-expanded="false">Деян 7:4</button></span></li><li class="fact "><span class="ft">Бог предсказал 400 лет порабощения потомков (Быт 15:13; Деян 7:6). Исх 12:40 (основной текст) говорит о 430 годах пребывания в Египте, а Павел считает 430 лет от обетования Аврааму до закона (Гал 3:17). На этом расхождении основаны модели длинного и краткого пребывания в Египте</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 15:13" aria-expanded="false">Быт 15:13</button><span class="sep">; </span><button type="button" class="ref" data-ref="Деян 7:6" aria-expanded="false">Деян 7:6</button><span class="sep">; </span><button type="button" class="ref" data-ref="Исх 12:40" aria-expanded="false">Исх 12:40</button><span class="sep">; </span><button type="button" class="ref" data-ref="Гал 3:17" aria-expanded="false">Гал 3:17</button></span></li><li class="fact "><span class="ft">Стефан говорит, что патриархи <q class="cit">«положены во гробе, который купил Авраам ценою серебра у сынов Еммора Сихемова»</q> <button type="button" class="ref" data-ref="Деян 7:16" aria-expanded="false">Деян 7:16</button> (Деян 7:16). По Бытию Авраам купил пещеру Махпела у Ефрона Хеттеянина близ Хеврона (Быт 23:16–20), а участок у Сихема у сынов Еммора купил Иаков (Быт 33:19; Нав 24:32). Расхождение объясняют по-разному (например, сжатием двух покупок в речи Стефана); в данных покупка Авраама — по Быт 23</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Деян 7:16" aria-expanded="false">Деян 7:16</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 23:16-20" aria-expanded="false">Быт 23:16–20</button><span class="sep">; </span><button type="button" class="ref" data-ref="Быт 33:19" aria-expanded="false">Быт 33:19</button><span class="sep">; </span><button type="button" class="ref" data-ref="Нав 24:32" aria-expanded="false">Нав 24:32</button></span></li><li class="fact "><span class="ft">В Быт 14:20 подлежащее <q class="cit">«[Аврам]»</q> <button type="button" class="ref" data-ref="Быт 14:20" aria-expanded="false">Быт 14:20</button> стоит в квадратных скобках; что десятину Мелхиседеку дал Авраам, прямо сказано в Евр 7:2, 4, 6</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Быт 14:20" aria-expanded="false">Быт 14:20</button><span class="sep">; </span><button type="button" class="ref" data-ref="Евр 7:2,4,6" aria-expanded="false">Евр 7:2,4,6</button></span></li></ul></section></div></div></div></template>

<p class="sketch-note"><span class="tag">эскиз</span> Карточка сокращена: пропущены разделы 1, 5, 6, 8, 9, 13, 19; в разделах 7, 11, 12 показано начало.</p><div class="sections"><section class="csec" aria-labelledby="s3"><h2 id="s3"><span class="snum">3</span> Кто это</h2><ul class="facts"><li class="fact "><span class="ft">Царь над Иудою в Хевроне; в Иерусалиме — над всем Израилем и Иудою</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="2Цар 5:5" aria-expanded="false">2 Цар 5:5</button></span></li></ul></section><section class="csec" aria-labelledby="s4"><h2 id="s4"><span class="snum">4</span> Родители</h2><ul class="facts"><li class="fact "><span class="ft">Отец — Иессей</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Руф 4:22" aria-expanded="false">Руф 4:22</button><span class="sep">; </span><button type="button" class="ref" data-ref="1Цар 16:19" aria-expanded="false">1 Цар 16:19</button><span class="sep">; </span><button type="button" class="ref" data-ref="1Цар 17:12" aria-expanded="false">1 Цар 17:12</button></span></li><li class="fact "><span class="ft">Мать текст не называет</span> </li></ul></section><section class="csec" aria-labelledby="s7"><h2 id="s7"><span class="snum">7</span> Семья</h2><ul class="facts"><li class="fact "><span class="ft">Ахиноама Изреелитянка — Амнон, первенец</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="1Пар 3:1" aria-expanded="false">1 Пар 3:1</button></span></li><li class="fact "><span class="ft">Авигея Кармилитянка — Далуия</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="1Пар 3:1" aria-expanded="false">1 Пар 3:1</button></span></li><li class="fact "><span class="ft">Вирсавия — Шима, Шовав, Нафан, Соломон; во 2 Цар 5:14 — Самус, Совав</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="1Пар 3:5" aria-expanded="false">1 Пар 3:5</button><span class="sep">; </span><button type="button" class="ref" data-ref="2Цар 5:14" aria-expanded="false">2 Цар 5:14</button></span></li><li class="fact "><span class="ft">Сыновья, рождённые в Иерусалиме: Ивхар, Елишама, Елифелет и другие — мать текст не называет</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="1Пар 3:6-8" aria-expanded="false">1 Пар 3:6–8</button></span></li><li class="fact "><span class="ft">Сыновья от наложниц — по имени не названы</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="1Пар 3:9" aria-expanded="false">1 Пар 3:9</button></span></li><li class="fact "><span class="ft">Ещё жёны и наложницы — не названы</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="2Цар 5:13" aria-expanded="false">2 Цар 5:13</button></span></li></ul><p class="muted">ещё 5 союзов — в эскизе не показаны</p><p><a class="btn" href="#/stub/%D0%93%D0%B5%D0%BD%D0%B5%D0%B0%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F%20%E2%80%94%20%D0%94%D0%B0%D0%B2%D0%B8%D0%B4">Открыть семью</a></p></section><section class="csec" aria-labelledby="s10"><h2 id="s10"><span class="snum">10</span> Время</h2><ul class="facts"><li class="fact "><span class="ft">Воцарился: <q class="cit">«Тридцать лет было Давиду, когда он воцарился»</q> <button type="button" class="ref" data-ref="2Цар 5:4" aria-expanded="false">2 Цар 5:4</button></span> </li><li class="fact "><span class="ft">Царствовал сорок лет</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="2Цар 5:4" aria-expanded="false">2 Цар 5:4</button></span></li><li class="fact "><span class="ft">в Хевроне — семь лет и шесть месяцев; в Иерусалиме — тридцать три года</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="2Цар 5:5" aria-expanded="false">2 Цар 5:5</button></span></li><li class="fact "><span class="ft">При смерти — около семидесяти лет</span> <span class="cert simple">так следует из сравнения стихов</span><abbr class="cert study" title="вывод: следует из сравнения стихов">выв.</abbr><span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="2Цар 5:4-5" aria-expanded="false">2 Цар 5:4–5</button><span class="sep">; </span><button type="button" class="ref" data-ref="3Цар 2:10-11" aria-expanded="false">3 Цар 2:10–11</button></span></li><li class="fact study">Около 1040–970 гг. до Р. Х. <span class="cert simple">год примерный, расчёт атласа</span><abbr class="cert study" title="расчёт по модели атласа">расч.</abbr> модель «масоретская, длинное пребывание»</li></ul><p><a class="btn" href="#/time/p-david">Время</a></p></section><section class="csec" aria-labelledby="s11"><h2 id="s11"><span class="snum">11</span> Встречи и связи</h2><ul class="facts"><li class="fact "><span class="ft">Саул — называл его <q class="cit">«сын Иессеев»</q></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="1Цар 20:27" aria-expanded="false">1 Цар 20:27</button></span></li></ul></section><section class="csec" aria-labelledby="s12"><h2 id="s12"><span class="snum">12</span> Места</h2><ul class="facts"><li class="fact "><span class="ft">Вифлеем — <q class="cit">«в свой город Вифлеем»</q></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="1Цар 20:6" aria-expanded="false">1 Цар 20:6</button></span></li><li class="fact "><span class="ft"><q class="cit">«откуда был Давид»</q></span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Ин 7:42" aria-expanded="false">Ин 7:42</button></span></li><li class="fact "><span class="ft">Хеврон; Иерусалим</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="2Цар 5:5" aria-expanded="false">2 Цар 5:5</button></span></li></ul></section><section class="csec" aria-labelledby="s14"><h2 id="s14"><span class="snum">14</span> По порядку</h2><ul class="facts"></ul></section><section class="csec" aria-labelledby="s15"><h2 id="s15"><span class="snum">15</span> Слова</h2><ul class="facts"><li class="fact "><span class="ft"><q class="cit">«ты идешь против меня с мечом и копьем и щитом, а я иду против тебя во имя Господа Саваофа»</q> <button type="button" class="ref" data-ref="1Цар 17:45" aria-expanded="false">1 Цар 17:45</button> — отвечал Филистимлянину; Филистимлянин — Голиаф</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="1Цар 17:23" aria-expanded="false">1 Цар 17:23</button></span></li></ul></section><section class="csec" aria-labelledby="s16"><h2 id="s16"><span class="snum">16</span> Перед Богом</h2><ul class="facts"><li class="fact "><span class="ft"><q class="cit">«нашел Я мужа по сердцу Моему, Давида, сына Иессеева»</q> <button type="button" class="ref" data-ref="Деян 13:22" aria-expanded="false">Деян 13:22</button> — слова Бога в речи Павла</span> </li></ul></section><section class="csec" aria-labelledby="s17"><h2 id="s17"><span class="snum">17</span> Смерть и погребение</h2><ul class="facts"><li class="fact "><span class="ft"><q class="cit">«И почил Давид с отцами своими и погребен был в городе Давидовом»</q> <button type="button" class="ref" data-ref="3Цар 2:10" aria-expanded="false">3 Цар 2:10</button></span> </li></ul></section><section class="csec" aria-labelledby="s18"><h2 id="s18"><span class="snum">18</span> В родословии Иисуса Христа</h2><ul class="facts"><li class="fact "><span class="ft">Матфей: Давидом кончаются первые четырнадцать родов от Авраама</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Мф 1:6" aria-expanded="false">Мф 1:6</button><span class="sep">; </span><button type="button" class="ref" data-ref="Мф 1:17" aria-expanded="false">Мф 1:17</button></span></li><li class="fact "><span class="ft">Лука: <q class="cit">«Нафанов, Давидов»</q> — его ветвь идёт через Нафана</span> <span class="sr">стихи:</span><span class="refs"><button type="button" class="ref" data-ref="Лк 3:31" aria-expanded="false">Лк 3:31</button></span></li><li class="fact study">Мф — 14-й от Авраама; Лк — 42-й от Иосифа (по счёту атласа)</li></ul></section><section class="csec" aria-labelledby="s20"><h2 id="s20"><span class="snum">20</span> Места Писания</h2><p>Имя стоит в 981 стихах — счёт эскиза по форме имени. Впервые — <button type="button" class="ref" data-ref="Руф 4:17" aria-expanded="false">Руф 4:17</button></p>

iv></div></template>
