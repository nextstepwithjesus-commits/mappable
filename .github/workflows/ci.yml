name: Проверка и сборка

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Данные — сверка с Синодальным текстом
        run: npm run -s validate -- --quiet
      - name: Сборка данных (хронология, раскладка)
        run: npm run -s data
      - name: Координаты опорных звёзд (NFR-3)
        run: npm run -s coords
      - name: Тесты движка
        run: npm test
      - name: Типы
        run: npx tsc --noEmit -p .
      - name: Контраст и различимость лент
        run: npm run -s contrast
      - name: Сборка сайта
        run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: toledot-site
          path: dist

  accept:
    # сценарии приёмки ТЗ § 11.2 в настоящем браузере; снимки — в артефакте
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Браузер для Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run -s data
      - run: npx vite build
      - name: Сценарии приёмки
        run: npm run -s accept
      - name: Доступность (axe-core, WCAG 2.1 AA)
        run: npm run -s a11y
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-screens
          path: docs/screens/accept-*.png
